r=cl(r+n,0,255)|0;g=cl(g+n,0,255)|0;b=cl(b+n,0,255)|0;return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

function tx(t,x,y,o={}){const s=o.size||16;ctx.font=(o.weight||'')+' '+s+'px Consolas,monospace';
ctx.textAlign=o.align||'left';ctx.textBaseline=o.baseline||'alphabetic';ctx.fillStyle=o.color||'#e6e6f0';
if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.glowBlur||12;}ctx.fillText(t,x,y);ctx.shadowBlur=0;}
function txClip(t,x,y,maxW,o={}){const s=o.size||16;ctx.font=(o.weight||'')+' '+s+'px Consolas,monospace';
  if(ctx.measureText(t).width<=maxW){tx(t,x,y,o);return;}
  let lo=0,hi=t.length;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(ctx.measureText(t.slice(0,mid)+'…').width<=maxW)lo=mid;else hi=mid-1;}
  tx(t.slice(0,lo)+'…',x,y,o);}
function txFit(t,x,y,maxW,o={},minSize=9){let s=o.size||16;ctx.font=(o.weight||'')+' '+s+'px Consolas,monospace';
  while(s>minSize && ctx.measureText(t).width>maxW){s--;ctx.font=(o.weight||'')+' '+s+'px Consolas,monospace';}
  if(ctx.measureText(t).width>maxW) txClip(t,x,y,maxW,{...o,size:s});else tx(t,x,y,{...o,size:s});}
function wrapText(text,maxW,size,weight){ctx.font=(weight||'')+' '+size+'px Consolas,monospace';
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW && cur){lines.push(cur);cur=w;}else cur=test;}
  if(cur)lines.push(cur);return lines;}
function bar(x,y,w,h,v,m,c,bg='#1a1a24'){ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);
const f=m>0?cl(v/m,0,1)*w:0;if(f>0){ctx.fillStyle=c;ctx.fillRect(x,y,f,h);}
ctx.strokeStyle='#333348';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
function icon(name,x,y,s,c){ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=2;
if(name==='flame'){ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*.7,-s*.2,s*.3,s*.6);
ctx.quadraticCurveTo(0,s*.9,-s*.3,s*.6);ctx.quadraticCurveTo(-s*.7,-s*.2,0,-s);ctx.fill();}
else if(name==='water'){ctx.beginPath();ctx.arc(0,0,s*.7,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.3,0,7);ctx.fill();}
else if(name==='wind'){ctx.beginPath();ctx.moveTo(-s,s*.2);ctx.quadraticCurveTo(0,-s,s,0);
ctx.quadraticCurveTo(0,s*.4,-s,s*.2);ctx.stroke();}
else if(name==='earth'){ctx.fillRect(-s*.7,-s*.3,s*1.4,s*.7);ctx.fillRect(-s*.3,-s*.8,s*.6,s*.5);}
else if(name==='light'){ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*6.28;ctx.moveTo(0,0);
ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);}ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.4,0,7);ctx.fill();}
else if(name==='dark'){ctx.beginPath();ctx.arc(0,0,s*.6,0,7);ctx.fill();ctx.globalCompositeOperation='destination-out';
ctx.beginPath();ctx.arc(s*.3,-s*.1,s*.5,0,7);ctx.fill();}
else if(name==='skill'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s,0);ctx.lineTo(0,s);ctx.lineTo(-s,0);ctx.closePath();ctx.stroke();}
else{ctx.beginPath();ctx.arc(0,0,s*.5,0,7);ctx.fill();}
ctx.restore();}

const MEDIA = {
  music: {

    // ending: 'assets/ending.mp4',
    // menuBg: 'assets/menu_bg.mp4'
  },
  _imgCache: {},
  _vidCache: {},
  getSprite(name) {
    const src = this.sprites[name];
    if (!src) return null;
    if (!this._imgCache[src]) {
      const img = new Image();
      img.src = src;
      this._imgCache[src] = img;
    }
    const img = this._imgCache[src];
    return (img.complete && img.naturalWidth > 0) ? img : null;
  },
  playVideo(key, loop = false, onEnd = null) {
    const src = this.videos[key];
    if (!src) return null;
    let vid = this._vidCache[key];
    if (!vid) {
      vid = document.createElement('video');
      vid.src = src;
      vid.playsInline = true;
      this._vidCache[key] = vid;
    }
    vid.loop = loop;
    vid.muted = false;
    vid.volume = 0.75;
    vid.currentTime = 0;
    vid.onended = () => { if (onEnd) onEnd(); };
    vid.play().catch(() => {
      vid.muted = true;
      vid.play().catch(() => {});
    });
    return vid;
  },
  stopVideo(key) {
    const vid = this._vidCache[key];
    if (vid) { vid.pause(); vid.currentTime = 0; }
  }
};

const AU={c:null,m:null,f:null,en:true,init:false,tr:null,t:null,_pendingMusic:null,step:0,bgmAudio:null,
i(){if(this.init)return;try{const A=window.AudioContext||window.webkitAudioContext;
this.c=new A();this.m=this.c.createGain();this.m.gain.value=0.38;
this.f=this.c.createBiquadFilter();this.f.type='lowpass';this.f.frequency.value=1400;
this.f.connect(this.m);this.m.connect(this.c.destination);this.init=true;
if(this.c.state==='suspended')this.c.resume();
if(this._pendingMusic){const pm=this._pendingMusic;this._pendingMusic=null;this.music(pm);}}
catch(e){this.en=false;}},
setMuffle(muffled){
  if(this.bgmAudio)this.bgmAudio.volume=muffled?0.15:0.45;
  if(!this.f||!this.c)return;
  try{this.f.frequency.setTargetAtTime(muffled?380:1400,this.c.currentTime,0.08);}catch(e){}
},
n(freq,dur,vol,tp,detune=0){if(!this.en||!this.c)return;try{const now=this.c.currentTime;
const o=this.c.createOscillator(),g=this.c.createGain();
o.type=tp||'sine';o.frequency.setValueAtTime(freq,now);if(detune)o.detune.setValueAtTime(detune,now);
g.gain.setValueAtTime(0.001,now);g.gain.linearRampToValueAtTime(vol||0.06,now+0.015);
g.gain.exponentialRampToValueAtTime(0.001,now+dur);
o.connect(g);g.connect(this.f);o.start(now);o.stop(now+dur);}catch(e){}},
sfx(n){if(!this.en||!this.c)return;
if(n==='hit')this.n(180,0.05,0.06,'square');
else if(n==='crit'){this.n(440,0.06,0.08,'square');setTimeout(()=>this.n(660,0.09,0.07,'square'),35);}
else if(n==='damage'){this.n(95,0.16,0.11,'sawtooth');setTimeout(()=>this.n(55,0.24,0.09,'sine'),40);}
else if(n==='kill'){this.n(320,0.08,0.07,'sine');setTimeout(()=>this.n(160,0.12,0.05,'sine'),55);}
else if(n==='pickup'){this.n(880,0.06,0.06,'triangle');setTimeout(()=>this.n(1320,0.1,0.07,'triangle'),45);}

else if(n==='defeat'){[420,320,240,160].forEach((f,i)=>setTimeout(()=>this.n(f,0.38,0.10,'sawtooth'),i*160));}
else if(n==='lvl'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.n(f,0.14,0.08,'triangle'),i*65));}
else if(n==='boss'){this.n(82,0.6,0.16,'sawtooth');this.n(110,0.5,0.12,'square',-15);}
else if(n==='evo'){for(let i=0;i<6;i++)setTimeout(()=>this.n(261*Math.pow(1.18,i),0.24,0.09,'triangle'),i*65);}
else if(n==='dodge')this.n(880,0.1,0.06,'sine');
else if(n==='sel')this.n(700,0.05,0.05,'triangle');

else if(n==='slow'){this.n(600,0.4,0.08,'sine');setTimeout(()=>this.n(300,0.6,0.08,'sine'),150);}},
music(tp){
  if(!this.en){this._pendingMusic=tp;return;}
  if(this.tr===tp)return;
  this.stop();this.tr=tp;this.step=0;
  if(MEDIA.music[tp]){
    try{
      const a=new Audio(MEDIA.music[tp]);
      a.loop=true;a.volume=0.45;
      a.play().catch(()=>{});
      this.bgmAudio=a;
      return;
    }catch(e){}
  }
  if(!this.init){this._pendingMusic=tp;return;}
  const tracks={
    menu:{seq:[261.6,329.6,392.0,493.9,523.3,493.9,392.0,329.6],bass:[130.8,130.8,164.8,164.8,196.0,196.0,164.8,164.8],dur:360,wave:'triangle'},

    dragon:{seq:[146.8,174.6,220.0,261.6,293.7,261.6,220.0,174.6],bass:[73.4,73.4,87.3,87.3,110.0,110.0,87.3,87.3],dur:185,wave:'sawtooth'},
    final:{seq:[82.4,98.0,110.0,123.5,130.8,123.5,110.0,98.0],bass:[41.2,41.2,49.0,55.0,65.4,55.0,49.0,41.2],dur:170,wave:'sawtooth'}
  };
  const cfg=tracks[tp]||tracks.menu;
  this.t=setInterval(()=>{
    if(!this.en)return;
    const idx=this.step%cfg.seq.length;
    this.n(cfg.seq[idx],(cfg.dur/1000)*0.9,0.045,cfg.wave);
    if(this.step%2===0)this.n(cfg.bass[idx],(cfg.dur/1000)*1.8,0.055,'sine');
    this.step++;
  },cfg.dur);
},
stop(){
  if(this.t)clearInterval(this.t);
  this.t=null;this.tr=null;
  if(this.bgmAudio){try{this.bgmAudio.pause();this.bgmAudio.currentTime=0;}catch(e){}this.bgmAudio=null;}
}};

function fan(desc,cd,cnt,spread,dmg,color,r,pierce,el){return{desc,cd,el,cast(g,p,t){
  const tier=p.skills[this.n].tier;
  const extra=p.projBonus||0;
  let dB=1+0.03*(p.resonanceCount||0);
  if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const elm=elemMul(p,el);
  const d=(dmg * TM[tier] + p.atk) * dB * cm * elm;
  const sType=(tier>=TIER_SUP||p.forceSupreme)?'supreme':'normal';
  const pc=(pierce||0)+(p.pierceBonus||0);
  const pa=predictAim(p.x,p.y,t,640);const a0=pa!==null?pa:p.aim;
  const total=cnt+extra;
  const spreadMul=Math.min(6.283/spread,p.aoeMult||1);const sp=spread * spreadMul;
  const rSize=r * (p.aoeMult||1);
  for(let i=0;i<total;i++){const a=a0+(i-(total-1)/2) * sp;
    g.proj.push(new Proj(p.x,p.y,Math.cos(a) * 640,Math.sin(a) * 640,d,color,rSize,true,pc,sType));}
  for(let i=0;i<8;i++)g.particles.push(new Part(p.x,p.y,color));}};}

function burst(desc,cd,dmg,color,r,el){return{desc,cd,el,cast(g,p){
  const tier=p.skills[this.n].tier;
  const extra=p.projBonus||0;
  const pulses=1+extra;
  for(let pulse=0;pulse<pulses;pulse++){
    addTimer(g,pulse * 0.16,()=>{
      if(!p||g.state!=='playing')return;
      let dB=1+0.03*(p.resonanceCount||0);
      if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
      if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
      if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
      const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
      const elm=elemMul(p,el);
      const d=(dmg * TM[tier] + p.mag) * dB * cm * elm * (pulse===0?1:0.75);
      const R=r * (p.aoeMult||1);
      const sType=(tier>=TIER_SUP||p.forceSupreme)?'supreme':'normal';
      for(const e of g.enemies)if(e.alive&&d2(e.x,e.y,p.x,p.y)<R * R)e.dmg(d,sType);
      for(const b of g.bosses)if(b.alive&&d2(b.x,b.y,p.x,p.y)<R * R)b.dmg(d,sType);
      if(g.shockwaves)g.shockwaves.push(new Shockwave(p.x,p.y,R,color,0.32));
      for(let i=0;i<16;i++){const a=i/16 * 6.283;
        g.particles.push(new Part(p.x + Math.cos(a) * R * 0.85,p.y + Math.sin(a) * R * 0.85,color));}
    });
  }
}};}

function shot(desc,cd,dmg,color,pierce,speed,el){return{desc,cd,el,cast(g,p,t){
  const tier=p.skills[this.n].tier;
  const extra=p.projBonus||0;
  let dB=1+0.03*(p.resonanceCount||0);
  if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const elm=elemMul(p,el);
  const d=(dmg * TM[tier] + p.mag) * dB * cm * elm;
  const spd=speed||800;
  const pa=predictAim(p.x,p.y,t,spd);const a0=pa!==null?pa:p.aim;
  const pc=(pierce||0)+(p.pierceBonus||0);
  const sType=(tier>=TIER_SUP||p.forceSupreme)?'supreme':'normal';
  const total=1+extra;
  for(let i=0;i<total;i++){
    const a=a0+(i-(total-1)/2) * 0.12;
    g.proj.push(new Proj(p.x,p.y,Math.cos(a) * spd,Math.sin(a) * spd,d,color,6 * (p.aoeMult||1),true,pc,sType));
  }
}};}
function src(tier){return tier>=TIER_SUP?'supreme':'normal';}
function predictAim(px,py,t,projSpeed){if(!t)return null;
  const spdPx=t.isBoss?(t.ph===1?70:100):(t.spd||0)*62;
  const ea=Math.atan2(py-t.y,px-t.x);const evx=Math.cos(ea)*spdPx;const evy=Math.sin(ea)*spdPx;
  let tt=Math.sqrt((px-t.x)**2+(py-t.y)**2)/projSpeed;
  for(let k=0;k<3;k++){const predX=t.x+evx*tt;const predY=t.y+evy*tt;
    tt=Math.sqrt((px-predX)**2+(py-predY)**2)/projSpeed;}
  return Math.atan2((t.y+evy*tt)-py,(t.x+evx*tt)-px);}
function xpForLevels(p,n){
  let total=0;let xpn=p.xpn;
  const fullLevels = Math.floor(n);
  const fractional = n - fullLevels;
  for(let i=0;i<fullLevels;i++){ total+=xpn; xpn=Math.floor(xpn*1.25); }
  if (fractional > 0) { total += xpn * fractional; }
  return total;
}
function scaleEnemyToWave(e,wave){const hpMul=wave<=20?1+0.01*(wave-1):Math.pow(1.03,wave-20)*1.19;
  const xpMul=wave<=20?1+0.10*(wave-1):Math.pow(1.08,wave-20)*2.90;
  e.maxHp=Math.floor(e.maxHp*hpMul);e.hp=e.maxHp;e.atk=Math.floor(e.atk*hpMul);e.xp=Math.floor(e.xp*xpMul);return e;}
function makeChaosEnemy(e){e.chaos=true;e.maxHp=Math.floor(e.maxHp*1.3);e.hp=e.maxHp;e.atk=Math.floor(e.atk*1.5);
  e.spd=e.spd*1.2;e.xp=Math.floor(e.xp*1.5);e.z=e.z*1.15;e.c=sh(e.c,-25);return e;}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

function doMeleeHit(g, p, angle, range, arc, dmg, src) {
    let hitAny = false;
    const checkHit = (e) => {
        if (!e.alive) return;
        const dx = e.x - p.x, dy = e.y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist <= range + e.z) {
            const angleTo = Math.atan2(dy, dx);
            let aDiff = Math.abs(angleTo - angle);
            if (aDiff > Math.PI) aDiff = Math.PI * 2 - aDiff;
            if (aDiff <= arc / 2) {
                const isCrit = Math.random()*100 < p.crit;
                let finalDmg = dmg * (isCrit ? p.cdmg : 1);
                e.dmg(finalDmg, src);
                hitAny = true;
                for(let j=0;j<5;j++) g.particles.push(new Part(e.x, e.y, p.c));
                if (p.wepHope) {
                    const heal = p.maxHp * 0.005;
                    p.hp = Math.min(p.maxHp, p.hp + heal);
                    g.ftxt.push(new FTxt('+'+~~heal+' HP', e.x, e.y-15, '#fff8c0', 1.2, 12));
                }
            }
        }
    };
    for (const e of g.enemies) checkHit(e);
    for (const b of g.bosses) checkHit(b);
    if (hitAny) {
        g.shake = 3;
        AU.sfx('hit');
    }

'Небесный Суд':{desc:'Святой крест. 4 луча света.',cd:8,cast(g,p,t){

  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const d=(80*TM[tier]+p.mag*1.2)*dB*cm*elemMul(p,this.el);
  const sType=src(tier);
  // Крест из 4 лучей, центр = игрок
  laserCross(g, p.x, p.y, 4, {
    length: 900*(p.aoeMult||1),
    width: 30*(p.aoeMult||1),
    telegraph: 0.35,
    duration: 0.8,
    dps: 0,
    dmg: d,
    color: '#ffe040',
    friendly: true,
    pierce: 99,
    src: src,
    ownerSkill: this.n,
    pierceBonus: p.pierceBonus||0
  });
  g.flash = 0.3;
  g.ftxt.push(new FTxt('НЕБЕСНЫЙ КРЕСТ!', p.x, p.y-40, '#fff0c0', 2.5, 22));
  castVis(g, p, '#fff0c0', 30, 0);
}},

function availableElites(g){
  return ELITE.filter(e=>{
    if(e.unlock.type==='wave') return g.wave>=e.unlock.val;
    if(e.unlock.type==='boss'){
      if(!g.bsSpawned.has(e.unlock.key)) return false;
      const t=BT[e.unlock.key];
      if(t&&t.pair){return !g.bosses.some(b=>t.pair.includes(b.bn));}
      return !g.bosses.some(b=>b.bn===e.unlock.key);
    }
    return false;
  });
}

const edge=Math.min(WW-this.x,this.x)*2-40;const maxW=Math.max(120,Math.min(680,edge));

class Part{
constructor(x,y,c){this.x=x;this.y=y;this.c=c;
const a=rnd(0,6.28),s=rnd(80,320);this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
this.l=rnd(.3,.8);this.ml=this.l;this.z=rnd(2,5);}
update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=.94;this.vy*=.94;this.l-=dt;}

ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.z*a,0,7);ctx.fill();ctx.globalAlpha=1;}
}

class Slash {
  constructor(x,y,angle,radius,arc,color){
    this.x=x; this.y=y; this.angle=angle; this.radius=radius;
    this.arc=arc; this.color=color; this.life=0.15; this.maxLife=0.15;
  }
  update(dt){ this.life-=dt; }
  draw(){
    const a = cl(this.life / this.maxLife, 0, 1);
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
    ctx.globalAlpha = a * 0.40;
    ctx.strokeStyle = this.color; ctx.lineWidth = 7 * a; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, this.radius, -this.arc / 2, this.arc / 2); ctx.stroke();
    ctx.globalAlpha = a * 0.14; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(0, 0, this.radius, -this.arc / 2, this.arc / 2); ctx.lineTo(0, 0); ctx.fill();
    ctx.restore();
  }
}

class Proj{
constructor(x,y,vx,vy,dmg,c,r,fr,pierce,src,explR,explDmg){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.dmg=dmg;this.c=c;this.r=r;
this.fr=fr;this.pierce=pierce||0;this.alive=true;this.l=fr?2:4;this.tr=[];this.src=src||'normal';
this.explR=explR||0;this.explDmg=explDmg||0;this.hitIds=new Set();
this.curve=0;this.speed0=0;
this.angle=Math.atan2(vy, vx);
this.visType='circle';
this.bounce = false;
this.curveFlipAt=undefined;this.curveFlipTo=0;this.curveFlipped=false;
this.echoPhase=null;this.echoTimer=0;this.echoWait=0;this.echoBurst=0;
this.echoBurstSpeed=0;this.echoBurstDmg=0;this.echoBurstColor='#fff';}
setCurve(av,lifetime){this.curve=av;this.speed0=Math.sqrt(this.vx**2+this.vy**2);
  this.angle=Math.atan2(this.vy,this.vx);if(lifetime)this.l=lifetime;return this;}
setCurveFlip(av1,av2,flipTime,lifetime){this.curve=av1;this.curveFlipTo=av2;this.curveFlipAt=flipTime;
  this.curveFlipped=false;this.speed0=Math.sqrt(this.vx**2+this.vy**2);
  this.angle=Math.atan2(this.vy,this.vx);if(lifetime)this.l=lifetime;return this;}
setEcho(fuse,waitTime,burstCount,burstSpeed,burstDmg,burstColor){
  this.echoPhase='fly';this.echoTimer=fuse+waitTime;this.echoWait=waitTime;
  this.echoBurst=burstCount;this.echoBurstSpeed=burstSpeed;this.echoBurstDmg=burstDmg;
  this.echoBurstColor=burstColor||this.c;this.l=fuse+waitTime+1;return this;}
update(dt){
  if(this.curveFlipAt!==undefined&&!this.curveFlipped){this.curveFlipAt-=dt;
    if(this.curveFlipAt<=0){this.curveFlipped=true;this.curve=this.curveFlipTo;}}
  if(this.curve){this.angle+=this.curve*dt;
    this.vx=Math.cos(this.angle)*this.speed0;this.vy=Math.sin(this.angle)*this.speed0;}
  if(this.echoPhase==='fly'){this.echoTimer-=dt;
    if(this.echoTimer<=this.echoWait){this.echoPhase='wait';this.vx=0;this.vy=0;}}
  else if(this.echoPhase==='wait'){this.echoTimer-=dt;}
  this.tr.push(this.x,this.y);if(this.tr.length>10){this.tr.shift();this.tr.shift();}
  this.x+=this.vx*dt;this.y+=this.vy*dt;this.l-=dt;

  if (this.bounce) {
      if (this.x < 10 || this.x > WW-10) {
          this.vx *= -1; this.x = cl(this.x, 10, WW-10);
      }
      if (this.y < 10 || this.y > WH-10) {
          this.vy *= -1; this.y = cl(this.y, 10, WH-10);
      }
  }

  if(!this.echoPhase&&this.l<=0)this.alive=false;}
draw(){
for(let i=0;i<this.tr.length-2;i+=2){ctx.globalAlpha=(i/this.tr.length)*.4;ctx.fillStyle=this.c;
ctx.beginPath();ctx.arc(this.tr[i],this.tr[i+1],this.r*.6,0,7);ctx.fill();}
ctx.globalAlpha=1;

if(this.visType === 'arrow') {
   ctx.save();ctx.translate(this.x, this.y);ctx.rotate(this.angle);ctx.fillStyle = this.c;
   ctx.fillRect(-this.r*3, -this.r/2, this.r*3, this.r); 
   ctx.beginPath();ctx.moveTo(this.r*3, -this.r*1.5);ctx.lineTo(this.r*5, 0);ctx.lineTo(this.r*3, this.r*1.5);ctx.closePath();ctx.fill(); 
   ctx.restore();
} else if(this.visType === 'beam') {
   ctx.save();ctx.translate(this.x, this.y);ctx.rotate(this.angle);ctx.fillStyle = this.c;
   ctx.fillRect(-this.r*5, -this.r/3, this.r*5, this.r/1.5); 
   ctx.restore();
} else {
   ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,7);ctx.fill();
}

if(this.explR>0){ctx.strokeStyle=this.c;ctx.globalAlpha=.3;ctx.lineWidth=1;
ctx.beginPath();ctx.arc(this.x,this.y,this.explR,0,7);ctx.stroke();ctx.globalAlpha=1;}
if(this.echoPhase==='wait'){
  const prog=1-Math.max(0,this.echoTimer)/this.echoWait;
  const pulse=0.5+Math.sin(performance.now()/80)*0.3;
  ctx.globalAlpha=pulse;ctx.strokeStyle=this.echoBurstColor;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(this.x,this.y,this.r+10+prog*22,0,7);ctx.stroke();ctx.globalAlpha=1;}
if(this.visType === 'circle'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.r*.4,0,7);ctx.fill();}
}}

class CosmicBeam{
  constructor(x,y,angle,length,width,dmg,src){
    this.x=x;this.y=y;this.angle=angle;
    this.length=length;
    this.endWidth=width;
    this.startWidth=6;
    this.dmg=dmg;this.src=src;
    this.life=0.45;this.maxLife=0.45;
    this.stars=[];
    for(let i=0;i<45;i++){
      this.stars.push({
        t: Math.random(),
        side: Math.random()*2-1,
        size: rnd(0.6,2.8),
        bright: rnd(0.4,1),
        phase: Math.random()*6.28,
        drift: rnd(-0.3,0.3)
      });
    }
  }
  hitsPoint(px,py,pr){
    const dx=Math.cos(this.angle),dy=Math.sin(this.angle);
    const vx=px-this.x,vy=py-this.y;
    const proj=vx*dx+vy*dy;
    if(proj<0||proj>this.length)return false;
    const perpX=vx-proj*dx,perpY=vy-proj*dy;
    const dist=Math.sqrt(perpX*perpX+perpY*perpY);
    const halfWidth=this.startWidth/2 + (this.endWidth/2-this.startWidth/2)*(proj/this.length);
    return dist<=halfWidth+pr;
  }
  update(dt){this.life-=dt;}
  draw(){
    const a=cl(this.life/this.maxLife,0,1);
    const endX=this.x+Math.cos(this.angle)*this.length;
    const endY=this.y+Math.sin(this.angle)*this.length;
    const px=-Math.sin(this.angle),py=Math.cos(this.angle);
    const sR=this.startWidth/2, eR=this.endWidth/2;
    
    ctx.save();
    
    // 1. Основное тело — градиент космоса
    const grad=ctx.createLinearGradient(this.x,this.y,endX,endY);
    grad.addColorStop(0,'rgba(255,255,255,'+(0.95*a)+')');
    grad.addColorStop(0.1,'rgba(255,240,200,'+(0.85*a)+')');
    grad.addColorStop(0.3,'rgba(220,150,255,'+(0.7*a)+')');
    grad.addColorStop(0.55,'rgba(120,80,220,'+(0.55*a)+')');
    grad.addColorStop(0.8,'rgba(50,20,120,'+(0.35*a)+')');
    grad.addColorStop(1,'rgba(15,5,40,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(this.x+px*sR,this.y+py*sR);
    ctx.lineTo(endX+px*eR,endY+py*eR);
    ctx.lineTo(endX-px*eR,endY-py*eR);
    ctx.lineTo(this.x-px*sR,this.y-py*sR);
    ctx.closePath();
    ctx.fill();
    
    // 2. Звёзды (мерцают и дрейфуют к концу)
    const now=performance.now()/1000;
    for(const s of this.stars){
      const progress = (s.t + now*s.drift*0.1) % 1;
      const tX=this.x+Math.cos(this.angle)*this.length*progress;
      const tY=this.y+Math.sin(this.angle)*this.length*progress;
      const halfW=sR+(eR-sR)*progress;
      const sx=tX+px*s.side*halfW*0.9;
      const sy=tY+py*s.side*halfW*0.9;
      const twinkle=0.5+Math.sin(now*6+s.phase)*0.5;
      ctx.globalAlpha=a*s.bright*twinkle;
      ctx.fillStyle=Math.random()<0.1?'#ffe8a0':'#ffffff';
      ctx.beginPath();
      ctx.arc(sx,sy,s.size*twinkle,0,7);
      ctx.fill();
    }
    ctx.globalAlpha=1;
    
    // 3. Туманность — внутренние полосы
    ctx.globalAlpha=a*0.35;
    ctx.strokeStyle='#c080ff';
    ctx.lineWidth=1.5;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(this.x+px*sR*i*0.4,this.y+py*sR*i*0.4);
      ctx.lineTo(endX+px*eR*i*0.5,endY+py*eR*i*0.5);
      ctx.stroke();
    }
    ctx.globalAlpha=1;

class Laser{
constructor(x,y,angle,opts){opts=opts||{};
  this.x=x;this.y=y;this.angle=angle;
  const isHostile=!!opts.hostile;
  const lengthMul=isHostile?1.3:1;
  const durMul=isHostile?1.5:1;
  this.length=(opts.length||1800)*lengthMul;this.width=opts.width||22;
  this.telegraph=opts.telegraph!==undefined?opts.telegraph:0.5;
  const pb=opts.pierceBonus||0;
  this.duration=((opts.duration!==undefined?opts.duration:0.8)*durMul)*(1+0.1*pb);
  this.color=opts.color||'#ff4040';
  this.hostile=isHostile;this.friendly=!!opts.friendly;
  this.dmg=opts.dmg||20;this.dps=opts.dps||0;
  this.rotate=opts.rotate||0;this.pierce=opts.pierce||0;
  this.phase='telegraph';this.t=0;this.alive=true;
  this.hitIds=new Set();this.src=opts.src||'normal';
  this.ownerSkill=opts.ownerSkill||null;this.tickAcc=0;}
hitsPoint(px,py,pr){
  const dx=Math.cos(this.angle), dy=Math.sin(this.angle);
  const vx=px-this.x, vy=py-this.y;
  const proj=vx*dx+vy*dy;
  if(proj<0)return false;if(proj>this.length)return false;
  const perpX=vx-proj*dx, perpY=vy-proj*dy;
  const dist=Math.sqrt(perpX*perpX+perpY*perpY);
  return dist<=this.width/2+pr;}
update(dt){this.t+=dt;
  if(this.phase==='telegraph'){if(this.t>=this.telegraph){this.phase='active';this.t=0;}}
  else if(this.phase==='active'){if(this.rotate)this.angle+=this.rotate*dt;
    if(this.t>=this.duration){this.alive=false;}}}
draw(){
  const endX=this.x+Math.cos(this.angle)*this.length;
  const endY=this.y+Math.sin(this.angle)*this.length;
  if(this.phase==='telegraph'){
    const prog=this.t/this.telegraph;
    ctx.globalAlpha=0.25+prog*0.45;ctx.strokeStyle=this.color;
    ctx.lineWidth=2+prog*this.width*0.25;
    ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(endX,endY);ctx.stroke();
    if(prog>0.6){const p2=(prog-0.6)/0.4;
      ctx.globalAlpha=0.3+p2*0.4;ctx.lineWidth=this.width*0.4;
      ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(endX,endY);ctx.stroke();}
    ctx.globalAlpha=1;
  } else {
    const fadeIn = Math.min(1, this.t * 6);
    const fadeOut = Math.min(1, (this.duration - this.t) * 6);
    const baseA = fadeIn * fadeOut;
    if (baseA <= 0) return;
    const a = this.friendly ? baseA * 0.34 : baseA;
    ctx.globalAlpha = a * 0.30; ctx.strokeStyle = this.color; ctx.lineWidth = this.width * 1.5;
    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.globalAlpha = a * 0.78; ctx.lineWidth = this.width;
    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.globalAlpha = a * 0.85; ctx.strokeStyle = this.friendly ? '#fff290' : '#ffffff'; ctx.lineWidth = this.width * 0.22;
    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}}

const BH_LIMIT=1500;

  const pr=new Proj(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed,dmg,color,r||5,false,opts.pierce||0);

function bhMobius(g,x,y,angle,speed,dmg,color,r,opts){opts=opts||{};const count=opts.count||16;const curve=opts.curve||1.4;const lt=opts.lifetime||7;
  for(let i=0;i<count;i++){const a=angle+i*0.08;

function bhUmbrella(g,x,y,count,speed,dmg,color,r,opts){opts=opts||{};const lt=opts.lifetime||7;

    pr.setCurve(curveDir*Math.PI*1.3/lt,lt);bhAdd(g,pr);}}
function bhTrap(g,x,y,dmg,color,r,opts){opts=opts||{};const fuse=opts.fuse||1.4;const count=opts.count||12;const speed=opts.speed||280;

function bhCross(g,x,y,count,speed,dmg,color,r,opts){opts=opts||{};const lt=opts.lifetime||6;const arms=opts.arms||4;const off=opts.offset||0;
  for(let arm=0;arm<arms;arm++){const base=arm/arms*Math.PI*2+off;
    for(let i=0;i<count;i++){const a=base+(i-(count-1)/2)*0.06;
      const pr=new Proj(x,y,Math.cos(a)*speed,Math.sin(a)*speed,dmg,color,r||5,false,0);pr.l=lt;bhAdd(g,pr);}}}
function bhCrossfire(g,b1,b2,speed,dmg,color1,color2,r,opts){opts=opts||{};const lt=opts.lifetime||6;const count=opts.count||6;const spacing=opts.spacing||20;
  const dx=b2.x-b1.x, dy=b2.y-b1.y;const dd=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=dx/dd, ny=dy/dd;const px=-ny, py=nx;
  for(let i=0;i<count;i++){const offset=(i-(count-1)/2)*spacing;
    const pr1=new Proj(b1.x+px*offset,b1.y+py*offset,nx*speed,ny*speed,dmg,color1,r||5,false,0);pr1.l=lt;bhAdd(g,pr1);
    const pr2=new Proj(b2.x+px*offset,b2.y+py*offset,-nx*speed,-ny*speed,dmg,color2,r||5,false,0);pr2.l=lt;bhAdd(g,pr2);}}
function bhEcho(g,x,y,angle,speed,fuse,waitTime,burstCount,burstSpeed,dmg,color,r,opts){opts=opts||{};
  const pr=new Proj(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed,dmg,color,r||5,false,0);
  pr.setEcho(fuse,waitTime,burstCount,burstSpeed,dmg,color);bhAdd(g,pr);}
function bhSpiralFint(g,x,y,angle,speed,curve1,curve2,dmg,color,r,opts){opts=opts||{};const arms=opts.arms||3;const flipAt=opts.flipAt||2;const lt=opts.lifetime||7;
  for(let i=0;i<arms;i++){const a=angle+i/arms*Math.PI*2;
    const pr=new Proj(x,y,Math.cos(a)*speed,Math.sin(a)*speed,dmg,color,r||5,false,0);
    pr.setCurveFlip(curve1,curve2,flipAt,lt);bhAdd(g,pr);}}
function laserBeam(g,x,y,angle,opts){opts=opts||{};g.lasers.push(new Laser(x,y,angle,opts));}
function laserFan(g,x,y,baseAngle,count,spread,opts){opts=opts||{};
  for(let i=0;i<count;i++){const a=baseAngle+(i-(count-1)/2)*spread;g.lasers.push(new Laser(x,y,a,opts));}}
function laserCross(g,x,y,count,opts){
  opts=opts||{};
  let off = opts.offset;
  if(off === undefined){
    // Автопоиск ближайшего врага
    let target=null, bestDist=Infinity;
    for(const e of g.enemies){if(!e.alive)continue;const d=d2(e.x,e.y,x,y);if(d<bestDist){bestDist=d;target=e;}}
    for(const b of g.bosses){if(!b.alive)continue;const d=d2(b.x,b.y,x,y);if(d<bestDist){bestDist=d;target=b;}}
    off = target ? Math.atan2(target.y-y, target.x-x) : 0;
  }
  for(let i=0;i<count;i++){
    const a=off+i/count*Math.PI*2;
    const o=Object.assign({},opts);
    delete o.offset;
    g.lasers.push(new Laser(x,y,a,o));
  }
}
function laserRotate(g,x,y,count,rotSpeed,opts){
  opts=opts||{};
  let off = opts.offset;
  if(off === undefined){
    let target=null, bestDist=Infinity;
    for(const e of g.enemies){if(!e.alive)continue;const d=d2(e.x,e.y,x,y);if(d<bestDist){bestDist=d;target=e;}}
    for(const b of g.bosses){if(!b.alive)continue;const d=d2(b.x,b.y,x,y);if(d<bestDist){bestDist=d;target=b;}}
    off = target ? Math.atan2(target.y-y, target.x-x) : 0;
  }
  for(let i=0;i<count;i++){
    const a=off+i/count*Math.PI*2;
    const o=Object.assign({},opts);
    o.rotate=rotSpeed;
    delete o.offset;
    g.lasers.push(new Laser(x,y,a,o));
  }
}

function drawHeroAvatar(cn,shType,x,y,r,baseCol,es){
  const spr=MEDIA.getSprite(cn);
  if(spr){
    ctx.drawImage(spr,x - r * 1.4,y - r * 1.4,r * 2.8,r * 2.8);
    return;
  }
  const v=CHAR_VIS[cn]||{};
  const bodyCol=v.body||baseCol;
  const t=performance.now()/400;
  ctx.save();ctx.translate(x,y);

  if(v.aura){
    const pulse=0.35+Math.sin(t*2)*0.15;
    ctx.fillStyle=hexA(v.aura,pulse*0.35);
    ctx.beginPath();ctx.arc(0,0,r*1.55,0,Math.PI*2);ctx.fill();
  }
  if(v.tails){
    ctx.fillStyle='#ffe890';
    for(let i=0;i<v.tails;i++){
      const ang=Math.PI*0.15+(i/(v.tails-1))*Math.PI*0.7+Math.sin(t+i)*0.08;
      ctx.beginPath();ctx.ellipse(Math.cos(ang)*r*0.9,Math.sin(ang)*r*0.9,r*0.55,r*0.22,ang,0,Math.PI*2);ctx.fill();
    }
  }
  const wingType=v.wings||(v.evoWings&&es>=2?'demon':null);
  if(wingType){
    const wCol=v.wingCol||'#ffffff';
    const flap=Math.sin(t*3)*0.15;
    ctx.fillStyle=wCol;ctx.strokeStyle=sh(wCol,-40);ctx.lineWidth=1.5;
    for(const dir of [-1,1]){
      ctx.save();ctx.scale(dir,1);ctx.rotate(flap);
      if(wingType==='angel'){
        ctx.beginPath();ctx.moveTo(r*0.3,-r*0.1);ctx.quadraticCurveTo(r*1.8,-r*1.1,r*1.6,r*0.2);ctx.quadraticCurveTo(r*1.0,r*0.4,r*0.3,r*0.2);ctx.fill();ctx.stroke();
      }else if(wingType==='demon'||wingType==='dragon'){
        ctx.beginPath();ctx.moveTo(r*0.3,-r*0.1);ctx.lineTo(r*1.7,-r*0.9);ctx.lineTo(r*1.4,0);ctx.lineTo(r*1.6,r*0.4);ctx.lineTo(r*0.9,r*0.2);ctx.lineTo(r*0.3,r*0.3);ctx.closePath();ctx.fill();ctx.stroke();
      }else if(wingType==='fairy'){
        ctx.globalAlpha=0.75;ctx.beginPath();ctx.ellipse(r*1.0,-r*0.3,r*0.7,r*0.3,-0.4,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.globalAlpha=1;
      }
      ctx.restore();
    }
  }
  if(v.hairStyle==='long'){
    ctx.fillStyle=v.hair;ctx.beginPath();ctx.arc(0,-r*0.05,r*1.12,Math.PI*0.85,Math.PI*2.15);
    ctx.lineTo(r*1.15,r*0.95);ctx.lineTo(-r*1.15,r*0.95);ctx.closePath();ctx.fill();
  }else if(v.hairStyle==='twintails'){
    ctx.fillStyle=v.hair;
    ctx.beginPath();ctx.ellipse(-r*1.05,r*0.25,r*0.3,r*0.75,0.25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*1.05,r*0.25,r*0.3,r*0.75,-0.25,0,Math.PI*2);ctx.fill();
  }
  if(v.elfEars){
    ctx.fillStyle=bodyCol;
    ctx.beginPath();ctx.moveTo(-r*0.85,-r*0.1);ctx.lineTo(-r*1.45,-r*0.35);ctx.lineTo(-r*0.8,r*0.15);ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.85,-r*0.1);ctx.lineTo(r*1.45,-r*0.35);ctx.lineTo(r*0.8,r*0.15);ctx.fill();
  }
  if(v.beastEars){
    ctx.fillStyle=v.hair||bodyCol;
    ctx.beginPath();ctx.moveTo(-r*0.75,-r*0.5);ctx.lineTo(-r*0.95,-r*1.25);ctx.lineTo(-r*0.25,-r*0.8);ctx.fill();
    ctx.beginPath();ctx.moveTo(r*0.75,-r*0.5);ctx.lineTo(r*0.95,-r*1.25);ctx.lineTo(r*0.25,-r*0.8);ctx.fill();
  }
  const actualShape=(cn==='Римуру Темпест'&&es>=1)?'circle':shType;
  shape(actualShape,0,0,r,bodyCol,false);
  if(v.hairStyle==='spiky'){
    ctx.fillStyle=v.hair;ctx.beginPath();ctx.moveTo(-r*0.95,-r*0.2);ctx.lineTo(-r*0.7,-r*1.2);ctx.lineTo(-r*0.35,-r*0.8);
    ctx.lineTo(0,-r*1.3);ctx.lineTo(r*0.35,-r*0.8);ctx.lineTo(r*0.7,-r*1.2);ctx.lineTo(r*0.95,-r*0.2);
    ctx.arc(0,-r*0.1,r*0.95,0,Math.PI,true);ctx.fill();
  }else if(v.hairStyle==='bob'||v.hairStyle==='long'||v.hairStyle==='twintails'){
    ctx.fillStyle=v.hair;ctx.beginPath();ctx.arc(0,-0.1 * r,1.02 * r,Math.PI,Math.PI * 2);
    ctx.lineTo(0.85 * r,-0.2 * r);ctx.lineTo(0,-0.45 * r);ctx.lineTo(-0.85 * r,-0.2 * r);ctx.closePath();ctx.fill();
  }
  if(v.horns){
    ctx.fillStyle=v.hornCol||'#fff';
    if(v.horns===1){
      ctx.beginPath();ctx.moveTo(-0.18 * r,-0.85 * r);ctx.lineTo(0,-1.55 * r);ctx.lineTo(0.18 * r,-0.85 * r);ctx.fill();
    }else{
      ctx.beginPath();ctx.moveTo(-0.65 * r,-0.7 * r);ctx.lineTo(-0.95 * r,-1.45 * r);ctx.lineTo(-0.35 * r,-0.85 * r);ctx.fill();
      ctx.beginPath();ctx.moveTo(0.65 * r,-0.7 * r);ctx.lineTo(0.95 * r,-1.45 * r);ctx.lineTo(0.35 * r,-0.85 * r);ctx.fill();
    }
  }
  if(v.hornStar){
    ctx.fillStyle=v.hornStar;ctx.beginPath();ctx.arc(0,-0.62 * r,0.16 * r,0,Math.PI * 2);ctx.fill();
  }
  if(v.crown){
    ctx.fillStyle=v.crown;ctx.beginPath();
    ctx.moveTo(-0.55 * r,-0.85 * r);ctx.lineTo(-0.55 * r,-1.35 * r);ctx.lineTo(-0.25 * r,-1.05 * r);
    ctx.lineTo(0,-1.42 * r);ctx.lineTo(0.25 * r,-1.05 * r);ctx.lineTo(0.55 * r,-1.35 * r);ctx.lineTo(0.55 * r,-0.85 * r);ctx.closePath();ctx.fill();
  }
  if(v.halo){
    ctx.strokeStyle=v.halo;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(0,-1.35 * r,0.75 * r,0.22 * r,0,0,Math.PI * 2);ctx.stroke();
  }
  if(v.bow){
    ctx.fillStyle=v.bow;
    ctx.beginPath();ctx.moveTo(0,-0.95 * r);ctx.lineTo(-0.45 * r,-1.25 * r);ctx.lineTo(-0.35 * r,-0.8 * r);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-0.95 * r);ctx.lineTo(0.45 * r,-1.25 * r);ctx.lineTo(0.35 * r,-0.8 * r);ctx.fill();
  }
  if(v.scarf){
    ctx.fillStyle=v.scarf;ctx.fillRect(-0.85 * r,0.45 * r,1.7 * r,0.35 * r);
    ctx.beginPath();ctx.moveTo(0.5 * r,0.6 * r);ctx.lineTo(1.1 * r,1.25 * r);ctx.lineTo(0.7 * r,1.3 * r);ctx.closePath();ctx.fill();
  }
  if(v.beard){
    ctx.fillStyle=v.beard;ctx.beginPath();ctx.moveTo(-0.65 * r,0.25 * r);ctx.lineTo(0,1.25 * r);ctx.lineTo(0.65 * r,0.25 * r);ctx.closePath();ctx.fill();
  }
  const ex=0.34 * r,ey=-0.12 * r,er=0.14 * r;
  ctx.fillStyle=v.eye||'#111';ctx.beginPath();ctx.arc(-ex,ey,er,0,Math.PI * 2);ctx.fill();
  ctx.fillStyle=v.eye2||v.eye||'#111';ctx.beginPath();ctx.arc(ex,ey,er,0,Math.PI * 2);ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(-ex + 0.3 * er,ey - 0.3 * er,0.38 * er,0,Math.PI * 2);ctx.fill();
  ctx.beginPath();ctx.arc(ex + 0.3 * er,ey - 0.3 * er,0.38 * er,0,Math.PI * 2);ctx.fill();
  if(v.glasses){
    ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
    ctx.strokeRect(-ex - 1.3 * er,ey - 1.1 * er,2.6 * er,2.2 * er);
    ctx.strokeRect(ex - 1.3 * er,ey - 1.1 * er,2.6 * er,2.2 * er);
  }
  ctx.restore();
}

function drawHeldWeapon(p){
  if(!p.wep||p.wep.atkType==='parry')return;
  const w=p.wep;
  const rCol=RANKS[w.rank]?RANKS[w.rank].c:'#ffffff';
  const swing=p.acd>0.75?Math.sin((1 - p.acd) * 20) * 1.1:0;
  const ang=p.aim + swing;
  ctx.save();
  ctx.translate(p.x + Math.cos(ang) * (p.z + 6),p.y + Math.sin(ang) * (p.z + 6));
  ctx.rotate(ang);
  ctx.strokeStyle=rCol;ctx.fillStyle=rCol;ctx.lineWidth=2.5;
  if(w.atkType==='staff'||w.atkType==='wand'||w.atkType==='gravity_staff'){
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(22,0);ctx.stroke();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(24,0,4.5,0,Math.PI * 2);ctx.fill();
    ctx.strokeStyle=rCol;ctx.beginPath();ctx.arc(24,0,7,0,Math.PI * 2);ctx.stroke();
  }else if(w.atkType==='bow'||w.atkType==='sniper'||w.atkType==='crossbow'){
    ctx.beginPath();ctx.arc(0,0,14,-1.1,1.1);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(Math.cos(-1.1) * 14,Math.sin(-1.1) * 14);ctx.lineTo(Math.cos(1.1) * 14,Math.sin(1.1) * 14);ctx.stroke();
  }else if(w.atkType==='scythe'){
    ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(22,0);ctx.stroke();
    ctx.beginPath();ctx.arc(22,10,12,-0.6 * Math.PI,0.2);ctx.stroke();
  }else if(w.atkType==='hammer'||w.atkType==='gauntlet'){
    ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(16,0);ctx.stroke();
    ctx.fillRect(14,-8,9,16);
  }else{
    ctx.fillStyle='#ffd700';ctx.fillRect(2,-5,3,10);
    ctx.fillStyle=rCol;ctx.beginPath();ctx.moveTo(5,-2.5);ctx.lineTo(26,0);ctx.lineTo(5,2.5);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawBossAvatar(b){
  const t=performance.now()/400;
  const r=b.z;
  const name=b.bn||'';
  const spr=MEDIA.getSprite(name.replace(' [Пробуждённый]',''));
  if(spr){
    ctx.drawImage(spr,b.x - r * 1.6,b.y - r * 1.6,r * 3.2,r * 3.2);
    return;
  }
  ctx.save();ctx.translate(b.x,b.y);
  const sealR=1.95 * r;
  ctx.save();ctx.rotate(0.4 * t);
  ctx.strokeStyle=hexA(b.c,0.35);ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,sealR,0,Math.PI * 2);ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6) * Math.PI * 2;
    const px=Math.cos(a) * sealR,py=Math.sin(a) * sealR;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.stroke();ctx.restore();

  const flap=Math.sin(2.5 * t) * 0.18;
  if(name.includes('Вельдор')||name.includes('Вельгринд')||name.includes('Вельзард')||name.includes('Вельданава')){
    for(const dir of [-1,1]){
      ctx.save();ctx.scale(dir,1);ctx.rotate(flap);
      ctx.fillStyle=hexA(b.c,0.75);ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0.4 * r,-0.2 * r);ctx.lineTo(2.3 * r,-1.3 * r);ctx.lineTo(1.8 * r,-0.3 * r);
      ctx.lineTo(2.1 * r,0.3 * r);ctx.lineTo(1.3 * r,0.1 * r);ctx.lineTo(0.6 * r,0.6 * r);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    }
  }else if(name.includes('Михаэль')||name.includes('Фелдвей')){
    for(let w=0;w<3;w++){
      for(const dir of [-1,1]){
        ctx.save();ctx.scale(dir,1);ctx.rotate(flap + (w - 1) * 0.38);
        ctx.fillStyle=w===1?'#ffffff':hexA(b.c,0.8);
        ctx.beginPath();ctx.moveTo(0.3 * r,0);ctx.quadraticCurveTo(2.2 * r,-0.9 * r,2.0 * r,0.3 * r);
        ctx.quadraticCurveTo(1.2 * r,0.5 * r,0.3 * r,0.2 * r);ctx.fill();ctx.restore();
      }
    }
  }else if(name.includes('Клейман')){
    ctx.strokeStyle='rgba(220,120,255,0.5)';ctx.lineWidth=1.2;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(i * 0.4 * r,-0.5 * r);ctx.lineTo(i * 0.7 * r + Math.sin(t + i) * 8,-2.6 * r);ctx.stroke();
    }
  }else if(name.includes('Иварадж')||name.includes('Руверудж')){
    ctx.strokeStyle=b.c;ctx.lineWidth=3;
    for(let i=0;i<8;i++){
      const a=(i/8) * Math.PI * 2 + 0.6 * t;
      const len=(1.6 + Math.sin(3 * t + i) * 0.3) * r;
      ctx.beginPath();ctx.moveTo(Math.cos(a) * 0.7 * r,Math.sin(a) * 0.7 * r);
      ctx.quadraticCurveTo(Math.cos(a + 0.3) * 0.7 * len,Math.sin(a + 0.3) * 0.7 * len,Math.cos(a) * len,Math.sin(a) * len);ctx.stroke();
    }
  }

  shape(b.sh,0,0,(1 + Math.sin(2 * t) * 0.05) * r,b.c,b.hf>0);
  if(name.includes('Гельд')||name.includes('Леон')||name.includes('Вельданава')){
    ctx.fillStyle='#ffd700';ctx.beginPath();
    ctx.moveTo(-0.5 * r,-0.8 * r);ctx.lineTo(-0.5 * r,-1.3 * r);ctx.lineTo(-0.2 * r,-1.0 * r);
    ctx.lineTo(0,-1.4 * r);ctx.lineTo(0.2 * r,-1.0 * r);ctx.lineTo(0.5 * r,-1.3 * r);ctx.lineTo(0.5 * r,-0.8 * r);ctx.closePath();ctx.fill();
  }
  if(name.includes('Хината')||name.includes('Михаэль')){
    ctx.strokeStyle='#fff8c0';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,-1.25 * r,0.8 * r,0.24 * r,0,0,Math.PI * 2);ctx.stroke();
  }
  ctx.fillStyle=b.ph===2?'#ff2020':'#ffffff';
  ctx.beginPath();ctx.arc(-0.32 * r,-0.15 * r,0.13 * r,0,Math.PI * 2);ctx.fill();
  ctx.beginPath();ctx.arc(0.32 * r,-0.15 * r,0.13 * r,0,Math.PI * 2);ctx.fill();
  ctx.restore();
}

class Shockwave{
  constructor(x,y,maxR,color,life=0.35){
    this.x=x;this.y=y;this.maxR=maxR;this.color=color;this.life=life;this.maxLife=life;
  }
  update(dt){this.life-=dt;}
  draw(){
    const p=1 - cl(this.life/this.maxLife,0,1);
    const r=10 + (this.maxR - 10) * (1 - Math.pow(1 - p,2));
    ctx.save();ctx.globalAlpha=(1 - p) * 0.75;ctx.strokeStyle=this.color;
    ctx.lineWidth=Math.max(1,7 * (1 - p));ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI * 2);ctx.stroke();ctx.restore();
  }
}


function shape(sp,x,y,r,c,fl){
  ctx.fillStyle=fl?'#fff':c;ctx.beginPath();
  if(sp==='circle')ctx.arc(x,y,r,0,7);
  else if(sp==='triangle'){ctx.moveTo(x,y-r);ctx.lineTo(x-r*.9,y+r*.7);ctx.lineTo(x+r*.9,y+r*.7);ctx.closePath();}
  else if(sp==='diamond'){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
  else if(sp==='star'){for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i/10*6.283-1.57;
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();}
  else if(sp==='demon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.8,y-r*.5);ctx.lineTo(x+r*.4,y-r*.1);
    ctx.lineTo(x+r,y+r*.6);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y+r*.6);ctx.lineTo(x-r*.4,y-r*.1);
    ctx.lineTo(x-r*.8,y-r*.5);ctx.closePath();}
  else if(sp==='angel'){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+r,y-r*.3,x+r*.6,y+r*.3);
    ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.4);ctx.lineTo(x-r*.2,y+r);ctx.lineTo(x-r*.6,y+r*.3);
    ctx.quadraticCurveTo(x-r,y-r*.3,x,y-r);}
  else if(sp==='dragon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.7,y-r*.3);ctx.lineTo(x+r,y+r*.3);
    ctx.lineTo(x+r*.4,y+r*.2);ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.3);ctx.lineTo(x-r*.2,y+r);

hurt(v,isLaser=false,attacker=null){
  if(!isLaser&&(this.inv>0||this.dodg>0||this.buffs.invuln>0))return;
  if(this.parryWindow>0){

    this.parrySuccess=0.4;this.parryCd=0;

  let d=(isLaser?v:Math.max(1,v - this.def * 0.5)) * (this.cursedDmgTaken||1);

doMeleeHit(g,this,a + pIdx * 0.4,rad,Math.PI * (sp.def.pattern==='vortex'?2:1.5),dm * 0.85,src);

if(this.buffs.luck>0)dmgBonus*=1.3;if(this.buffs.satanael>0)dmgBonus*=1.5;

if(k['w']||k['arrowup'])dy--;if(k['s']||k['arrowdown'])dy++;
if(k['a']||k['arrowleft'])dx--;if(k['d']||k['arrowright'])dx++;
if(this.dodg>0){this.x+=this.dvx * dt;this.y+=this.dvy * dt;this.dodg-=dt;}
else if(dx||dy){

this.tearCd=Math.max(0,this.tearCd-dt);this.elpisCd=Math.max(0,this.elpisCd-dt);
if(this.enhanceCd){for(let i=0;i<3;i++)this.enhanceCd[i]=Math.max(0,this.enhanceCd[i]-dt);}
if(Array.isArray(this.weaponAbilityCd)){
for(let i=0;i<this.weaponAbilityCd.length;i++)this.weaponAbilityCd[i]=Math.max(0,this.weaponAbilityCd[i]-dt);
}
if(Array.isArray(this.weaponAutoCd)){
for(let i=0;i<this.weaponAutoCd.length;i++)this.weaponAutoCd[i]=Math.max(0,this.weaponAutoCd[i]-dt);
}
this.apcd=Math.max(0,this.apcd-dt);
for(const b in this.buffs)this.buffs[b]=Math.max(0,this.buffs[b]-dt);
if(this.buffs.shield<=0&&this.shield>0)this.shield=0;
for(const s in this.skills)if(this.skills[s].cd>0)this.skills[s].cd-=dt;
for(const sp of this.spells)if((sp.cd||0)>0)sp.cd-=dt;
if(this.autoPotion&&this.hasSage()&&this.hp<this.maxHp * 0.25&&this.apcd<=0){

if(trailSpell&&(dx||dy)){
this.trailTick+=dt;

const t=this.near(g.enemies,g.bosses);
if(t&&!g.magicMaster&&!g.parryMode){
const calcAcd=()=>{
const baseAcd=(this.rid==='beastman')?0.8:1.0;
let rawAcd=this.buffs.haste>0?baseAcd * 0.7:baseAcd;

  onWheel(d){

   findReadySynthesis(){
    const p=this.player;if(!p)return null;
    for(const syn of SYNTHESIS){
      const r1=syn.req.at(0),r2=syn.req.at(1);
      if(syn.type==='skill'&&!this.weaponMaster&&!this.magicMaster&&!this.parryMode){
        if(p.skills[r1]&&p.skills[r2]&&!p.skills[syn.result]&&p.frag>=(syn.cost||0))return syn;
      }else if(syn.type==='art'){
        if(p.arts.some(a=>a.n===r1)&&p.arts.some(a=>a.n===r2)&&!p.arts.some(a=>a.n===syn.result.n))return syn;
      }else if(syn.type==='spell'&&!this.weaponMaster&&!this.parryMode){
        if(p.spells.some(s=>s.def.n===r1)&&p.spells.some(s=>s.def.n===r2)&&!p.spells.some(s=>s.def.n===syn.result.n))return syn;
      }
    }
    return null;
  }

  applySynthesis(syn){
    const p=this.player;if(!p||!syn)return;
    const r1=syn.req.at(0),r2=syn.req.at(1);
    if(syn.type==='skill'){
      if(syn.cost)p.frag-=syn.cost;
      const s1=p.slots.indexOf(r1),s2=p.slots.indexOf(r2);
      delete p.skills[r1];delete p.skills[r2];
      if(s1!==-1)p.slots[s1]=null;
      if(s2!==-1)p.slots[s2]=null;
      p.skills[syn.result]={tier:syn.tier,cd:0,resCd:0};
      if(s1!==-1)p.slots[s1]=syn.result;
      else if(s2!==-1)p.slots[s2]=syn.result;
      else p.addSk(syn.result);
      if(syn.bonusSkill&&!p.skills[syn.bonusSkill]){
        p.addSk(syn.bonusSkill);p.skills[syn.bonusSkill].tier=4;
        this.ftxt.push(new FTxt('ПРОБУЖДЕНИЕ: '+syn.bonusSkill+'!',p.x,p.y-95,'#ffffff',3.5,22));
      }
      this.flash=0.85;
      this.ftxt.push(new FTxt('✦ СИНТЕЗ: '+syn.result+'!',p.x,p.y-60,syn.color,3,24));
      AU.sfx('sec');
    }else if(syn.type==='art'){
      p.arts=p.arts.filter(a=>a.n!==r1&&a.n!==r2);
      p.arts.push(syn.result);syn.result.e(p);
      this.ftxt.push(new FTxt('✦ СИНТЕЗ: '+syn.result.n,p.x,p.y-60,syn.color,3,22));
      AU.sfx('evo');
    }else if(syn.type==='spell'){
      p.spells=p.spells.filter(s=>s.def.n!==r1&&s.def.n!==r2);
      p.spells.push({def:syn.result,cd:0});
      if(this.magicMaster)p.spells.sort((a,b)=>b.def.t-a.def.t);
      this.ftxt.push(new FTxt('✦ СИНТЕЗ: '+syn.result.n,p.x,p.y-60,syn.color,3,22));
      AU.sfx('evo');
    }
  }

  useSk(i){
    const p=this.player;if(!p)return;
    if(this.parryMode){
        this.useParrySkill(i);
        return;
    }
    if(this.weaponMaster){
      if(!p.equippedWeapons[i]) return;
      if(p.wep.unapply) p.wep.unapply(p);
      p.wep = p.equippedWeapons[i];
      if(p.wep.apply) p.wep.apply(p);
      p.activeWeaponIndex = i;
      p.triggerWeaponAbility(i, this);
      return;
    }
    if(this.magicMaster){
      const sp = p.spells[i];
      if(!sp || p.enhanceCd[i] > 0) return;
      p.enhanceCd[i] = 8*(1-p.cdr);
      for(let c=0;c<5;c++){

  updTutorial(dt){
    if(!this.tutData)return;const p=this.player;if(!p)return;

      const pr=this.proj[i];pr.update(dt);
      if(!pr.alive){this.proj.splice(i,1);continue;}
      if(pr.fr){let cn=false;
        for(const e of this.enemies){if(!e.alive)continue;
          if(d2(pr.x,pr.y,e.x,e.y)<(pr.r+e.z)**2){e.dmg(pr.dmg,pr.src);
            for(let j=0;j<3;j++)this.particles.push(new Part(e.x,e.y,pr.c));
            if(pr.pierce>0)pr.pierce--;else{cn=true;break;}}}
        if(cn)this.proj.splice(i,1);}}
    for(let i=this.slashes.length-1;i>=0;i--){this.slashes[i].update(dt);if(this.slashes[i].life<=0)this.slashes.splice(i,1);}
    const ne=[];
    for(const e of this.enemies){if(!e.alive){p.kills++;p.gainXp(e.xp);for(let j=0;j<6;j++)this.particles.push(new Part(e.x,e.y,e.c));}else ne.push(e);}
    this.enemies=ne;
    for(let i=this.particles.length-1;i>=0;i--){const pt=this.particles[i];pt.update(dt);if(pt.l<=0)this.particles.splice(i,1);}
    for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}

  evolveSkill(p,name){

    this.ftxt.push(new FTxt('ЭВОЛЮЦИЯ: '+name+' → '+next,p.x,p.y-50,evo.color,3,22));

  triggerLv(){
    const p=this.player,r=RACES[p.rid];const ne=r.evo[p.es+1];
    if(ne&&p.lv>=ne.lv){this.doEvo(ne);return;}
    this.state='level_up';
    const pool=[
      {n:'+25 HP',k:'hp'},{n:'+10 MP',k:'mp'},{n:'+3 ATK',k:'atk'},
      {n:'+2 DEF',k:'def'},{n:'+0.3 SPD',k:'spd'},{n:'+3 MAG',k:'mag'},
      {n:'+2 RES',k:'res'},{n:'+3 LCK',k:'lck'},{n:'+2% крит',k:'crit'},
      {n:'+1 пробитие',k:'pierce'},{n:'+15% радиус AoE',k:'aoe'}
    ];
    if(p.cdr<0.75)pool.push({n:'-5% перезарядка',k:'cdr'});
    if(p.hpRegenPct<0.05)pool.push({n:'+0.5% HP-реген',k:'hpreg'});
    
    if (!this.weaponMaster && !this.magicMaster && !this.parryMode) {
      const own=Object.keys(p.skills);
      if(own.length){
        const evoSkills=own.filter(sk=>SKILL_EVO[sk]&&SKILL_EVO[sk].next);
        const affordable=evoSkills.filter(sk=>p.frag>=evoFragCost(sk));
        if(affordable.length>0){const sk=pick(affordable);const evo=SKILL_EVO[sk];const cost=evoFragCost(sk);
          const costStr=cost>0?' ('+cost+' оск.)':'';
          pool.unshift({n:sk+' → '+evo.next+costStr,k:'evoSk',sk,cost});}
        const nonEvo=own.filter(sk=>!SKILL_EVO[sk]);
        if(nonEvo.length){const affordableUp=nonEvo.filter(sk=>{const ct=p.skills[sk].tier;
            if(ct>=TI.length-1)return false;const cost=ct>=3?7:(ct>=2?4:0);return p.frag>=cost;});
          if(affordableUp.length>0){const sk=pick(affordableUp);const ct=p.skills[sk].tier;
            const cost=ct>=3?7:(ct>=2?4:0);const newDn=skillDisplayName(sk,ct+1);
            const costStr=cost>0?' ('+cost+' оск.)':'';
            pool.push({n:skillDisplayName(sk,ct)+' → '+newDn+' ('+TI[ct+1]+')'+costStr,k:'skUp',sk,cost});}}
      }
      
      const affinity = THEMES[p.cn] || THEMES[p.rid] || { elems: [], arts: [] };
      const pickWeighted = (arr, weightFn) => {
          let totalWeight = 0;
          const weights = arr.map(item => {
              const w = weightFn(item);
              totalWeight += w;
              return w;
          });
          let r = Math.random() * totalWeight;
          for(let i=0; i<arr.length; i++) {
              r -= weights[i];
              if(r <= 0) return arr[i];
          }
          return arr[arr.length-1];
      };
      
      if(Object.keys(p.skills).length<3){
        const av=Object.keys(SKILLS).filter(s=>!p.skills[s]&&!Object.values(SKILL_EVO).some(e=>e.next===s)&&!SKILLS[s].ult);
        if(av.length){
          const ns = pickWeighted(av, s => affinity.elems.includes(SKILL_ELEM[s]) ? 2.5 : 1);
          pool.push({n:'Навык: '+ns,k:'newSk',sk:ns});
        }
      }
      
      const avSp=SPELLS.filter(s=>!p.spells.find(x=>x.def.n===s.n));
      if(avSp.length){
        const ns = pickWeighted(avSp, s => affinity.elems.includes(s.el) ? 2.5 : 1);
        pool.push({n:'Магия: '+ns.n,k:'newSp',sp:ns});
        
        if(this.magicMaster && avSp.length>1) {
          const avSp2 = avSp.filter(s=>s.n!==ns.n);
          const ns2 = pickWeighted(avSp2, s => affinity.elems.includes(s.el) ? 2.5 : 1);
          if(ns2) pool.push({n:'Магия: '+ns2.n,k:'newSp',sp:ns2});
        }
      }
    }
    if (this.parryMode) {
        pool.push({n:'+0.05с Окно парирования', k:'parryWin'});
        pool.push({n:'+25% Урон отражения', k:'parryDmg'});
        pool.push({n:'+0.5 Радиус парирования', k:'parryRange'});
        pool.push({n:'+1 Заряд парирования', k:'parryCharge'});
    }
    
    const avA=ARTS.filter(a=>!p.arts.find(x=>x.n===a.n));
    if(avA.length){
      const affinity = THEMES[p.cn] || THEMES[p.rid] || { elems: [], arts: [] };
      const pickWeighted = (arr, weightFn) => {
          let totalWeight = 0;
          const weights = arr.map(item => {
              const w = weightFn(item);
              totalWeight += w;
              return w;
          });
          let r = Math.random() * totalWeight;
          for(let i=0; i<arr.length; i++) {
              r -= weights[i];
              if(r <= 0) return arr[i];
          }
          return arr[arr.length-1];
      };
      const a = pickWeighted(avA, item => affinity.arts.includes(item.n) ? 3.0 : 1);
      pool.push({n:'Артефакт: '+a.n,k:'art',a});
    }
    
    for(let i=pool.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    const evoIdx=pool.findIndex(x=>x.k==='evoSk');
    if(evoIdx>1){[pool[1],pool[evoIdx]]=[pool[evoIdx],pool[1]];}
    const readySyn=this.findReadySynthesis();
    if(readySyn){
      const resName=typeof readySyn.result==='string'?readySyn.result:readySyn.result.n;
      const costTxt=readySyn.cost>0?' ('+readySyn.cost+' оск.)':'';
      pool.unshift({n:'✦ СИНТЕЗ: '+readySyn.req.at(0)+' + '+readySyn.req.at(1)+' → '+resName+costTxt,k:'synth',syn:readySyn});
    }
    this.lvc=pool.slice(0,Math.min(3,pool.length));AU.sfx('lvl');
  }
  
  pick(i){
    const c=this.lvc[i];
    if(!c){this.state='playing';if(this.pendingLv>0)this.pendingLv--;if(this.pendingLv>0)this.triggerLv();return;}
    const p=this.player;
    switch(c.k){
      case 'hp':p.maxHp+=25;p.hp+=25;break;
      case 'mp':p.maxMp+=10;p.mp+=10;break;
      case 'atk':p.atk+=3;break;
      case 'def':p.def+=2;break;
      case 'spd':p.spd+=.3;break;
      case 'mag':p.mag+=3;break;
      case 'res':p.res+=2;break;
      case 'lck':p.lck+=3;p.crit+=0.9;p.dod+=0.6;p.cdmg+=0.015;break;
      case 'crit':p.crit+=2;break;
      case 'pierce':p.pierceBonus+=1;break;
      case 'aoe':p.aoeMult+=0.15;break;
      case 'cdr':p.cdr=Math.min(0.75,p.cdr+0.05);break;
      case 'hpreg':p.hpRegenPct=Math.min(0.05,p.hpRegenPct+0.005);break;
      case 'skUp':
        if(c.cost&&c.cost>0)p.frag-=c.cost;
        p.skills[c.sk].tier++;
        this.ftxt.push(new FTxt(skillDisplayName(c.sk,p.skills[c.sk].tier)+' ('+TI[p.skills[c.sk].tier]+')',p.x,p.y-40,TC[p.skills[c.sk].tier],2,18));
        break;
      case 'evoSk':if(c.cost&&c.cost>0)p.frag-=c.cost;this.evolveSkill(p,c.sk);break;
      case 'newSk':if(c.sk)p.addSk(c.sk);break;
      case 'newSp':
        p.spells.push({def:c.sp,cd:0});
        if(this.magicMaster) p.spells.sort((a,b) => b.def.t - a.def.t);
        break;
      case 'art':p.arts.push(c.a);c.a.e(p);break;
      case 'parryWin': p.parryWindowMax += 0.05; break;
      case 'parryDmg': p.parryReflectMul = (p.parryReflectMul||1) + 0.25; break;
      case 'parryRange': p.aoeMult += 0.5; break;
      case 'parryCharge': p.bonusParries += 1; break;
	  case 'synth':this.applySynthesis(c.syn);break;
    }
    this.state='playing';
    if(this.pendingLv>0)this.pendingLv--;
    if(this.pendingLv>0)this.triggerLv();
  }
  
  doEvo(e){
    const p=this.player;p.es++;
    if(e.b){p.maxHp+=e.b.hp||0;p.hp=p.maxHp;p.maxMp+=e.b.mp||0;p.mp=p.maxMp;
      p.atk+=e.b.atk||0;p.def+=e.b.def||0;p.spd+=e.b.spd||0;p.mag+=e.b.mag||0;}
    if(e.c)p.c=e.c;p.rn=e.n;
    this.evoShow=e;this.state='evolution';this.flash=1;this.timeSlowTimer=3;
    for(let i=0;i<60;i++)this.particles.push(new Part(p.x,p.y,e.c||p.c));AU.sfx('evo');
  }
  
  loop(t){
    const dt=Math.min(.05,(t-this.last)/1000);this.last=t;
    this.upd(dt);this.draw();requestAnimationFrame(tt=>this.loop(tt));
  }
  
  spawnEnemy(){
    if(this.enemies.length>=120)return;
    let elites=availableElites(this);
    
    if(this.parryMode) {
        elites = elites.filter(e => ['Драконий Слуга', 'Павший Ангел', 'Метатель Яда'].includes(e.n));
    }
    
    const eliteChance=elites.length>0 ? Math.min(0.25,0.05+this.bsSpawned.size*0.025) : 0;
    const isElite=elites.length>0 && Math.random()<eliteChance;
    let tp;
    
    if(isElite){
        tp=pick(elites);
    } else {
        const mx=Math.min(this.wave+1,22);
        let pool;
        if(this.parryMode) {
            pool = ET.filter(e=>e.l<=mx && (e.behavior==='ranged' || e.behavior==='kiter'));
        } else {
            pool = ET.filter(e=>e.l<=mx);
        }
        if(!pool.length)return;
        tp=pick(pool);
    }
    
    const cx=this.camX+W/2, cy=this.camY+H/2;
    const angle=Math.random()*6.283;const dist=Math.max(W,H)*0.7;
    let x=cx+Math.cos(angle)*dist;let y=cy+Math.sin(angle)*dist;
    x=cl(x,20,WW-20);y=cl(y,20,WH-20);
    const e=new Enemy(x,y,tp,this.loc.m);scaleEnemyToWave(e,this.wave);
    if(isElite){e.elite=true;e.maxHp=Math.floor(e.maxHp*1.4);e.hp=e.maxHp;e.atk=Math.floor(e.atk*1.25);e.xp=Math.floor(e.xp*2);e.z*=1.15;}
    if(this.loc.m.chaos && Math.random()<0.25) makeChaosEnemy(e);
    this.enemies.push(e);
  }
  
  nextBossInQueue(){
    const keys=Object.keys(BT).sort((a,b)=>BT[a].w-BT[b].w);
    for(const k of keys){
      const b=BT[k];
      if(b.sec)continue;
      if(b.chaos&&!this.loc.m.chaos)continue;
      if(b.loc&&b.loc!==this.loc.n)continue;
      if(!this.bsSpawned.has(k)&&this.wave>=b.w)return k;
      if(!this.bsSpawned.has(k)&&this.wave<b.w)return null;
    }
    return null;
  }
  
  spawnBoss(){
    if(this.bosses.length>0)return;
    
    if(this.infiniteMode && this.wave > 50 && this.wave % 5 === 0){
      const bx=cl(this.player.x,200,WW-200),by=Math.max(80,this.player.y-350);

  upd(dt){

        this.timers[i].t-=dt;

      }

    this.runTime+=dt;
    const p=this.player;if(!p)return;

          p.parrySuccess=0.4;p.parryCd=0;
          p.inv=0.4;p.buffs.invuln=Math.max(p.buffs.invuln,0.4);
          p.buffs.insp=Math.max(p.buffs.insp,1.5);
          for(let j=0;j<20;j++)this.particles.push(new Part(p.x,p.y,'#ffff80'));
          this.shake=8;}}
      if(ls.hostile&&!p.dodg&&p.buffs.invuln<=0){
        if(ls.hitsPoint(p.x,p.y,p.hitR)){
          if(p.dod>0&&Math.random()*100<p.dod){}
          else{let dmg=(ls.dps>0?ls.dps*dt:0);
            if(ls.dps<=0&&ls.hitIds.has(p)){dmg=0;}
            else if(ls.dps<=0){dmg=ls.dmg;ls.hitIds.add(p);}
            if(dmg>0){
              dmg*=(1-Math.min(0.5,p.res*0.01));
              p.hurt(dmg, true);
              if(Math.random()<0.3)this.particles.push(new Part(p.x,p.y,ls.color));
            }
          }
        }
      }
      if(ls.friendly){
        for(const e of this.enemies){if(!e.alive)continue;
          if(!ls.hitsPoint(e.x,e.y,e.z))continue;
          if(ls.dps>0){e.dmg(ls.dps*dt,ls.src);}
          else if(!ls.hitIds.has(e)){e.dmg(ls.dmg,ls.src);ls.hitIds.add(e);}}
        for(const b of this.bosses){if(!b.alive)continue;
          if(!ls.hitsPoint(b.x,b.y,b.z))continue;
          if(ls.dps>0){b.dmg(ls.dps*dt,ls.src);}
          else if(!ls.hitIds.has(b)){b.dmg(ls.dmg,ls.src);ls.hitIds.add(b);}}}}
    for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}
    this.st-=dt;this.wt+=dt;
    if(this.st<=0 && this.waveEnemiesToSpawn>0 && this.bosses.length===0 && !this.finalWave){
      let spawnTime = Math.max(.3,1.2-this.wave*.035);
      if(this.infiniteMode && this.wave > 50){
          spawnTime = Math.max(0.05, 0.3 * Math.pow(0.95, this.wave - 50));
      }
      this.st = spawnTime;
      this.spawnEnemy();this.waveEnemiesToSpawn--;this.waveEnemiesSpawned++;
    }
    if(this.bosses.length===0)this.spawnBoss();
    if(this.state==='playing' && this.waveEnemiesToSpawn===0 && this.enemies.length===0 && this.bosses.length===0 && !this.finalWave){
      const nextWave=this.wave+1;
      const skipPart=this.pendingSkipGold||0;
      const waveBonus=2*this.wave + skipPart;
      p.gold+=waveBonus;
      if(skipPart>0){
        this.ftxt.push(new FTxt('+'+waveBonus+' золота (включая +'+skipPart+' отложено)',p.x,p.y-130,'#ffcc44',1.8,14));
        this.pendingSkipGold=0;
      } else {
        this.ftxt.push(new FTxt('+'+waveBonus+' золота',p.x,p.y-130,'#ffcc44',1.8,14));
      }
      if(FORGE_RANK_BY_NEXT[nextWave]!==undefined && !this.forgePending && !this.parryMode){
        this.forgeRank=FORGE_RANK_BY_NEXT[nextWave];
        if(this.magicMaster){
          this.forgeItems = WEAPONS.filter(w=>w.rank===this.forgeRank && ['staff','wand','grimoire'].includes(w.atkType));
        } else {
          this.forgeItems = WEAPONS.filter(w=>w.rank===this.forgeRank);
        }
        this.forgePending=true;this.state='forge';this.forgeScroll=0;AU.music('menu');return;
      }
      this.wave++;this.forgePending=false;
      if(this.infiniteMode && this.wave > 50){
        this.waveEnemiesToSpawn=50; 
      } else {
        this.waveEnemiesToSpawn=5+this.wave*2;
      }
      this.waveEnemiesSpawned=0;this.wt=0;
      this.ftxt.push(new FTxt('Волна '+this.wave,p.x,p.y-150,'#fff',2,26));
      AU.sfx('wave');
      if(this.wave%5===0)AU.sfx('boss');
    }
    this.checkSecretChain();
    this.shake=Math.max(0,this.shake-dt*30);
    if(p.hp<=0){
      this.recordRun();
      AU.sfx('defeat');this.state='game_over';
      setTimeout(()=>AU.stop(),1500);
    }
  }
  
  draw(){
    if(this.state==='menu')return this.rMenu();
    if(this.state==='mode_select')return this.rModeSelect();
    if(this.state==='race_select')return this.rRace();
    if(this.state==='character_select')return this.rChar();
    if(this.state==='custom_name')return this.rCnm();
    if(this.state==='location_select')return this.rLoc();
    if(this.state==='chronicles')return this.rChr();
    if(this.state==='tutorial')return this.rTutorial();
    if(this.state==='forge')return this.rForge();
    if(this.state==='cutscene')return this.rCutscene();
    if(this.state==='victory')return this.rVictory();
    this.rGame();
    if(this.state==='paused')this.rPause();
    if(this.state==='level_up')this.rLv();
    if(this.state==='evolution')this.rEvo();
    if(this.state==='game_over')this.rGO();
  }
  
  bg(c){ctx.fillStyle=c||'#0a0a12';ctx.fillRect(0,0,W,H);}
  hov(x,y,w,h){return this.mx>=x&&this.mx<=x+w&&this.my>=y&&this.my<=y+h;}
}

Game.prototype.rGame=function(){
  this.bg(this.loc?this.loc.bg:'#0a0a12');
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sh(this.loc?this.loc.bg:'#0a0a12',20));g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();
  const shX=this.shake>0?rnd(-this.shake,this.shake):0;
  const shY=this.shake>0?rnd(-this.shake,this.shake):0;
  ctx.translate(-this.camX+shX,-this.camY+shY);
  ctx.strokeStyle='rgba(80,200,220,.06)';ctx.lineWidth=1;
  const gx0=Math.floor(this.camX/80)*80;const gy0=Math.floor(this.camY/80)*80;
  for(let gx=gx0;gx<=this.camX+W;gx+=80){ctx.beginPath();ctx.moveTo(gx+.5,this.camY);ctx.lineTo(gx+.5,this.camY+H);ctx.stroke();}
  for(let gy=gy0;gy<=this.camY+H;gy+=80){ctx.beginPath();ctx.moveTo(this.camX,gy+.5);ctx.lineTo(this.camX+W,gy+.5);ctx.stroke();}
  if(this.pools)for(const pl of this.pools){const a=pl.life/pl.maxLife;

  ctx.strokeRect(mmX+2+this.camX*mmSX,mmY+2+this.camY*mmSY,W*mmSX,H*mmSY);
  if(this.player){ctx.fillStyle='#50c8dc';ctx.beginPath();
    ctx.arc(mmX+2+this.player.x*mmSX,mmY+2+this.player.y*mmSY,3,0,7);ctx.fill();}
  tx('КАРТА',mmX+5,mmY+11,{size:9,color:'#a0c0ff'});};

function optionInfo(c,p){
  switch(c.k){
    case 'hp':return {desc:'Здоровье',info:'Макс. HP: '+p.maxHp+' → '+(p.maxHp+25),color:'#ff6060'};
    case 'mp':return {desc:'Мана',info:'Макс. MP: '+p.maxMp+' → '+(p.maxMp+10),color:'#4060e0'};
    case 'atk':return {desc:'Атака',info:'ATK: '+p.atk+' → '+(p.atk+3),color:'#ff8080'};
    case 'def':return {desc:'Защита',info:'DEF: '+p.def+' → '+(p.def+2),color:'#60a0ff'};
    case 'spd':return {desc:'Скорость',info:'SPD: '+p.spd.toFixed(1)+' → '+(p.spd+0.3).toFixed(1),color:'#80ff80'};
    case 'mag':return {desc:'Магия',info:'MAG: '+p.mag+' → '+(p.mag+3),color:'#c060c0'};
    case 'res':{const nr=p.res+2;const cur=Math.min(50,p.res);const nx=Math.min(50,nr);
      return {desc:'Сопротивление',info:'RES: '+p.res+' → '+nr+' (маг. урон -'+cur.toFixed(0)+'% → -'+nx.toFixed(0)+'%)',color:'#a0c0ff'};}
    case 'lck':{const nl=p.lck+3;
      return {desc:'Удача',info:'LCK: '+p.lck+' → '+nl+' (+0.9% крит, +0.6% dodge, +1.5% крит-урон, +6% золото)',color:'#ffcc44'};}
    case 'crit':return {desc:'Крит',info:'Шанс крита: '+p.crit.toFixed(1)+'% → '+(p.crit+2).toFixed(1)+'%',color:'#ffaa44'};
    case 'pierce':return {desc:'Пробитие',info:'Pierce: +'+p.pierceBonus+' → +'+(p.pierceBonus+1)+' (+'+(p.pierceBonus*10)+'% → +'+((p.pierceBonus+1)*10)+'% лазер)',color:'#a0c0ff'};
    case 'aoe':return {desc:'Область поражения',info:'AoE: ×'+p.aoeMult.toFixed(2)+' → ×'+(p.aoeMult+0.15).toFixed(2),color:'#80e0ff'};
    case 'cdr':{const nc=Math.min(0.75,p.cdr+0.05);return {desc:'Снижение перезарядки',info:'CDR: '+(p.cdr*100).toFixed(0)+'% → '+(nc*100).toFixed(0)+'%'+(nc>=0.75?' (кап)':''),color:'#a0e0ff'};}
    case 'hpreg':{const nr=Math.min(0.05,p.hpRegenPct+0.005);return {desc:'Регенерация HP',info:'Реген HP: '+(p.hpRegenPct*100).toFixed(1)+'%/с → '+(nr*100).toFixed(1)+'%/с'+(nr>=0.05?' (кап)':''),color:'#80ff80'};}
    case 'skUp':{const sk=SKILLS[c.sk];const nt=p.skills[c.sk].tier+1;const cost=c.cost||0;return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[nt].toFixed(1)+' · Тир: '+TI[nt]+(cost>0?' · '+cost+' оск.':''),color:TC[nt]};}
    case 'evoSk':{const evo=SKILL_EVO[c.sk];const nsk=SKILLS[evo.next];const nt=evo.startTier||0;const t=evoFragCost(c.sk);return {desc:nsk?nsk.desc:'',info:'ЭВОЛЮЦИЯ! → '+evo.next+' · Тир '+TI[nt]+' · Урон ×'+TM[nt].toFixed(1)+(t>0?' · '+t+' оск.':''),color:TC[nt]};}
    case 'newSk':{const sk=SKILLS[c.sk];return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[0].toFixed(1)+' · Тир: '+TI[0],color:TC[0]};}
    case 'newSp':{const sp=c.sp;return {desc:'Новое заклинание',info:sp.d+' урона · '+sp.mp+' MP · КД '+sp.cd+'с · '+TI[sp.t],color:sp.c};}
    case 'art':return {desc:c.a.d,info:'Артефакт — пассивный бонус',color:'#ffcc44'};
    case 'parryWin': return {desc:'Окно парирования', info:'Время: ' + ((p.parryWindowMax||0.3)*100).toFixed(0)+'мс → '+(((p.parryWindowMax||0.3)+0.05)*100).toFixed(0)+'мс', color:'#00ffff'};
    case 'parryDmg': return {desc:'Урон отражения', info:'Множитель: x' + (p.parryReflectMul||1).toFixed(2) + ' → x' + ((p.parryReflectMul||1)+0.25).toFixed(2), color:'#ff6060'};
    case 'parryRange': return {desc:'Радиус парирования', info:'AoE: ×' + p.aoeMult.toFixed(2) + ' → ×' + (p.aoeMult+0.5).toFixed(2), color:'#80e0ff'};
    case 'parryCharge': return {desc:'Заряды парирования', info:'Позволяет парировать ' + (1 + (p.bonusParries||0) + 1) + ' атаки подряд за одно нажатие', color:'#00ffff'};
	case 'synth':return {desc:c.syn.desc,info:'Синтез: '+c.syn.req.at(0)+' + '+c.syn.req.at(1)+(c.syn.cost?' ('+c.syn.cost+' оск.)':''),color:c.syn.color||'#ffd700'};
  }
  return {desc:'',info:'',color:'#fff'};
}

Game.prototype.rForge=function(){
  this.bg('#0a0a12');const t=performance.now()/1000;
  for(let i=0;i<60;i++){const x=(Math.sin(t*.4+i*1.3)*.5+.5)*W;
    const y=(Math.cos(t*.3+i*.7)*.5+.5)*H;
    ctx.globalAlpha=.05+Math.abs(Math.sin(t+i))*.1;
    ctx.fillStyle='#ffcc44';ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  tx('⚒ КУЗНЯ ⚒',W/2,55,{size:40,weight:'bold',color:'#ffcc44',align:'center',glow:'#ffcc44',glowBlur:25});
  const rk=RANKS[this.forgeRank];
  tx('Ранг: '+rk.n,W/2,105,{size:18,weight:'bold',color:rk.c,align:'center'});
  tx('Золото: '+~~this.player.gold,W/2,132,{size:14,color:'#ffcc44',align:'center'});
  const pool=this.forgeItems;
  const cellH=85;
  const startY=160;
  const visibleH=420;
  const maxScroll=Math.max(0, pool.length*cellH - visibleH);
  if(this.forgeScroll>maxScroll)this.forgeScroll=maxScroll;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, startY, W, visibleH);
  ctx.clip();
  for(let i=0;i<pool.length;i++){
    const w=pool[i];const y=startY+i*cellH-this.forgeScroll;
    if(y<startY-cellH || y>startY+visibleH)continue;
    const hv=this.hov(W/2-380,y,760,70);
    const canAfford=this.player.gold>=w.cost;
    const isEq=this.player.wep.n===w.n;
    const isOwned=this.weaponMaster && this.player.ownedWeapons.includes(w);
    const mat=MATERIALS[w.mat]||MATERIALS['—'];
    ctx.fillStyle=hv&&!isEq?'rgba(50,70,100,.95)':'rgba(25,35,55,.9)';
    ctx.fillRect(W/2-380,y,760,70);
    ctx.strokeStyle=isEq?'#50c8dc':(hv&&(canAfford||isOwned)&&!isEq?'#ffcc44':'#4060a0');
    ctx.lineWidth=hv?3:2;ctx.strokeRect(W/2-380,y,760,70);
    const wc=RANKS[w.rank].c;
    txFit(w.n,W/2-360,y+22,540,{size:16,color:wc},11);
    tx('['+RANKS[w.rank].n+']',W/2+360,y+22,{size:11,color:wc,align:'right'});
    txClip('['+w.mat+']',W/2-360,y+38,300,{size:11,color:mat.c});
    txClip(w.atkType.toUpperCase(),W/2-360+310,y+38,200,{size:11,color:'#a0c0ff'});
    txClip(w.d,W/2-360,y+54,720,{size:11,color:'#c8d0e0'});
    tx('ATK +'+w.a+' · MAG +'+w.m+' · '+w.cost+' золота',W/2-360,y+70,{size:11,color:canAfford||isEq||isOwned?'#80ff80':'#ff6060'});
    if(isEq){tx('ЭКИПИРОВАНО',W/2+340,y+50,{size:11,color:'#50c8dc',align:'right',weight:'bold'});}
    else if(isOwned){tx('КУПЛЕНО (Q/E/R)',W/2+340,y+50,{size:11,color:'#80ff80',align:'right',weight:'bold'});}
    else if(!canAfford){tx('Не хватает золота',W/2+340,y+50,{size:11,color:'#ff6060',align:'right'});}
    else{
      if(this.weaponMaster) tx('КУПИТЬ',W/2+340,y+50,{size:12,color:'#ffcc44',align:'right',weight:'bold'});
      else tx('СКОВАТЬ',W/2+340,y+50,{size:12,color:'#ffcc44',align:'right',weight:'bold'});
    }
  }
  ctx.restore();
  if(maxScroll>0){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2+390, startY, 12, visibleH);
    const thumbH = Math.max(30, (visibleH/maxScroll)*visibleH);
    const thumbY = startY + (this.forgeScroll/maxScroll)*(visibleH - thumbH);
    ctx.fillStyle='#ffcc44';ctx.fillRect(W/2+390, thumbY, 12, thumbH);
  }
  if(this.weaponMaster) tx('Купить: Клик · Экипировать: Q/E/R (наведи на оружие)',W/2,H-100,{size:14,color:'#ffcc44',align:'center'});
  const btnY=H-65;
  const hvC=this.hov(W/2-150,btnY,300,50);
  ctx.fillStyle=hvC?'#3a6a8a':'#203050';ctx.fillRect(W/2-150,btnY,300,50);
  ctx.strokeStyle='#50c8dc';ctx.lineWidth=2;ctx.strokeRect(W/2-150,btnY,300,50);
  tx('ЗАКРЫТЬ И ПРОДОЛЖИТЬ',W/2,btnY+32,{size:15,color:hvC?'#fff':'#c8d0e0',align:'center',weight:'bold'});
};

Game.prototype.rCutscene=function(){
  const cd=this.cutsceneData||{x:W/2,y:H/2,color:'#c0c0ff'};
  const elapsed=5-this.cutsceneTimer;const t=performance.now()/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const fadeIn=Math.min(1,elapsed*2);
  ctx.globalAlpha=fadeIn;ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  for(let i=0;i<80;i++){const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.08+Math.abs(Math.sin(t*1.5+i))*.25;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const luvAlpha=Math.max(0,1-elapsed*0.5);
  if(luvAlpha>0){const luvSize=42*(1+elapsed*0.15);
    ctx.globalAlpha=luvAlpha*0.85;shape('winged',W/2,H/2-40,luvSize,sh(cd.color,-40),false);
    for(let i=0;i<15;i++){const angle=Math.random()*6.283;const r=Math.random()*80;
      const px=W/2+Math.cos(angle)*r;const py=H/2-40+Math.sin(angle)*r;
      ctx.globalAlpha=luvAlpha*Math.random()*0.9;ctx.fillStyle=cd.color;
      ctx.beginPath();ctx.arc(px,py,Math.random()*3+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;}
  if(elapsed>1&&elapsed<3){const waveProg=(elapsed-1)/2;const waveR=50+waveProg*300;
    ctx.strokeStyle='rgba(192,192,255,'+(1-waveProg)*0.6+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,204,68,'+(1-waveProg)*0.4+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR*0.7,0,7);ctx.stroke();}
  if(elapsed>1&&elapsed<4){const riseProg=(elapsed-1)/3;const count=Math.floor(riseProg*40);
    for(let i=0;i<count;i++){const angle=(i/count)*6.283+t;const r=40+riseProg*100;
      const px=W/2+Math.cos(angle)*r*0.7;const py=H/2-40+Math.sin(angle)*r*0.4-riseProg*60;
      ctx.globalAlpha=0.8-riseProg*0.5;ctx.fillStyle='#ffcc44';
      ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();}
    ctx.globalAlpha=1;}
  if(elapsed>2){const slimeProg=Math.min(1,(elapsed-2)/2);const slimeSize=20+slimeProg*45;
    ctx.globalAlpha=slimeProg;ctx.fillStyle='rgba(80,200,220,0.15)';
    ctx.beginPath();ctx.arc(W/2,H/2-40,slimeSize*2,0,7);ctx.fill();
    shape('circle',W/2,H/2-40,slimeSize,'#50c8dc',false);
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.strokeStyle='#50c8dc';ctx.lineWidth=2;
    for(let i=0;i<8;i++){const angle=i/8*6.283+t*0.5;
      const r1=slimeSize*1.3,r2=slimeSize*1.3+15;
      ctx.globalAlpha=slimeProg*0.6;ctx.beginPath();
      ctx.moveTo(W/2+Math.cos(angle)*r1,H/2-40+Math.sin(angle)*r1);
      ctx.lineTo(W/2+Math.cos(angle)*r2,H/2-40+Math.sin(angle)*r2);ctx.stroke();}
    ctx.globalAlpha=1;}
  const textLines=[
    {l:0.3,t:'Иварадж поглощает Вельданаву и Руверудж...',c:'#ff40a0'},
    {l:1.5,t:'Но Римуру поглощает самого Ивараджа.',c:'#c080ff'},
    {l:2.7,t:'Четыре Истинных Дракона обрели покой...',c:'#50c8dc'},
    {l:3.7,t:'Слизь стал Богом Пустоты.',c:'#ffcc44'}];
  for(let i=0;i<textLines.length;i++){const tl=textLines[i];
    if(elapsed>=tl.l){const alpha=Math.min(1,(elapsed-tl.l)*2);
      ctx.globalAlpha=alpha;
      txFit(tl.t,W/2,H/2+150+i*30,W-100,{size:18,color:tl.c,align:'center',glow:tl.c,glowBlur:10*alpha},12);
      ctx.globalAlpha=1;}}
  if(elapsed>1.5){const btnX=W-220,btnY=H-70,btnW=200,btnH=50;
    const hv=this.mx>=btnX&&this.mx<=btnX+btnW&&this.my>=btnY&&this.my<=btnY+btnH;
    const alpha=Math.min(1,(elapsed-1.5)*2);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=hv?'rgba(60,110,140,.95)':'rgba(30,50,80,.85)';ctx.fillRect(btnX,btnY,btnW,btnH);
    ctx.strokeStyle=hv?'#80e0f0':'#4060a0';ctx.lineWidth=2;ctx.strokeRect(btnX,btnY,btnW,btnH);
    tx('ПРОПУСТИТЬ',btnX+btnW/2,btnY+31,{size:16,weight:'bold',color:hv?'#fff':'#c8d0e0',align:'center'});
    ctx.globalAlpha=1;}
};

Game.prototype.rVictory=function(){
  const p=this.player;const t=performance.now()/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++){const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.05+Math.abs(Math.sin(t*1.5+i))*.15;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1+Math.sin(t+i)*1,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(W/2,180+Math.sin(t)*5);
  shape('slime',0,0,55,'#50c8dc',false);
  for(let i=0;i<12;i++){const a=t*.6+i/12*6.283;const r=80+Math.sin(t*2+i)*20;
    ctx.globalAlpha=.4+Math.sin(t*3+i)*.3;ctx.fillStyle='#ffcc44';
    ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2,0,7);ctx.fill();}
  ctx.restore();ctx.globalAlpha=1;
  const glow=Math.sin(t*2)*0.3+0.7;
  tx('✦ ИСТИННЫЙ ФИНАЛ ✦',W/2,320,{size:48,weight:'bold',color:'#ffcc44',align:'center',glow:'#ffcc44',glowBlur:40*glow});
  tx('Хроники Истинных Драконов завершены',W/2,365,{size:20,color:'#a0c0ff',align:'center'});
  const lines=[
    'Иварадж поглотил Вельданаву и Руверудж — но Римуру поглотил их обоих.',
    'Четыре Истинных Дракона обрели покой в его клинке.',
    'Слизь, ставшая Повелителем Монстров, поднялась до Бога Пустоты.',
    '','Вельдора наконец свободен. Вельзард и Вельгринд вернулись на Север.',
    'Милим Нава улыбается. Леон, Ламирис, Диабло — все живы.',
    'Темпест стоит. Мир Тенсуры — тоже.','',
    'И где-то далеко, в другом мире, Миками Сатору больше не один.'];
  let ly=410;
  for(const line of lines){txFit(line,W/2,ly,W-80,{size:14,color:line.startsWith('—')?'#ffcc44':'#e6e6f0',align:'center'},10);ly+=26;}
  tx('Уровень '+p.lv+'   •   Волна 50   •   Убийств '+p.kills+'   •   Артефактов '+p.arts.length,W/2,H-110,{size:14,color:'#a0a8b8',align:'center'});
  tx('⏱ Время прохождения: '+fmtTime(this.runTime),W/2,H-140,{size:18,weight:'bold',color:'#80c0ff',align:'center'});
  tx('Секретных побед: '+(SV.d.secWins||1),W/2,H-85,{size:12,color:'#ffcc44',align:'center'});
  const hv=this.hov(W/2-200,H-55,400,40);
  ctx.fillStyle=hv?'rgba(50,80,110,.9)':'rgba(30,45,65,.8)';
  ctx.fillRect(W/2-200,H-55,400,40);
  ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;ctx.strokeRect(W/2-200,H-55,400,40);
  tx('Нажмите любую клавишу или кликните',W/2,H-30,{size:14,color:hv?'#fff':'#c8d0e0',align:'center'});
};

      'V — авто-зелье: лечит 15% HP при HP<25%, КД 5 сек.']},

    {title:'🎯 Кузня и оружие',lines:[

    {title:'🌌 Бесконечный режим',lines:[

    let ty=boxY+68;

window.addEventListener('load',()=>{new Game();});
