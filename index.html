function wrapText(text,maxW,size,weight){
  ctx.font=(weight||'')+' '+size+'px Consolas,monospace';

function src(tier){return tier>=TIER_SUP?'supreme':'normal';}
function predictAim(px,py,t,projSpeed){
  if(!t)return null;
  const spdPx=t.isBoss?(t.ph===1?70:100):(t.spd||0)*62;
  const ea=Math.atan2(py-t.y,px-t.x);
  const evx=Math.cos(ea)*spdPx;
  const evy=Math.sin(ea)*spdPx;
  let tt=Math.sqrt((px-t.x)**2+(py-t.y)**2)/projSpeed;
  for(let k=0;k<3;k++){
    const predX=t.x+evx*tt;
    const predY=t.y+evy*tt;
    tt=Math.sqrt((px-predX)**2+(py-predY)**2)/projSpeed;
  }
  return Math.atan2((t.y+evy*tt)-py,(t.x+evx*tt)-px);
}
function xpForLevels(p,n){
  let total=0;
  let xpn=p.xpn;
  for(let i=0;i<n;i++){total+=xpn;xpn=~~(xpn*1.25);}
  return total;
}
function scaleEnemyToWave(e,wave){
  const hpMul = wave<=20 ? 1+0.01*(wave-1) : Math.pow(1.03,wave-20)*1.19;
  const xpMul = wave<=20 ? 1+0.10*(wave-1) : Math.pow(1.08,wave-20)*2.90;
  e.maxHp=~~(e.maxHp*hpMul);e.hp=e.maxHp;e.atk=~~(e.atk*hpMul);e.xp=~~(e.xp*xpMul);
  return e;
}
function makeChaosEnemy(e){
  e.chaos=true;
  e.maxHp=~~(e.maxHp*1.3);e.hp=e.maxHp;
  e.atk=~~(e.atk*1.5);
  e.spd=e.spd*1.2;
  e.xp=~~(e.xp*1.5);
  e.z=e.z*1.15;
  e.c=sh(e.c,-25);
  return e;
}
function fmtTime(s){
  s=Math.floor(s);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function availableElites(g){
  return ELITE.filter(e=>{
    if(e.unlock.type==='wave') return g.wave>=e.unlock.val;
    if(e.unlock.type==='boss'){
      if(!g.bsSpawned.has(e.unlock.key)) return false;
      const t=BT[e.unlock.key];
      if(t&&t.pair){
        return !g.bosses.some(b=>t.pair.includes(b.bn));
      }
      return !g.bosses.some(b=>b.bn===e.unlock.key);
    }
    return false;
  });
}

class FTxt{constructor(t,x,y,c,l,sz){this.t=t;this.x=x;this.y=y;this.c=c||'#fff';
this.l=l||1.2;this.ml=this.l;this.sz=sz||16;this.vy=-40;}
update(dt){this.y+=this.vy*dt;this.l-=dt;}
draw(){const a=cl(this.l/this.ml,0,1);ctx.globalAlpha=a;
const edge=Math.min(WW-this.x,this.x)*2-40;
const maxW=Math.max(120,Math.min(680,edge));
txFit(this.t,this.x,this.y,maxW,{color:this.c,size:this.sz,align:'center'},10);
ctx.globalAlpha=1;}}
class Part{constructor(x,y,c){this.x=x;this.y=y;this.c=c;
const a=rnd(0,6.28),s=rnd(80,320);this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
this.l=rnd(.3,.8);this.ml=this.l;this.z=rnd(2,5);}
update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=.94;this.vy*=.94;this.l-=dt;}
draw(){const a=cl(this.l/this.ml,0,1);ctx.globalAlpha=a;
ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.z*a,0,7);ctx.fill();ctx.globalAlpha=1;}}
class Proj{constructor(x,y,vx,vy,dmg,c,r,fr,pierce,src,explR,explDmg){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.dmg=dmg;this.c=c;this.r=r;
this.fr=fr;this.pierce=pierce||0;this.alive=true;this.l=2;this.tr=[];this.src=src||'normal';
this.explR=explR||0;this.explDmg=explDmg||0;this.hitIds=new Set();}
update(dt){this.tr.push(this.x,this.y);if(this.tr.length>10){this.tr.shift();this.tr.shift();}
this.x+=this.vx*dt;this.y+=this.vy*dt;this.l-=dt;
if(this.l<=0)this.alive=false;}
draw(){for(let i=0;i<this.tr.length-2;i+=2){ctx.globalAlpha=(i/this.tr.length)*.4;ctx.fillStyle=this.c;
ctx.beginPath();ctx.arc(this.tr[i],this.tr[i+1],this.r*.6,0,7);ctx.fill();}
ctx.globalAlpha=1;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,7);ctx.fill();
if(this.explR>0){ctx.strokeStyle=this.c;ctx.globalAlpha=.3;ctx.lineWidth=1;
ctx.beginPath();ctx.arc(this.x,this.y,this.explR,0,7);ctx.stroke();ctx.globalAlpha=1;}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.r*.4,0,7);ctx.fill();}}

class Enemy{constructor(x,y,t,m){this.x=x;this.y=y;this.t=t;
this.maxHp=t.h*(m.eh||1);this.hp=this.maxHp;this.atk=t.a*(m.ea||1);
this.spd=t.s*(m.es||1);this.xp=t.x;this.c=t.c;this.z=t.z;this.sh=t.sh||'circle';
this.alive=true;this.acd=0;this.hf=0;this.def=0;
this.sp=t.sp||null;this.spcd=rnd(2,4);this.charging=0;
this.elite=false;this.chaos=false;this.shield=0;this._exploded=false;}
update(dt,p,g){
  if(this.sp==='charge'&&this.charging>0){
    this.x+=Math.cos(this.chargeA)*650*dt;this.y+=Math.sin(this.chargeA)*650*dt;
    this.charging-=dt;
    if(d2(this.x,this.y,p.x,p.y)<(this.z+p.z)**2)p.hurt(this.atk*1.5);
    this.hf=Math.max(0,this.hf-dt);return;
  }
  const dx=p.x-this.x,dy=p.y-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  if(d>1){this.x+=dx/d*this.spd*62*dt;this.y+=dy/d*this.spd*62*dt;}
  this.acd=Math.max(0,this.acd-dt);
  if(d<this.z+p.z&&this.acd<=0){p.hurt(this.atk);this.acd=1;}
  this.hf=Math.max(0,this.hf-dt);
  if(this.sp){
    this.spcd-=dt;
    if(this.sp==='orclord'&&this.spcd<=0&&g){
      this.spcd=5;
      for(const e of g.enemies){
        if(e!==this&&e.alive&&e.t.n&&e.t.n.includes('Орк')&&d2(e.x,e.y,this.x,this.y)<250*250){
          e.hp=Math.min(e.maxHp,e.hp+30);e.atk*=1.08;
          g.particles.push(new Part(e.x,e.y,'#ffcc44'));
        }
      }
    } else if(this.sp==='charge'&&this.spcd<=0&&d<400){
      this.spcd=4;this.charging=.7;this.chargeA=Math.atan2(p.y-this.y,p.x-this.x);
    } else if(this.sp==='engulf'&&d<this.z+p.z+8&&this.spcd<=0){
      this.spcd=2.5;p.hurt(this.atk*1.8);
      const a=Math.atan2(p.y-this.y,p.x-this.x);
      p.x+=Math.cos(a)*80;p.y+=Math.sin(a)*80;
      if(g){for(let i=0;i<8;i++)g.particles.push(new Part(p.x,p.y,'#50c8dc'));}
    } else if(this.sp==='summon'&&this.spcd<=0&&g){
      this.spcd=8;
      if(g.enemies.length<100){
        for(let i=0;i<2;i++){
          const aa=Math.random()*6.283;
          const mx=this.x+Math.cos(aa)*60,my=this.y+Math.sin(aa)*60;
          const me=new Enemy(mx,my,ET[1],g.loc.m);
          scaleEnemyToWave(me,g.wave);g.enemies.push(me);
        }
        g.ftxt.push(new FTxt('ПРИЗЫВ!',this.x,this.y-40,'#80c060',1.5,14));
      }
    } else if(this.sp==='blink'&&this.spcd<=0&&d<500){
      this.spcd=6;
      const aa=Math.random()*6.283;
      this.x=cl(p.x+Math.cos(aa)*(80+p.z),30,WW-30);
      this.y=cl(p.y+Math.sin(aa)*(80+p.z),30,WH-30);
      if(g){for(let i=0;i<8;i++)g.particles.push(new Part(this.x,this.y,'#303050'));}
    } else if(this.sp==='curse'&&d<this.z+p.z+8&&this.spcd<=0){
      this.spcd=4;p.slow=Math.max(p.slow||0,2);
      if(g){g.ftxt.push(new FTxt('ПРОКЛЯТИЕ!',p.x,p.y-30,'#a060c0',1.5,14));
        for(let i=0;i<10;i++)g.particles.push(new Part(p.x,p.y,'#a060c0'));}
    } else if(this.sp==='shield'&&this.spcd<=0){
      this.spcd=8;this.shield=80+this.maxHp*0.1;
      if(g){g.ftxt.push(new FTxt('ЩИТ!',this.x,this.y-40,'#a0c0ff',1.5,14));}
    } else if(this.sp==='breath'&&this.spcd<=0&&d<600&&g){
      this.spcd=5;
      const a=Math.atan2(p.y-this.y,p.x-this.x);
      for(let i=-2;i<=2;i++){const aa=a+i*0.18;
        g.proj.push(new Proj(this.x,this.y,Math.cos(aa)*420,Math.sin(aa)*420,this.atk*0.8,'#ff6020',8,false,1));
      }
    } else if(this.sp==='freeze'&&d<this.z+p.z+8&&this.spcd<=0){
      this.spcd=4;p.slow=Math.max(p.slow||0,3);
      if(g){g.ftxt.push(new FTxt('ЗАМОРОЖЕН!',p.x,p.y-30,'#80d0ff',1.5,14));
        for(let i=0;i<10;i++)g.particles.push(new Part(p.x,p.y,'#80d0ff'));}
    } else if(this.sp==='holyray'&&this.spcd<=0&&d<400&&g){
      this.spcd=6;
      const dmg=this.atk*1.5;
      if(p.inv<=0&&p.dodg<=0){
        let reduced=Math.max(1,dmg-p.def*0.25);
        if(p.buffs.stoic>0)reduced*=0.5;
        if(p.shield>0){const ab=Math.min(p.shield,reduced);p.shield-=ab;reduced-=ab;
          if(p.shield<=0)p.buffs.shield=0;}
        reduced=~~reduced;
        p.hp-=reduced;if(p.hp<0)p.hp=0;p.inv=0.35;
        g.ftxt.push(new FTxt('СВЯТОЙ ЛУЧ!',p.x,p.y-30,'#fff8c0',1.8,16));
      }
      for(let i=0;i<15;i++){const t=i/15;
        g.particles.push(new Part(this.x+(p.x-this.x)*t,this.y+(p.y-this.y)*t,'#fff8c0'));
      }
    }
  }
}
dmg(v,src){
  if(this.shield>0){const ab=Math.min(this.shield,v);this.shield-=ab;v-=ab;}
  this.hp-=v;this.hf=.1;
  if(this.hp<=0)this.alive=false;
  return true;
}
draw(){
  ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();
  ctx.ellipse(this.x,this.y+this.z*.7,this.z*.8,this.z*.3,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  if(this.elite){
    const pulse=0.5+Math.sin(performance.now()/200+this.x*0.02)*0.35;
    ctx.strokeStyle='rgba(255,200,0,'+pulse+')';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(this.x,this.y,this.z*1.35,0,7);ctx.stroke();
  }
  if(this.chaos){
    const pulse=0.4+Math.sin(performance.now()/250+this.x*0.01)*0.35;
    ctx.strokeStyle='rgba(180,20,255,'+pulse+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(this.x,this.y,this.z*1.4,0,7);ctx.stroke();
  }
  if(this.shield>0){
    ctx.strokeStyle='rgba(120,200,255,.7)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(this.x,this.y,this.z+6,0,7);ctx.stroke();
  }
  const s=1+Math.sin(performance.now()/300)*.05;
  shape(this.sh,this.x,this.y,this.z*s,this.c,this.hf>0);
  if(this.elite){
    tx(this.t.n,this.x,this.y-this.z-14,{size:9,color:'#ffcc44',align:'center'});
    bar(this.x-this.z,this.y-this.z-4,this.z*2,4,this.hp,this.maxHp,'#e04040');
  } else {
    bar(this.x-this.z,this.y-this.z-8,this.z*2,4,this.hp,this.maxHp,'#e04040');
  }
}}

class Boss extends Enemy{constructor(x,y,t,m){super(x,y,t,m);this.bn=t.n;this.ph=1;
this.at=1.5;this.st=2;this.td=t;this.isBoss=true;this.sup=t.sup||false;this.hsf=0;
this.spCd=0;this.spCd2=0;this.spTimer=0;this.spPhase=0;this.spData=null;this.spCharge=0;
this.baseColor=t.c;this.spawnAt=performance.now();this.spawnWave=0;
this.enraged=false;this.enrageUsed=false;this.enrageTimer=0;this._enrageShown=false;this.game=null;
this.baseAtk=this.atk;this.baseSpd=this.spd;this.baseSt=this.st;this.baseAt=this.at;}
update(dt,p,g){this.game=g;
if(this.enraged){
  this.enrageTimer-=dt;
  if(!this._enrageShown){
    this._enrageShown=true;
    g.ftxt.push(new FTxt('Гнев побеждённого,',this.x,this.y-160,'#8b0000',3,28));
    g.ftxt.push(new FTxt('неудовлетворённого битвой',this.x,this.y-130,'#8b0000',3,28));
    g.shake=25;AU.sfx('boss');
  }
  const prog=1-Math.max(0,this.enrageTimer)/20;
  this.atk=~~(this.baseAtk*(2+prog*2));
  this.spd=this.baseSpd*(1.5+prog*0.8);
  this.st=Math.max(0.3,this.baseSt*(0.5-prog*0.3));
  this.at=Math.max(0.4,this.baseAt*(0.6-prog*0.3));
  this.c=sh(this.baseColor,-80-~~(prog*60));
  if(this.enrageTimer<=0){
    if(this.bn==='Веланава'){
      this.enraged=false;
      this.hp=1;
      g.ftxt.push(new FTxt('Веланава истощена...',this.x,this.y-60,'#f0e090',2,18));
    } else {
      this.alive=false;
      g.ftxt.push(new FTxt('Босс пал от истощения',this.x,this.y-60,'#ff6060',2,18));
    }
    return;
  }
}
const dx=p.x-this.x,dy=p.y-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
const sp=this.ph===1?70:100;
if(d>1){this.x+=dx/d*sp*dt;this.y+=dy/d*sp*dt;}
this.at-=dt;
if(d<this.z+p.z+10&&this.at<=0){
  p.hurt(this.atk);
  if(this.bn==='Гельд, Орк-лорд')this.hp=Math.min(this.maxHp,this.hp+this.atk*0.15);
  this.at=1.2;
}
this.st-=dt;if(this.st<=0){this.cast(p,g);this.st=this.ph===1?3.5:2.2;}
if(this.spCd>0)this.spCd-=dt;
if(this.spCd2>0)this.spCd2-=dt;
this.specialUpdate(dt,p,g);
if(this.ph===1&&this.hp<this.maxHp*.5){this.ph=2;this.c=this.td.p2||this.c;
g.ftxt.push(new FTxt('Фаза 2!',this.x,this.y-40,'#ff4040',2,20));}
this.hf=Math.max(0,this.hf-dt);this.hsf=Math.max(0,this.hsf-dt);}
dmg(v,src){
  if(this.sup&&src!=='supreme'){this.hsf=.5;return false;}
  if(this.enraged){this.hf=.1;return true;}
  this.hp-=v;this.hf=.1;
  if(this.bn==='Веланава'&&this.hp<1)this.hp=1;
  const elapsed=this.game?(this.game.runTime-this.spawnWave):((performance.now()-this.spawnAt)/1000);
  const enrageThreshold=this.bn==='Веланава'?2:0;
  if(this.hp<=enrageThreshold){
    if(!this.enrageUsed && elapsed<20){
      this.baseAtk=this.atk;
      this.baseSpd=this.spd;
      this.baseSt=this.st;
      this.baseAt=this.at;
      this.enrageUsed=true;
      this.enraged=true;
      this.enrageTimer=20;
      this._enrageShown=false;
      this.hp=Math.max(1,this.hp);
      return true;
    }
    if(this.bn!=='Веланава')this.alive=false;
  }
  return true;}
specialUpdate(dt,p,g){
  const a=Math.atan2(p.y-this.y,p.x-this.x);
  if(this.bn==='Гельд, Орк-лорд'){
    if(this.spCd<=0){
      this.spCd=8;
      g.ftxt.push(new FTxt('ЗЕМЛЕТРЯС!',this.x,this.y-60,'#ffa040',2,18));
      this.spData={type:'quake',timer:0.6,radius:220};g.shake=12;
    }
    if(this.spData&&this.spData.type==='quake'){
      this.spData.timer-=dt;
      if(this.spData.timer<=0){
        const R=this.spData.radius;
        if(d2(this.x,this.y,p.x,p.y)<R*R){p.hurt(this.atk*0.8);p.slow=Math.max(p.slow||0,2);
          g.ftxt.push(new FTxt('ЗАМЕДЛЕН!',p.x,p.y-30,'#ffa040',1.5,14));}
        for(let i=0;i<20;i++){const aa=i/20*6.283;g.particles.push(new Part(this.x+Math.cos(aa)*R*.8,this.y+Math.sin(aa)*R*.8,'#ffa040'));}
        this.spData=null;
      }
    }
  }
  if(this.bn==='Хината Сакагучи'){
    if(this.spCd<=0){
      this.spCd=7;
      g.ftxt.push(new FTxt('MELT SLASH!',this.x,this.y-60,'#e0e0ff',2,18));
      this.spData={type:'dash',timer:0.4,target:{x:p.x,y:p.y}};
    }
    if(this.spData&&this.spData.type==='dash'){
      this.spData.timer-=dt;
      const ddx=this.spData.target.x-this.x, ddy=this.spData.target.y-this.y;
      const dd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      this.x+=ddx/dd*900*dt; this.y+=ddy/dd*900*dt;
      if(this.spData.timer<=0){
        if(d2(this.x,this.y,p.x,p.y)<(this.z+p.z+30)**2){
          if(p.inv<=0&&p.dodg<=0){
            const raw=this.atk*1.8;
            const reduced=Math.max(raw*0.5, raw-p.def*0.25);
            p.hp-=reduced;if(p.hp<0)p.hp=0;p.inv=0.35;
            g.ftxt.push(new FTxt('ПРОБИТИЕ!',p.x,p.y-30,'#ffffff',1.8,16));
          }
        }
        this.spData=null;
      }
    }
  }
  if(this.bn==='Клейман'){
    if(this.spCd<=0){
      this.spCd=10;
      g.ftxt.push(new FTxt('МАРИОНЕТКИ!',this.x,this.y-60,'#c040ff',2,16));
      for(let i=0;i<2;i++){
        const aa=Math.random()*6.283;
        const mx=this.x+Math.cos(aa)*100, my=this.y+Math.sin(aa)*100;
        const me=new Enemy(mx,my,{n:'Марионетка',h:180,a:12,s:1.8,x:10,c:'#a040c0',z:14,l:5,sh:'star'},g.loc.m);
        scaleEnemyToWave(me,g.wave);g.enemies.push(me);
      }
    }
    if(this.spCd2<=0){
      this.spCd2=6;
      if(d2(this.x,this.y,p.x,p.y)<350*350){
        if(p.inv<=0&&p.dodg<=0){

if(k['a']||k['arrowleft'])dx--;
if(k['d']||k['arrowright'])dx++;
if(this.dodg>0){this.x+=this.dvx*dt;this.y+=this.dvy*dt;this.dodg-=dt;}
else if(dx||dy){let sp=this.spd*62;if(this.buffs.haste>0)sp*=1.4;if(this.slow>0)sp*=0.55;
const L=Math.sqrt(dx*dx+dy*dy);this.x+=dx/L*sp*dt;this.y+=dy/L*sp*dt;
this.aim=Math.atan2(dy,dx);}
this.x=cl(this.x,this.z,WW-this.z);this.y=cl(this.y,this.z,WH-this.z);
this.inv=Math.max(0,this.inv-dt);this.acd=Math.max(0,this.acd-dt);
this.mcd=Math.max(0,this.mcd-dt);this.dcd=Math.max(0,this.dcd-dt);
this.tearCd=Math.max(0,this.tearCd-dt);this.apcd=Math.max(0,this.apcd-dt);
for(const b in this.buffs)this.buffs[b]=Math.max(0,this.buffs[b]-dt);
if(this.buffs.shield<=0&&this.shield>0)this.shield=0;
for(const s in this.skills)if(this.skills[s].cd>0)this.skills[s].cd-=dt;
for(const sp of this.spells)if((sp.cd||0)>0)sp.cd-=dt;
if(this.autoPotion&&this.hasSage()&&this.hp<this.maxHp*0.25&&this.apcd<=0){
  const heal=this.maxHp*0.15;
  this.hp=Math.min(this.maxHp,this.hp+heal);
  this.apcd=Math.max(1.5,5*(1-this.cdr));
  g.ftxt.push(new FTxt('Мудрец: +'+~~heal+' HP',this.x,this.y-35,'#a0ffa0',1.5,14));
}
const t=this.near(g.enemies,g.bosses);
if(t&&this.acd<=0){
  const pa=predictAim(this.x,this.y,t,600);
  const a=pa!==null?pa:Math.atan2(t.y-this.y,t.x-this.x);
  const cr=Math.random()*100<this.crit;
  const dm=(this.atk+this.wep.a)*(cr?this.cdmg:1)*dmgBonus;
  const src=this.hasSup()?'supreme':'normal';
  g.proj.push(new Proj(this.x,this.y,Math.cos(a)*600,Math.sin(a)*600,dm,this.c,5,true,this.pierceBonus||0,src));
  if(cr)g.ftxt.push(new FTxt('КРИТ!',this.x,this.y-25,'#ffdd44',.7,12));
  const baseAcd=(this.rid==='beastman')?0.4:0.5;
  let rawAcd=this.buffs.haste>0?baseAcd*0.7:baseAcd;
  if(this.buffs.satanael>0)rawAcd*=0.7;
  this.acd=Math.max(0.15,rawAcd*(1-this.cdr));
}
if(this.spells.length){
  const ready=this.spells.filter(sp=>(sp.cd||0)<=0&&this.mp>=sp.def.mp);
  if(ready.length&&t){
    let sp;
    const frac=this.mp/this.maxMp;
    if(frac<0.3){sp=ready.reduce((a,b)=>a.def.mp<=b.def.mp?a:b);}
    else if(frac>0.7){sp=ready.reduce((a,b)=>a.def.mp>=b.def.mp?a:b);}
    else{sp=pick(ready);}
    if(this.buffs.satanael<=0)this.mp-=sp.def.mp;
    sp.cd=sp.def.cd*(1-this.cdr);
    const pa=predictAim(this.x,this.y,t,sp.def.sp);
    const a=pa!==null?pa:Math.atan2(t.y-this.y,t.x-this.x);
    const elm=sp.def.el==='fire'?(this.fm||1):sp.def.el==='ice'?(this.im||1):1;
    const dm=(sp.def.d*TM[sp.def.t]+this.mag*.5)*dmgBonus*elm;
    const src=this.hasSup()?'supreme':'normal';
    const explR=(sp.def.explR||0)*(this.aoeMult||1);
    const explDmg=explR>0?dm*0.35:0;
    g.proj.push(new Proj(this.x,this.y,Math.cos(a)*sp.def.sp,Math.sin(a)*sp.def.sp,dm,sp.def.c,7,true,this.pierceBonus||0,src,explR,explDmg));
  }
}
const bonusRegen=(this.buffs.regen||0)*0.5;
this.regen+=dt;
if(this.regen>=1){this.regen-=1;
const effMpR=this.mpR+(this.lv*0.25)+(this.maxMp*0.01);
this.mp=Math.min(this.maxMp,this.mp+effMpR+(this.loc.m.mp||0)+bonusRegen);
this.hp=Math.min(this.maxHp, this.hp + this.hpR + this.maxHp*this.hpRegenPct + bonusRegen);}
if(this.resonanceCount>0){
  for(const rk of resSkills){
    const rsk=this.skills[rk];
    if(rsk&&rsk.resCd>0)rsk.resCd-=dt;
  }
  this.resonanceTimer-=dt;
  if(this.resonanceTimer<=0){
    const rt=this.near(g.enemies,g.bosses);
    if(rt){
      const ready=resSkills.filter(rk=>{
        const rsk=this.skills[rk];
        return rsk&&(rsk.resCd||0)<=0&&SKILLS[rk];
      });
      if(ready.length>0){
        const safe=ready.filter(rk=>{
          if(rk==='Тёмная Стрела'&&this.hp<this.maxHp*0.5)return false;
          if(rk==='Судный День'&&this.skills[rk].tier<TIER_SUP)return false;
          return true;
        });
        if(safe.length>0){
          const rk=pick(safe);
          const rsk=this.skills[rk];
          const rdef=SKILLS[rk];
          rsk.resCd=rdef.cd*4*(1-this.cdr);
          this.resonanceTimer=Math.max(0.5,1.5*(1-this.cdr));
          rdef.n=rk;
          rdef.cast(g,this,rt);
          g.ftxt.push(new FTxt('◈ '+rk,this.x,this.y-55,'#a0c0ff',1.4,12));
          AU.sfx('sel');
        }
      }
    }
  }
}}

ctx.save();ctx.translate(this.x,this.y);

  if(t>=3)return 4;

function shape(sp,x,y,r,c,fl){
  ctx.fillStyle=fl?'#fff':c;ctx.beginPath();
  if(sp==='circle')ctx.arc(x,y,r,0,7);
  else if(sp==='triangle'){ctx.moveTo(x,y-r);ctx.lineTo(x-r*.9,y+r*.7);ctx.lineTo(x+r*.9,y+r*.7);ctx.closePath();}
  else if(sp==='diamond'){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
  else if(sp==='star'){for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i/10*6.283-1.57;
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();}
  else if(sp==='demon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.8,y-r*.5);ctx.lineTo(x+r*.4,y-r*.1);
    ctx.lineTo(x+r,y+r*.6);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y+r*.6);ctx.lineTo(x-r*.4,y-r*.1);
    ctx.lineTo(x-r*.8,y-r*.5);ctx.closePath();}
  else if(sp==='angel'){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+r,y-r*.3,x+r*.6,y+r*.3);
    ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.4);ctx.lineTo(x-r*.2,y+r);ctx.lineTo(x-r*.6,y+r*.3);
    ctx.quadraticCurveTo(x-r,y-r*.3,x,y-r);}
  else if(sp==='dragon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.7,y-r*.3);ctx.lineTo(x+r,y+r*.3);
    ctx.lineTo(x+r*.4,y+r*.2);ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.3);ctx.lineTo(x-r*.2,y+r);
    ctx.lineTo(x-r*.4,y+r*.2);ctx.lineTo(x-r,y+r*.3);ctx.lineTo(x-r*.7,y-r*.3);ctx.closePath();}
  else if(sp==='skull'){ctx.arc(x,y-r*.1,r*.85,.3,2.84);ctx.lineTo(x+r*.7,y+r*.4);
    ctx.lineTo(x+r*.3,y+r*.5);ctx.lineTo(x+r*.3,y+r*.9);ctx.lineTo(x-r*.3,y+r*.9);
    ctx.lineTo(x-r*.3,y+r*.5);ctx.lineTo(x-r*.7,y+r*.4);ctx.closePath();}
  else if(sp==='wolf'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.8,y-r*.6);ctx.lineTo(x+r*.5,y-r*.2);
    ctx.lineTo(x+r,y+r*.5);ctx.lineTo(x+r*.2,y+r*.8);ctx.lineTo(x,y+r*.4);ctx.lineTo(x-r*.2,y+r*.8);
    ctx.lineTo(x-r,y+r*.5);ctx.lineTo(x-r*.5,y-r*.2);ctx.lineTo(x-r*.8,y-r*.6);ctx.closePath();}
  else if(sp==='winged'){ctx.moveTo(x-r,y-r*.3);ctx.quadraticCurveTo(x,y-r*1.5,x+r,y-r*.3);
    ctx.quadraticCurveTo(x,y,x+r,y+r*.3);ctx.quadraticCurveTo(x,y+r,x-r,y+r*.3);ctx.quadraticCurveTo(x,y,x-r,y-r*.3);}
  else ctx.arc(x,y,r,0,7);
  ctx.fill();ctx.strokeStyle=fl?'#fff':sh(c,-40);ctx.lineWidth=2;ctx.stroke();
}

class Game{
  constructor(){this.state='menu';this.keys={};this.mx=0;this.my=0;
    this.srid=null;this.sch=null;this.sloc=null;this.cnm='';
    this.chrS=0;this.chrScrl=0;this.lvc=[];this.evoShow=null;this.retTo=null;
    this.enemies=[];this.bosses=[];this.proj=[];this.particles=[];this.ftxt=[];
    this.player=null;this.loc=null;
    this.wave=1;this.wt=0;this.st=0;this.bsSpawned=new Set();this.shake=0;
    this.runTime=0;
    this.waveEnemiesToSpawn=0;this.waveEnemiesSpawned=0;
    this.chain={iv:false,ve:false,lu:false};
    this.historyMode=false;this.historyStep=0;
    this.timeSlowTimer=0;this.flash=0;
    this.pendingLv=0;
    this.tutStep=0;this.tutData=null;
    this.finalWave=false;this.finalChainStep=0;this.finalDelay=0;this.victory=false;
    this.cutsceneTimer=0;this.cutsceneData=null;
    this.camX=0;this.camY=0;
    this.last=performance.now();
    this.bind();requestAnimationFrame(t=>this.loop(t));}
  bind(){addEventListener('keydown',e=>this.kd(e));
    addEventListener('keyup',e=>{this.keys[e.key.toLowerCase()]=false;});
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();
      this.mx=(e.clientX-r.left)/r.width*W;this.my=(e.clientY-r.top)/r.height*H;});
    cv.addEventListener('mousedown',e=>{AU.i();AU.music(this.state==='playing'?'combat':'menu');
      this.md(e.button);e.preventDefault();});
    cv.addEventListener('wheel',e=>{this.onWheel(e.deltaY);e.preventDefault();},{passive:false});
    cv.addEventListener('contextmenu',e=>e.preventDefault());}
  onWheel(d){if(this.state==='chronicles')this.chrScrl=Math.max(0,this.chrScrl+d*.5);}
  startHistory(){
    this.historyMode=true;
    this.srid='slime';
    this.sch=RACES.slime.ch[0];
    this.sloc=LOCS[0];
    this.startRun();
    AU.sfx('sel');
  }
  md(b){const mx=this.mx,my=this.my;
    if(this.state==='menu'){
      if(my>=220&&my<=280){this.startTutorial();AU.sfx('sel');return;}
      if(my>=305&&my<=355){this.state='race_select';this.historyMode=false;AU.sfx('sel');return;}
      if(my>=355&&my<=405){this.startHistory();return;}
      if(my>=405&&my<=455){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='menu';AU.sfx('sel');return;}
    }
    else if(this.state==='race_select'){
      const ids=Object.keys(RACES);
      for(let i=0;i<ids.length;i++){const col=i%2,row=~~(i/2);
        const x=60+col*620,y=70+row*90;
        if(mx>=x&&mx<=x+580&&my>=y&&my<=y+85){this.srid=ids[i];this.state='character_select';AU.sfx('sel');return;}}
    }
    else if(this.state==='character_select'){
      const r=RACES[this.srid];
      for(let i=0;i<r.ch.length;i++){const x=80+i*380,y=135;
        if(mx>=x&&mx<=x+350&&my>=y&&my<=y+195){this.sch=r.ch[i];this.state='location_select';AU.sfx('sel');return;}}
      if(mx>=80&&mx<=W-80&&my>=360&&my<=460){this.state='custom_name';this.cnm='';AU.sfx('sel');return;}
    }
    else if(this.state==='custom_name'){
      if(mx>=W/2-100&&mx<=W/2+100&&my>=400&&my<=445){
        if(this.cnm.trim()){this.sch={n:this.cnm.trim(),b:{},sk:'Универсальное Превращение',d:'Свой.'};
          this.state='location_select';AU.sfx('sel');}}
    }
    else if(this.state==='location_select'){
      for(let i=0;i<LOCS.length;i++){const col=i%2,row=~~(i/2);
        const x=60+col*620,y=110+row*125;
        if(mx>=x&&mx<=x+580&&my>=y&&my<=y+110){this.sloc=LOCS[i];this.startRun();AU.sfx('sel');return;}}
    }
    else if(this.state==='level_up'){
      for(let i=0;i<this.lvc.length;i++){const y=150+i*125;
        if(mx>=W/2-360&&mx<=W/2+360&&my>=y&&my<=y+110){this.pick(i);AU.sfx('sel');return;}}
    }
    else if(this.state==='playing'){
      if(this.canSkipWave() && mx>=W-345 && mx<=W-5 && my>=250 && my<=295){
        this.skipWave();
        return;
      }
    }
    else if(this.state==='paused'){
      if(my>=310&&my<=350){this.state='playing';AU.sfx('sel');}
      else if(my>=360&&my<=400){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='paused';AU.sfx('sel');}
      else if(my>=410&&my<=450){this.state='menu';this.player=null;AU.stop();AU.music('menu');}
    }
    else if(this.state==='evolution'){
      this.state='playing';
      if(this.pendingLv>0)this.pendingLv--;
      if(this.pendingLv>0)this.triggerLv();
      AU.sfx('sel');
    }
    else if(this.state==='cutscene'){
      if(this.cutsceneTimer<=3.5){
        const btnX=W-220,btnY=H-70,btnW=200,btnH=50;
        if(mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH){
          this.state='victory';AU.sfx('sel');}
      }
    }
    else if(this.state==='victory'){
      this.state='menu';this.player=null;AU.stop();AU.music('menu');
    }
    else if(this.state==='tutorial'){
      if(this.tutStep===9){SV.d.tutDone=1;SV.save();this.state='menu';AU.stop();AU.music('menu');}
      else if(this.tutStep===1||this.tutStep===2||this.tutStep===3){
        if(this.tutData&&this.tutData.timer>8){this.tutStep++;this.tutData.timer=0;}
      } else {this.tutStep++;if(this.tutData)this.tutData.timer=0;}
    }
    else if(this.state==='game_over'){
      if(my>=440&&my<=490&&mx>=W/2-150&&mx<=W/2){this.startRun();AU.sfx('sel');}
      else if(my>=440&&my<=490&&mx>=W/2&&mx<=W/2+150){this.state='menu';this.player=null;AU.stop();AU.music('menu');}
    }
    else if(this.state==='chronicles'){
      const ss=Object.keys(CHR);
      for(let i=0;i<ss.length;i++){const y=80+i*28;
        if(my>=y-14&&my<=y+6&&mx>=20&&mx<=240){this.chrS=i;this.chrScrl=0;AU.sfx('sel');return;}}
    }}
  kd(e){const k=e.key.toLowerCase();this.keys[k]=true;
    if(e.repeat&&this.state!=='custom_name')return;
    if(this.state==='menu'){
      if(k==='1'){this.state='race_select';this.historyMode=false;AU.sfx('sel');}
      else if(k==='2'){this.startHistory();}
      else if(k==='3'){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='menu';}
      else if(k==='4'||k==='t'){this.startTutorial();}
    }
    else if(this.state==='race_select'){
      const ids=Object.keys(RACES);let idx=-1;
      if(k.length===1){
        const n=parseInt(k);
        if(!isNaN(n))idx=n===0?9:n-1;
        else if(k==='q')idx=10;
        else if(k==='w')idx=11;
        else if(k==='e')idx=12;
      }
      if(idx>=0&&idx<ids.length){this.srid=ids[idx];this.state='character_select';}
      else if(k==='escape')this.state='menu';
    }
    else if(this.state==='character_select'){
      const r=RACES[this.srid];const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=r.ch.length){this.sch=r.ch[n-1];this.state='location_select';}
      else if(k==='c'){this.state='custom_name';this.cnm='';}
      else if(k==='escape')this.state='race_select';
    }
    else if(this.state==='custom_name'){
      if(k==='enter'){if(this.cnm.trim()){this.sch={n:this.cnm.trim(),b:{},sk:'Универсальное Превращение',d:'Свой.'};
        this.state='location_select';}}
      else if(k==='backspace')this.cnm=this.cnm.slice(0,-1);
      else if(k==='escape')this.state='character_select';
      else if(e.key.length===1&&this.cnm.length<20&&/[a-zA-Zа-яА-Я0-9 ]/.test(e.key))this.cnm+=e.key;
    }
    else if(this.state==='location_select'){
      const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=LOCS.length){this.sloc=LOCS[n-1];this.startRun();}
      else if(k==='escape')this.state='character_select';
    }
    else if(this.state==='playing'){
      if(k==='escape')this.state='paused';
      else if(k==='q')this.useSk(0);
      else if(k==='e')this.useSk(1);
      else if(k==='r')this.useSk(2);
      else if(k==='v'&&this.player){this.player.autoPotion=!this.player.autoPotion;
        this.ftxt.push(new FTxt('Авто-зелье: '+(this.player.autoPotion?'ВКЛ':'ВЫКЛ'),
        this.player.x,this.player.y-40,this.player.autoPotion?'#a0ffa0':'#ff8080',1.5,14));}
      else if(k===' '){if(this.player.dodge()){AU.sfx('dodge');
        this.particles.push(...[...Array(8)].map(()=>new Part(this.player.x,this.player.y,'#80ffff')));}}
    }
    else if(this.state==='paused'){
      if(k==='escape'||k==='1')this.state='playing';
      else if(k==='2'){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='paused';}
      else if(k==='3'){this.state='menu';this.player=null;AU.stop();AU.music('menu');}
    }
    else if(this.state==='level_up'){
      const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=this.lvc.length)this.pick(n-1);
    }
    else if(this.state==='evolution'){
      if(k==='enter'||k===' '||k==='escape'){
        this.state='playing';
        if(this.pendingLv>0)this.pendingLv--;
        if(this.pendingLv>0)this.triggerLv();
      }
    }
    else if(this.state==='cutscene'){/* Пропуск только через кнопку — клавиши игнорируются */}
    else if(this.state==='victory'){
      this.state='menu';this.player=null;AU.stop();AU.music('menu');
    }
    else if(this.state==='tutorial'){
      if(k==='escape'){this.state='menu';AU.stop();AU.music('menu');}
      else if(k===' '){
        if(this.tutStep===9){SV.d.tutDone=1;SV.save();this.state='menu';AU.stop();AU.music('menu');}
        else if(this.tutStep===1||this.tutStep===2||this.tutStep===3){
          if(this.tutData&&this.tutData.timer>8){this.tutStep++;this.tutData.timer=0;}
        } else {this.tutStep++;if(this.tutData)this.tutData.timer=0;}
      }
      else if(k==='q')this.useSk(0);
      else if(k==='e')this.useSk(1);
      else if(k==='r')this.useSk(2);
      else if(k==='v'&&this.player){this.player.autoPotion=!this.player.autoPotion;
        this.ftxt.push(new FTxt('Авто-зелье: '+(this.player.autoPotion?'ВКЛ':'ВЫКЛ'),
        this.player.x,this.player.y-40,this.player.autoPotion?'#a0ffa0':'#ff8080',1.5,14));}
    }
    else if(this.state==='chronicles'){
      const ss=Object.keys(CHR);
      if(k==='escape'){if(this.retTo==='paused'){this.state='paused';this.retTo=null;}
        else{this.state='menu';this.retTo=null;}}
      else if(k==='arrowright')this.chrS=(this.chrS+1)%ss.length;
      else if(k==='arrowleft')this.chrS=(this.chrS-1+ss.length)%ss.length;
      else if(k==='arrowdown')this.chrScrl+=40;
      else if(k==='arrowup')this.chrScrl=Math.max(0,this.chrScrl-40);
    }
    else if(this.state==='game_over'){
      if(k==='r')this.startRun();
      else if(k==='m'){this.state='menu';this.player=null;AU.stop();AU.music('menu');}
    }}
  useSk(i){const p=this.player;if(!p)return;const n=p.slots[i];if(!n)return;
    const sk=p.skills[n];if(!sk||sk.cd>0)return;sk.cd=Math.max(1.0,SKILLS[n].cd*(1-p.cdr));
    const t=p.near(this.enemies,this.bosses);
    SKILLS[n].n=n;SKILLS[n].cast(this,p,t);}
  startRun(){this.player=new Player(this.srid,this.sch,this.sloc);
    this.loc=this.sloc;this.enemies=[];this.bosses=[];this.proj=[];this.particles=[];this.ftxt=[];
    this.wave=1;this.wt=0;this.st=0;this.bsSpawned=new Set();this.shake=0;
    this.runTime=0;
    this.waveEnemiesToSpawn=5+this.wave*2;
    this.waveEnemiesSpawned=0;
    this.chain={iv:false,ve:false,lu:false};
    this.historyStep=0;
    this.timeSlowTimer=0;this.flash=0;
    this.pendingLv=0;
    this.finalWave=false;this.finalChainStep=0;this.finalDelay=0;this.victory=false;
    this.cutsceneTimer=0;this.cutsceneData=null;
    this.camX=cl(this.player.x-W/2,0,WW-W);
    this.camY=cl(this.player.y-H/2,0,WH-H);
    this.state='playing';AU.stop();AU.music('combat');}
}

const TUT_VERSION='1.1';
const TUT_CHANGELOG=[
  '1.0 — резонанс, артефакты, CDR, неэволюционирующие 4/7 осколков',
  '1.1 — гнев босса, элитные враги, хаос-мобы'
];

Game.prototype.canSkipWave=function(){
  if(this.state!=='playing')return false;
  if(this.finalWave)return false;
  if(this.bosses.length>0)return false;
  const nw=this.wave+1;
  if(nw>=50)return false;
  if(nw%5===0&&nw>=10)return false;
  return true;
};

Game.prototype.skipWave=function(){
  const oldWave=this.wave;
  this.wave++;
  const add=5+this.wave*2;
  this.waveEnemiesToSpawn+=add;
  this.ftxt.push(new FTxt('▶ Волна '+this.wave+' (пропуск '+oldWave+')',this.player.x,this.player.y-120,'#80ff80',2.5,22));
  AU.sfx('sel');
  this.shake=5;
};

Game.prototype.startTutorial=function(){
  this.srid='slime';
  this.sch={n:'Ученик',b:{},sk:'Универсальное Превращение',d:'Тренировочный персонаж'};
  this.sloc=LOCS[0];
  this.player=new Player('slime',this.sch,this.sloc);
  this.loc=this.sloc;
  this.enemies=[];this.bosses=[];this.proj=[];this.particles=[];this.ftxt=[];
  this.wave=1;this.wt=0;this.st=999;this.shake=0;
  this.waveEnemiesToSpawn=0;this.waveEnemiesSpawned=0;
  this.bsSpawned=new Set();this.chain={iv:false,ve:false,lu:false};
  this.timeSlowTimer=0;this.flash=0;this.pendingLv=0;
  this.finalWave=false;this.finalChainStep=0;this.finalDelay=0;this.victory=false;
  this.cutsceneTimer=0;this.cutsceneData=null;
  this.runTime=0;
  this.camX=cl(this.player.x-W/2,0,WW-W);
  this.camY=cl(this.player.y-H/2,0,WH-H);
  this.tutStep=0;
  this.tutData={startX:this.player.x,startY:this.player.y,dummy:null,dummySpawned:false,timer:0};
  this.state='tutorial';
  AU.stop();AU.music('menu');
};

Game.prototype.updTutorial=function(dt){
  if(!this.tutData)return;
  const p=this.player;if(!p)return;
  this.camX=cl(p.x-W/2,0,WW-W);
  this.camY=cl(p.y-H/2,0,WH-H);
  this.tutData.timer+=dt;
  p.update(dt,this.keys,this);
  if(p.hp<=0)p.hp=p.maxHp;
  for(const e of this.enemies)e.update(dt,p,this);
  for(let i=this.proj.length-1;i>=0;i--){
    const pr=this.proj[i];pr.update(dt);
    if(!pr.alive){this.proj.splice(i,1);continue;}
    if(pr.fr){
      let cn=false;
      for(const e of this.enemies){
        if(!e.alive)continue;
        if(d2(pr.x,pr.y,e.x,e.y)<(pr.r+e.z)**2){
          e.dmg(pr.dmg,pr.src);
          for(let j=0;j<3;j++)this.particles.push(new Part(e.x,e.y,pr.c));
          if(pr.pierce>0)pr.pierce--;else{cn=true;break;}
        }
      }
      if(cn)this.proj.splice(i,1);
    }
  }
  const ne=[];
  for(const e of this.enemies){
    if(!e.alive){p.kills++;p.gainXp(e.xp);for(let j=0;j<6;j++)this.particles.push(new Part(e.x,e.y,e.c));}
    else ne.push(e);
  }
  this.enemies=ne;
  for(let i=this.particles.length-1;i>=0;i--){const pt=this.particles[i];pt.update(dt);if(pt.l<=0)this.particles.splice(i,1);}
  for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}
  this.updTutStep(dt);
  this.shake=Math.max(0,this.shake-dt*30);
};

Game.prototype.updTutStep=function(dt){
  const p=this.player,td=this.tutData;
  if(this.tutStep===1){
    const dist=Math.sqrt((p.x-td.startX)**2+(p.y-td.startY)**2);
    if(dist>250){this.tutStep=2;td.timer=0;}
  }
  if(this.tutStep===2){
    if(!td.dummySpawned){
      const ex=cl(p.x+250,50,WW-50),ey=cl(p.y,50,WH-50);
      const dummy=new Enemy(ex,ey,{n:'Манекен',h:60,a:1,s:0.3,x:10,c:'#806040',z:18,l:1,sh:'circle'},this.loc.m);
      td.dummy=dummy;this.enemies.push(dummy);td.dummySpawned=true;
    } else if(!td.dummy||!td.dummy.alive){this.tutStep=3;td.timer=0;}
  }
  if(this.tutStep===3){
    for(const s in p.skills){
      if(p.skills[s].cd>0){this.tutStep=4;td.timer=0;return;}
    }
    if(td.timer>15){this.tutStep=4;td.timer=0;}
  }
};

Game.prototype.evolveSkill=function(p,name){
  const evo=SKILL_EVO[name];if(!evo)return name;
  const next=evo.next;
  delete p.skills[name];
  p.skills[next]={tier:(evo.startTier||0),cd:0,resCd:0};
  for(let i=0;i<3;i++)if(p.slots[i]===name)p.slots[i]=next;
  this.ftxt.push(new FTxt('ЭВОЛЮЦИЯ: '+name+' → '+next,p.x,p.y-50,evo.color,3,22));
  AU.sfx('sec');
  return next;
};

Game.prototype.triggerLv=function(){
  const p=this.player,r=RACES[p.rid];
  const ne=r.evo[p.es+1];
  if(ne&&p.lv>=ne.lv){this.doEvo(ne);return;}
  this.state='level_up';
  const pool=[
    {n:'+25 HP',k:'hp'},{n:'+10 MP',k:'mp'},{n:'+3 ATK',k:'atk'},
    {n:'+2 DEF',k:'def'},{n:'+0.3 SPD',k:'spd'},{n:'+3 MAG',k:'mag'},
    {n:'+2 RES',k:'res'},{n:'+3 LCK',k:'lck'},{n:'+2% крит',k:'crit'},
    {n:'+1 пробитие',k:'pierce'},{n:'+15% радиус AoE',k:'aoe'}
  ];
  if(p.cdr<0.75)pool.push({n:'-5% перезарядка',k:'cdr'});
  if(p.hpRegenPct<0.05)pool.push({n:'+0.5% HP-реген',k:'hpreg'});
  const own=Object.keys(p.skills);
  if(own.length){
    const evoSkills=own.filter(sk=>SKILL_EVO[sk]&&SKILL_EVO[sk].next);
    const affordable=evoSkills.filter(sk=>p.frag>=evoFragCost(sk));
    if(affordable.length>0){
      const sk=pick(affordable);const evo=SKILL_EVO[sk];const cost=evoFragCost(sk);
      const costStr=cost>0?' ('+cost+' оск.)':'';
      pool.unshift({n:sk+' → '+evo.next+costStr,k:'evoSk',sk,cost});
    }
    const nonEvo=own.filter(sk=>!SKILL_EVO[sk]);
    if(nonEvo.length){
      const affordableUp=nonEvo.filter(sk=>{
        const ct=p.skills[sk].tier;
        if(ct>=TI.length-1)return false;
        const cost=ct>=3?7:(ct>=2?4:0);
        return p.frag>=cost;
      });
      if(affordableUp.length>0){
        const sk=pick(affordableUp);const ct=p.skills[sk].tier;
        const cost=ct>=3?7:(ct>=2?4:0);
        const newDn=skillDisplayName(sk,ct+1);
        const costStr=cost>0?' ('+cost+' оск.)':'';
        pool.push({n:skillDisplayName(sk,ct)+' → '+newDn+' ('+TI[ct+1]+')'+costStr,k:'skUp',sk,cost});
      }
    }
  }
  if(Object.keys(p.skills).length<3){
    const av=Object.keys(SKILLS).filter(s=>!p.skills[s]&&!Object.values(SKILL_EVO).some(e=>e.next===s)&&!SKILLS[s].ult);
    if(av.length){const ns=pick(av);pool.push({n:'Навык: '+ns,k:'newSk',sk:ns});}
  }
  const avSp=SPELLS.filter(s=>!p.spells.find(x=>x.def.n===s.n));
  if(avSp.length){const ns=pick(avSp);pool.push({n:'Магия: '+ns.n,k:'newSp',sp:ns});}
  const avA=ARTS.filter(a=>!p.arts.find(x=>x.n===a.n));
  if(avA.length){const a=pick(avA);pool.push({n:'Артефакт: '+a.n,k:'art',a});}
  const wi=WEAPONS.findIndex(w=>w.n===p.wep.n);
  if(wi>=0&&wi<WEAPONS.length-1)pool.push({n:'Оружие: '+WEAPONS[wi+1].n,k:'wep',w:WEAPONS[wi+1]});
  for(let i=pool.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const evoIdx=pool.findIndex(x=>x.k==='evoSk');
  if(evoIdx>1){[pool[1],pool[evoIdx]]=[pool[evoIdx],pool[1]];}
  this.lvc=pool.slice(0,Math.min(3,pool.length));
  AU.sfx('lvl');
};

function optionInfo(c,p){
  switch(c.k){
    case 'hp':return {desc:'Здоровье',info:'Макс. HP: '+p.maxHp+' → '+(p.maxHp+25),color:'#ff6060'};
    case 'mp':return {desc:'Мана',info:'Макс. MP: '+p.maxMp+' → '+(p.maxMp+10),color:'#4060e0'};
    case 'atk':return {desc:'Атака',info:'ATK: '+p.atk+' → '+(p.atk+3),color:'#ff8080'};
    case 'def':return {desc:'Защита',info:'DEF: '+p.def+' → '+(p.def+2),color:'#60a0ff'};
    case 'spd':return {desc:'Скорость',info:'SPD: '+p.spd.toFixed(1)+' → '+(p.spd+0.3).toFixed(1),color:'#80ff80'};
    case 'mag':return {desc:'Магия',info:'MAG: '+p.mag+' → '+(p.mag+3),color:'#c060c0'};
    case 'res':return {desc:'Сопротивление',info:'RES: '+p.res+' → '+(p.res+2),color:'#a0c0ff'};
    case 'lck':return {desc:'Удача',info:'LCK: '+p.lck+' → '+(p.lck+3),color:'#ffcc44'};
    case 'crit':return {desc:'Крит',info:'Шанс крита: '+p.crit+'% → '+(p.crit+2)+'%',color:'#ffaa44'};
    case 'pierce':return {desc:'Пробитие',info:'Pierce: +'+p.pierceBonus+' → +'+(p.pierceBonus+1),color:'#a0c0ff'};
    case 'aoe':return {desc:'Область',info:'AoE: ×'+p.aoeMult.toFixed(2)+' → ×'+(p.aoeMult+0.15).toFixed(2),color:'#80e0ff'};
    case 'cdr':{const nc=Math.min(0.75,p.cdr+0.05);return {desc:'Снижение перезарядки',info:'CDR: '+(p.cdr*100).toFixed(0)+'% → '+(nc*100).toFixed(0)+'%'+(nc>=0.75?' (кап)':''),color:'#a0e0ff'};}
    case 'hpreg':{const nr=Math.min(0.05,p.hpRegenPct+0.005);return {desc:'Регенерация HP',info:'Реген HP: '+(p.hpRegenPct*100).toFixed(1)+'%/с → '+(nr*100).toFixed(1)+'%/с'+(nr>=0.05?' (кап)':''),color:'#80ff80'};}
    case 'skUp':{const sk=SKILLS[c.sk];const nt=p.skills[c.sk].tier+1;const cost=c.cost||0;return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[nt].toFixed(1)+' · Тир: '+TI[nt]+(cost>0?' · '+cost+' оск.':''),color:TC[nt]};}
    case 'evoSk':{const evo=SKILL_EVO[c.sk];const nsk=SKILLS[evo.next];const nt=evo.startTier||0;const t=evoFragCost(c.sk);return {desc:nsk?nsk.desc:'',info:'ЭВОЛЮЦИЯ! → '+evo.next+' · Тир '+TI[nt]+' · Урон ×'+TM[nt].toFixed(1)+(t>0?' · '+t+' оск.':''),color:TC[nt]};}
    case 'newSk':{const sk=SKILLS[c.sk];return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[0].toFixed(1)+' · Тир: '+TI[0],color:TC[0]};}
    case 'newSp':{const sp=c.sp;return {desc:'Новое заклинание',info:sp.d+' урона · '+sp.mp+' MP · КД '+sp.cd+'с · '+TI[sp.t],color:sp.c};}
    case 'art':return {desc:c.a.d,info:'Артефакт — пассивный бонус',color:'#ffcc44'};
    case 'wep':return {desc:c.w.d,info:'ATK +'+c.w.a+' · MAG +'+c.w.m,color:'#a0c0ff'};
  }
  return {desc:'',info:'',color:'#fff'};
}

Game.prototype.pick=function(i){
  const c=this.lvc[i];
  if(!c){
    this.state='playing';
    if(this.pendingLv>0)this.pendingLv--;
    if(this.pendingLv>0)this.triggerLv();
    return;
  }
  const p=this.player;
  switch(c.k){
    case 'hp':p.maxHp+=25;p.hp+=25;break;
    case 'mp':p.maxMp+=10;p.mp+=10;break;
    case 'atk':p.atk+=3;break;
    case 'def':p.def+=2;break;
    case 'spd':p.spd+=.3;break;
    case 'mag':p.mag+=3;break;
    case 'res':p.res+=2;break;
    case 'lck':p.lck+=3;break;
    case 'crit':p.crit+=2;break;
    case 'pierce':p.pierceBonus+=1;break;
    case 'aoe':p.aoeMult+=0.15;break;
    case 'cdr':p.cdr=Math.min(0.75,p.cdr+0.05);break;
    case 'hpreg':p.hpRegenPct=Math.min(0.05,p.hpRegenPct+0.005);break;
    case 'skUp':
      if(c.cost&&c.cost>0)p.frag-=c.cost;
      p.skills[c.sk].tier++;
      this.ftxt.push(new FTxt(skillDisplayName(c.sk,p.skills[c.sk].tier)+' ('+TI[p.skills[c.sk].tier]+')',p.x,p.y-40,TC[p.skills[c.sk].tier],2,18));
      break;
    case 'evoSk':
      if(c.cost&&c.cost>0)p.frag-=c.cost;
      this.evolveSkill(p,c.sk);
      break;
    case 'newSk':if(c.sk)p.addSk(c.sk);break;
    case 'newSp':p.spells.push({def:c.sp,cd:0});break;
    case 'art':p.arts.push(c.a);c.a.e(p);break;
    case 'wep':
      p.mag-=(p.wep.m||0);p.wep=c.w;p.mag+=(p.wep.m||0);break;
  }
  this.state='playing';
  if(this.pendingLv>0)this.pendingLv--;
  if(this.pendingLv>0)this.triggerLv();
};

Game.prototype.doEvo=function(e){
  const p=this.player;p.es++;
  if(e.b){p.maxHp+=e.b.hp||0;p.hp=p.maxHp;
    p.maxMp+=e.b.mp||0;p.mp=p.maxMp;
    p.atk+=e.b.atk||0;p.def+=e.b.def||0;
    p.spd+=e.b.spd||0;p.mag+=e.b.mag||0;}
  if(e.c)p.c=e.c;p.rn=e.n;
  this.evoShow=e;this.state='evolution';
  this.flash=1;this.timeSlowTimer=3;
  for(let i=0;i<60;i++)this.particles.push(new Part(p.x,p.y,e.c||p.c));
  AU.sfx('evo');
};

Game.prototype.loop=function(t){
  const dt=Math.min(.05,(t-this.last)/1000);this.last=t;
  this.upd(dt);this.draw();
  requestAnimationFrame(tt=>this.loop(tt));
};

Game.prototype.spawnEnemy=function(){
  if(this.enemies.length>=120)return;
  const elites=availableElites(this);
  const eliteChance=elites.length>0 ? Math.min(0.25,0.05+this.bsSpawned.size*0.025) : 0;
  const isElite=elites.length>0 && Math.random()<eliteChance;
  let tp;
  if(isElite){
    tp=pick(elites);
  } else {
    const mx=Math.min(this.wave+1,22);
    const pool=ET.filter(e=>e.l<=mx);
    if(!pool.length)return;
    tp=pick(pool);
  }
  const cx=this.camX+W/2, cy=this.camY+H/2;
  const angle=Math.random()*6.283;
  const dist=Math.max(W,H)*0.7;
  let x=cx+Math.cos(angle)*dist;
  let y=cy+Math.sin(angle)*dist;
  x=cl(x,20,WW-20);y=cl(y,20,WH-20);
  const e=new Enemy(x,y,tp,this.loc.m);
  scaleEnemyToWave(e,this.wave);
  if(isElite){
    e.elite=true;
    e.maxHp=~~(e.maxHp*1.4);e.hp=e.maxHp;
    e.atk=~~(e.atk*1.25);
    e.xp=~~(e.xp*2);
    e.z*=1.15;
  }
  if(this.loc.m.chaos && Math.random()<0.25) makeChaosEnemy(e);
  this.enemies.push(e);
};

Game.prototype.nextBossInQueue=function(){
  const keys=Object.keys(BT).sort((a,b)=>BT[a].w-BT[b].w);
  for(const k of keys){
    const b=BT[k];
    if(b.sec)continue;
    if(b.chaos&&!this.loc.m.chaos)continue;
    if(b.loc&&b.loc!==this.loc.n)continue;
    if(!this.bsSpawned.has(k)&&this.wave>=b.w)return k;
    if(!this.bsSpawned.has(k)&&this.wave<b.w)return null;
  }
  return null;
};

Game.prototype.spawnBoss=function(){
  if(this.bosses.length>0)return;
  const name=this.nextBossInQueue();
  if(!name)return;
  this.bsSpawned.add(name);
  const t=BT[name];
  const bx=cl(this.player.x,200,WW-200),by=Math.max(80,this.player.y-350);
  if(t.pair){
    const [n1,n2]=t.pair;
    const t1=BT[n1]||{h:~~(t.h*0.45),a:~~(t.a*0.9),s:t.s,c:t.c,z:t.z,at:t.at,sh:t.sh,sup:t.sup};
    const t2=BT[n2]||{h:~~(t.h*0.55),a:~~(t.a*1.1),s:t.s,c:'#ff6020',z:t.z,at:t.at,sh:t.sh,sup:t.sup};
    const b1=new Boss(bx-80,by,{...t1,n:n1},this.loc.m);
    const b2=new Boss(bx+80,by,{...t2,n:n2},this.loc.m);
    b1.spawnWave=this.runTime;b2.spawnWave=this.runTime;
    this.bosses.push(b1);this.bosses.push(b2);
    this.ftxt.push(new FTxt(n1+' и '+n2+'!',this.player.x,this.player.y-250,'#ff4040',3,26));
  } else {
    const nb=new Boss(bx,by,{...t,n:name},this.loc.m);
    nb.spawnWave=this.runTime;
    this.bosses.push(nb);
    this.ftxt.push(new FTxt(name+' появился!',this.player.x,this.player.y-250,'#ff4040',3,24));
  }
  AU.sfx('boss');this.shake=10;
  AU.music(t.sup?'dragon':'boss');
  if(this.historyMode&&this.historyStep<LOCS.length-1){
    this.historyStep++;
    this.loc=LOCS[this.historyStep];
    this.ftxt.push(new FTxt('Новая локация: '+this.loc.n,this.player.x,this.player.y-200,'#ffcc44',3,22));
  }
};

Game.prototype.checkSecretChain=function(){
  if(this.wave>=50&&!this.finalWave&&!this.chain.iv&&this.bosses.length===0){
    this.finalWave=true;
    this.finalChainStep=1;
    this.finalDelay=0;
    this.enemies=[];
    this.waveEnemiesToSpawn=0;
    this.waveEnemiesSpawned=0;
    this.shake=20;
    const t=BT['Иварадж'];
    const bx=cl(this.player.x,200,WW-200),by=Math.max(80,this.player.y-350);
    const ib=new Boss(bx,by,{...t,n:'Иварадж'},this.loc.m);
    ib.spawnWave=this.runTime;
    this.bosses.push(ib);
    this.ftxt.push(new FTxt('⚔ ФИНАЛЬНАЯ ВОЛНА ⚔',this.player.x,this.player.y-300,'#ff4040',4,32));
    this.ftxt.push(new FTxt('ИВАРАДЖ ПРОБУДИЛСЯ!',this.player.x,this.player.y-250,'#ff40a0',4,26));
    AU.sfx('sec');AU.music('final');
  }
  if(this.finalWave&&this.finalChainStep===1&&this.bosses.length===0&&this.finalDelay<=0){
    this.finalChainStep=2;
    this.chain.ve=true;
    const t=BT['Веланава'];
    const bx=cl(this.player.x,200,WW-200),by=Math.max(80,this.player.y-350);
    const vb=new Boss(bx,by,{...t,n:'Веланава'},this.loc.m);
    vb.spawnWave=this.runTime;
    this.bosses.push(vb);
    this.ftxt.push(new FTxt('ВЕЛАНАВА, БОГ-СОЗДАТЕЛЬ, ЯВИЛСЯ!',this.player.x,this.player.y-250,'#f0e090',4,28));
    AU.sfx('sec');AU.music('final');
    this.shake=15;
  }
};

Game.prototype.upd=function(dt){
  if(this.flash>0)this.flash=Math.max(0,this.flash-dt*1.5);
  if(this.timeSlowTimer>0)this.timeSlowTimer=Math.max(0,this.timeSlowTimer-dt);
  if(this.state==='tutorial'){this.updTutorial(dt);return;}
  if(this.state==='cutscene'){this.cutsceneTimer-=dt;if(this.cutsceneTimer<=0)this.state='victory';return;}
  if(this.state!=='playing')return;
  this.runTime+=dt;
  const p=this.player;if(!p)return;
  if(this.finalDelay>0)this.finalDelay=Math.max(0,this.finalDelay-dt);
  this.camX=cl(p.x-W/2,0,WW-W);
  this.camY=cl(p.y-H/2,0,WH-H);
  const ts=this.timeSlowTimer>0?0.35:1;
  const edt=dt*ts;
  p.update(dt,this.keys,this);
  for(const e of this.enemies)e.update(edt,p,this);
  for(const b of this.bosses)b.update(edt,p,this);
  for(let i=this.proj.length-1;i>=0;i--){
    const pr=this.proj[i];
    pr.update(pr.fr?dt:edt);
    if(!pr.alive){this.proj.splice(i,1);continue;}
    if(pr.fr){
      let cn=false;
      const doExplode=()=>{
        if(pr.explR<=0||pr.explDmg<=0)return;
        const R2=pr.explR*pr.explR;
        for(const e2 of this.enemies){
          if(!e2.alive||pr.hitIds.has(e2))continue;
          if(d2(pr.x,pr.y,e2.x,e2.y)<R2){e2.dmg(pr.explDmg,pr.src);pr.hitIds.add(e2);}
        }
        for(const b2 of this.bosses){
          if(!b2.alive||pr.hitIds.has(b2))continue;
          if(d2(pr.x,pr.y,b2.x,b2.y)<R2){b2.dmg(pr.explDmg,pr.src);pr.hitIds.add(b2);}
        }
        for(let j=0;j<10;j++){const a=Math.random()*6.283,rr=Math.random()*pr.explR;
          this.particles.push(new Part(pr.x+Math.cos(a)*rr,pr.y+Math.sin(a)*rr,pr.c));}
      };
      for(const e of this.enemies){
        if(!e.alive||pr.hitIds.has(e))continue;
        if(d2(pr.x,pr.y,e.x,e.y)<(pr.r+e.z)**2){
          const isImp=e.t.n&&/Имп\.|Инквизит|Паладин|Элит\./.test(e.t.n);
          const dmgToEnemy=isImp?pr.dmg*(1+(p.imp||0)):pr.dmg;
          e.dmg(dmgToEnemy,pr.src);pr.hitIds.add(e);
          for(let j=0;j<3;j++)this.particles.push(new Part(e.x,e.y,pr.c));
          if(p.buffs.vamp>0||p.vamp>0)p.heal(pr.dmg*.05);
          doExplode();
          if(pr.pierce>0)pr.pierce--;else{cn=true;break;}
        }
      }
      if(!cn)for(const b of this.bosses){
        if(!b.alive||pr.hitIds.has(b))continue;
        if(d2(pr.x,pr.y,b.x,b.y)<(pr.r+b.z)**2){
          const dmgToBoss=pr.dmg*(1+(p.apen||0));
          b.dmg(dmgToBoss,pr.src);pr.hitIds.add(b);
          for(let j=0;j<3;j++)this.particles.push(new Part(b.x,b.y,pr.c));
          if(p.buffs.vamp>0||p.vamp>0)p.heal(pr.dmg*.05);
          doExplode();cn=true;break;
        }
      }
      if(cn)this.proj.splice(i,1);
    } else {
      if(d2(pr.x,pr.y,p.x,p.y)<(pr.r+p.z)**2){
        const dmgIn=pr.dmg*(1-Math.min(0.5,p.mres||0));
        p.hurt(dmgIn);
        for(let j=0;j<5;j++)this.particles.push(new Part(p.x,p.y,'#ff6060'));
        this.shake=4;this.proj.splice(i,1);
      }
    }
  }
  const ne=[];
  for(const e of this.enemies){
    if(!e.alive){
      p.kills++;p.gold++;
      if(e.sp==='explode'&&e.elite&&!e._exploded){
        e._exploded=true;
        const boomDmg=e.atk*2;
        for(const e2 of this.enemies)if(e2.alive&&e2!==e&&d2(e.x,e.y,e2.x,e2.y)<150*150)e2.dmg(boomDmg,'normal');
        if(d2(e.x,e.y,p.x,p.y)<150*150)p.hurt(boomDmg);
        for(let j=0;j<20;j++)this.particles.push(new Part(e.x,e.y,'#ff6020'));
        this.shake=6;
      }
      const fragChance=e.elite?(e.chaos?0.03:0.015):(e.chaos?0.01:0.005);
      if(Math.random()<fragChance){
        p.frag++;
        this.ftxt.push(new FTxt('+1 осколок',e.x,e.y-20,'#ffcc44',1.5,14));
        for(let j=0;j<8;j++)this.particles.push(new Part(e.x,e.y,'#ffcc44'));
      }
      if(p.rid==='slime'){p.heal(5);p.mp=Math.min(p.maxMp,p.mp+5);}
      const xpLabel=e.elite?(e.chaos?'★ХАОС★ ':'★ЭЛИТА★ '):(e.chaos?'ХАОС ':'+');
      const xpColor=e.elite?'#ffcc44':(e.chaos?'#c060ff':'#ffdd44');
      this.ftxt.push(new FTxt(xpLabel+~~e.xp+' XP',e.x,e.y,xpColor));
      const nLv=p.gainXp(e.xp);
      if(nLv>0){this.pendingLv+=nLv;if(this.state!=='level_up')this.triggerLv();}
      for(let j=0;j<6;j++)this.particles.push(new Part(e.x,e.y,e.c));
    } else ne.push(e);
  }
  this.enemies=ne;
  const nb=[];const toAdd=[];
  for(const b of this.bosses){
    if(b.bn==='Веланава'&&this.finalChainStep===2&&!this.chain.lu&&b.alive&&b.hp<b.maxHp*0.1){
      this.chain.lu=true;this.finalChainStep=3;b.alive=false;
      this.ftxt.push(new FTxt('ИВАРАДЖ ПОГЛОЩАЕТ ВЕЛАНАВУ!',p.x,p.y-300,'#ff40a0',4,28));
      AU.sfx('sec');
      const lt=BT['Лувельгер'];
      const lbx=cl(p.x,200,WW-200),lby=Math.max(80,p.y-350);
      const lub=new Boss(lbx,lby,{...lt,n:'Лувельгер'},this.loc.m);
      lub.spawnWave=this.runTime;
      toAdd.push(lub);
      AU.music('final');this.shake=25;continue;
    }
    if(!b.alive){
      p.kills++;p.gold+=50;p.frag+=b.td.fr||2;
      this.ftxt.push(new FTxt(b.bn+' побеждён! +'+(b.td.fr||2)+' оск.',b.x,b.y,'#ffcc44',2.5,20));
      const bossXp=Math.max(1,xpForLevels(p,2)-1);
      this.ftxt.push(new FTxt('+'+~~bossXp+' XP (2 ур. −1)',b.x,b.y-20,'#ffdd44',2,16));
      const nLv=p.gainXp(bossXp);
      if(nLv>0){this.pendingLv+=nLv;if(this.state!=='level_up')this.triggerLv();}
      for(let j=0;j<50;j++)this.particles.push(new Part(b.x,b.y,b.c));
      SV.unlock('boss_'+b.bn);
      if(b.bn==='Иварадж'){
        this.chain.iv=true;this.finalDelay=2;
        this.ftxt.push(new FTxt('⚡ ИВАРАДЖ ПАЛ...',p.x,p.y-250,'#ff4040',3,24));
        AU.music('combat');
      }
      if(b.bn==='Веланава')this.chain.ve=true;
      if(b.bn==='Лувельгер'){
        this.finalWave=false;this.finalChainStep=4;this.victory=true;
        SV.d.secWins=(SV.d.secWins||0)+1;SV.save();SV.unlock('true_ending');
        AU.stop();
        this.cutsceneTimer=5;
        this.cutsceneData={x:b.x,y:b.y,color:b.c};
        this.enemies=[];this.proj=[];this.ftxt=[];
        this.state='cutscene';
      }
    } else nb.push(b);
  }
  this.bosses=nb;
  for(const x of toAdd)this.bosses.push(x);
  for(let i=this.particles.length-1;i>=0;i--){const pt=this.particles[i];pt.update(dt);if(pt.l<=0)this.particles.splice(i,1);}
  for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}
  this.st-=dt;this.wt+=dt;
  if(this.st<=0 && this.waveEnemiesToSpawn>0 && this.bosses.length===0 && !this.finalWave){
    this.st=Math.max(.3,1.2-this.wave*.035);
    this.spawnEnemy();this.waveEnemiesToSpawn--;this.waveEnemiesSpawned++;
  }
  if(this.bosses.length===0)this.spawnBoss();
  if(this.state==='playing' && this.waveEnemiesToSpawn===0 && this.enemies.length===0 && this.bosses.length===0 && !this.finalWave){
    this.wave++;
    this.waveEnemiesToSpawn=5+this.wave*2;
    this.waveEnemiesSpawned=0;this.wt=0;
    this.ftxt.push(new FTxt('Волна '+this.wave,p.x,p.y-150,'#fff',2,26));
    if(this.wave%5===0)AU.sfx('boss');
  }
  this.checkSecretChain();
  this.shake=Math.max(0,this.shake-dt*30);
  if(p.hp<=0){
    SV.upd({wave:this.wave,level:p.lv,kills:p.kills,gold:p.gold});
    this.state='game_over';AU.stop();
  }
};

Game.prototype.draw=function(){
  if(this.state==='menu')return this.rMenu();
  if(this.state==='race_select')return this.rRace();
  if(this.state==='character_select')return this.rChar();
  if(this.state==='custom_name')return this.rCnm();
  if(this.state==='location_select')return this.rLoc();
  if(this.state==='chronicles')return this.rChr();
  if(this.state==='tutorial')return this.rTutorial();
  if(this.state==='cutscene')return this.rCutscene();
  if(this.state==='victory')return this.rVictory();
  this.rGame();
  if(this.state==='paused')this.rPause();
  if(this.state==='level_up')this.rLv();
  if(this.state==='evolution')this.rEvo();
  if(this.state==='game_over')this.rGO();
};

Game.prototype.rGame=function(){
  this.bg(this.loc?this.loc.bg:'#0a0a12');
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sh(this.loc?this.loc.bg:'#0a0a12',20));
  g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  const shX=this.shake>0?rnd(-this.shake,this.shake):0;
  const shY=this.shake>0?rnd(-this.shake,this.shake):0;
  ctx.translate(-this.camX+shX,-this.camY+shY);
  ctx.strokeStyle='rgba(80,200,220,.06)';ctx.lineWidth=1;
  const gx0=Math.floor(this.camX/80)*80;
  const gy0=Math.floor(this.camY/80)*80;
  for(let gx=gx0;gx<=this.camX+W;gx+=80){
    ctx.beginPath();ctx.moveTo(gx+.5,this.camY);ctx.lineTo(gx+.5,this.camY+H);ctx.stroke();
  }
  for(let gy=gy0;gy<=this.camY+H;gy+=80){
    ctx.beginPath();ctx.moveTo(this.camX,gy+.5);ctx.lineTo(this.camX+W,gy+.5);ctx.stroke();
  }
  for(const e of this.enemies){
    if(e.x<this.camX-80||e.x>this.camX+W+80||e.y<this.camY-80||e.y>this.camY+H+80)continue;
    e.draw();
  }
  for(const b of this.bosses)b.draw();
  for(const pr of this.proj)pr.draw();
  for(const pt of this.particles)pt.draw();
  if(this.player)this.player.draw();
  for(const f of this.ftxt)f.draw();
  ctx.restore();
  if(this.player)this.rHUD();
  if(this.timeSlowTimer>0){
    ctx.fillStyle='rgba(80,160,255,'+(this.timeSlowTimer*0.06)+')';
    ctx.fillRect(0,0,W,H);
    tx('◈ ЗАМЕДЛЕНИЕ ВРЕМЕНИ ◈',W/2,40,{size:16,color:'#a0d0ff',align:'center',glow:'#a0d0ff'});
  }
  if(this.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+this.flash+')';
    ctx.fillRect(0,0,W,H);
  }
};

  txClip('Арт: '+p.arts.length+'  Pierce +'+p.pierceBonus+'  AoE ×'+p.aoeMult.toFixed(2)+'  CDR '+(p.cdr*100).toFixed(0)+'%',20,214,320,{size:10,color:'#ffcc44'});
  tx('Высший/Божеств.: '+(p.hasSup()?'ДА':'нет'),20,232,{size:10,color:p.hasSup()?'#ffcc44':'#606878'});
  txClip('◈ Резонанс: '+p.resonanceCount+' (+'+(p.resonanceCount*3)+'% урона)',20,250,320,{size:10,color:p.resonanceCount>0?'#a0c0ff':'#606878'});

  const rx=W-350;

    tx(this.finalChainStep+'/3 — '+stepNames[this.finalChainStep],rx+15,50,{size:12,color:stepColors[this.finalChainStep]});
    tx('⏱ '+fmtTime(this.runTime),rx+325,32,{size:11,color:'#80c0ff',align:'right'});
  } else {
    tx('Волна '+this.wave,rx+15,32,{size:17,weight:'bold',color:'#e6e6f0'});
    tx('⏱ '+fmtTime(this.runTime),rx+325,32,{size:12,color:'#80c0ff',align:'right'});
  }
  tx('Врагов '+this.enemies.length+' Боссов '+this.bosses.length,rx+15,this.finalWave?66:54,{size:11,color:'#a0a8b8'});
  const wStr=1+0.01*(this.wave-1),wXp=1+0.10*(this.wave-1);
  tx('Враги: HP/ATK ×'+wStr.toFixed(2)+'  XP ×'+wXp.toFixed(2),rx+15,this.finalWave?79:70,{size:10,color:'#ffcc44'});
  tx('Спавн '+this.waveEnemiesSpawned+'/'+(this.waveEnemiesSpawned+this.waveEnemiesToSpawn),rx+15,this.finalWave?92:83,{size:10,color:'#a0a8b8'});
  tx('Навыки (Q/E/R):',rx+15,this.finalWave?109:100,{size:12,color:'#ffcc44'});
  for(let i=0;i<3;i++){
    const n=p.slots[i];const sx=rx+15+i*105,sy=this.finalWave?113:104;
    ctx.fillStyle='rgba(30,35,55,.9)';ctx.fillRect(sx,sy,100,55);
    ctx.strokeStyle=n?'#50c8dc':'#333';ctx.lineWidth=2;ctx.strokeRect(sx,sy,100,55);
    tx(['Q','E','R'][i],sx+6,sy+16,{size:12,weight:'bold',color:'#ffcc44'});
    if(n){
      const sk=p.skills[n];const evo=SKILL_EVO[n];const col=evo?evo.color:'#fff';
      const dn=n+(SKILL_EVO[n]?'':(TIER_MARK[sk.tier]||''));

      txClip(TI[sk.tier],sx+6,sy+48,90,{size:9,color:TC[sk.tier]});
      if(sk.cd>0){
        ctx.fillStyle='rgba(0,0,0,.6)';
        const hh=Math.min(55,sk.cd/SKILLS[n].cd*55);
        ctx.fillRect(sx,sy+55-hh,100,hh);
        tx(sk.cd.toFixed(1),sx+50,sy+30,{size:13,weight:'bold',color:'#fff',align:'center'});
      }
    }
  }
  const spY=this.finalWave?184:175;
  const totalSpells=p.spells.length;
  txClip('Магия ('+totalSpells+'):',rx+15,spY,320,{size:12,color:'#ffcc44'});
  const sAX=rx+15, sAY=spY+14;
  const sAW=320, sAH=Math.max(20,245-sAY-2);
  let spLayout=null,spBestScore=-Infinity;
  for(const tryFs of [10,9,8]){
    for(const tryRows of [1,2,3,4]){
      const tryCols=Math.ceil(totalSpells/tryRows);
      if(tryCols<1)continue;
      const cellW=sAW/tryCols, cellH=sAH/tryRows;

  }

  const spCellW=sAW/spCols, spCellH=sAH/spLayout.rows;

  const btnX=W-345,btnY=250,btnW=340,btnH=45;

    ctx.fillStyle=btnHv?'rgba(60,140,60,.95)':'rgba(40,90,40,.85)';
  } else {
    ctx.fillStyle='rgba(40,40,50,.6)';
  }
  ctx.fillRect(btnX,btnY,btnW,btnH);
  ctx.strokeStyle=canSkip?(btnHv?'#a0ffa0':'#60c060'):'#333';
  ctx.lineWidth=2;
  ctx.strokeRect(btnX,btnY,btnW,btnH);
  const btnLabel=canSkip?'▶ Следующая волна: '+(this.wave+1):'▶ Недоступно';
  tx(btnLabel,btnX+btnW/2,btnY+28,{size:14,weight:'bold',
    color:canSkip?'#fff':'#606878',align:'center'});
  if(p.hasSage()){
    ctx.fillStyle='rgba(0,20,60,.7)';ctx.fillRect(15,280,330,110);
    ctx.strokeStyle='#a0c0ff';ctx.lineWidth=1;ctx.strokeRect(15,280,330,110);
    tx('◈ ВЕЛИКИЙ МУДРЕЦ ◈',20,297,{size:12,weight:'bold',color:'#a0c0ff'});
    let near=null,nd=350*350;
    for(const e of this.enemies){
      if(!e.alive)continue;
      const dd=d2(e.x,e.y,p.x,p.y);
      if(dd<nd){nd=dd;near=e;}
    }
    if(near){
      tx('Анализ: '+near.t.n,20,317,{size:11,color:'#ffcc44'});
      tx('HP: '+Math.ceil(near.hp)+'/'+Math.ceil(near.maxHp)+'  Угроза: '+near.t.l,20,333,{size:10,color:'#e6e6f0'});
      const wn=near.t.n;let weak='—';
      if(wn.includes('Скелет')||wn.includes('Зомби')||wn.includes('Лич')||wn.includes('Нежить')||wn.includes('Ужас'))weak='Огонь';
      else if(wn.includes('Демон')||wn.includes('Адоль'))weak='Свет';
      else if(wn.includes('Ангел')||wn.includes('Михаэль')||wn.includes('Фелдвей'))weak='Тьма';
      else if(wn.includes('Дракон'))weak='Лёд';
      else if(wn.includes('Орк'))weak='Свет';
      tx('Слабость: '+weak,20,349,{size:10,color:'#ff80a0'});
    } else {
      tx('Врагов поблизости нет',20,317,{size:11,color:'#808098'});
    }
    tx('Авто-зелье [V]: '+(p.autoPotion?'ВКЛ':'ВЫКЛ'),20,371,{size:11,color:p.autoPotion?'#80ff80':'#ff8080'});
  }
  for(let i=0;i<this.bosses.length;i++){
    const b=this.bosses[i];
    const bx=W/2-200,by=H-60-i*30;
    const lbl=b.bn+(b.sup?' ★':'')+' — '+Math.ceil(b.hp)+'/'+b.maxHp+(b.enraged?'  🔥ГНЕВ '+b.enrageTimer.toFixed(1)+'с':'');
    tx(lbl,bx,by-6,{size:11,color:b.enraged?'#ff3030':'#ff6060',glow:b.enraged?'#8b0000':null,glowBlur:8});
    bar(bx,by,400,10,b.hp,b.maxHp,b.enraged?'#8b0000':'#ff4040');
  }
  const mmW=240,mmH=135;
  const mmX=W-mmW-15,mmY=H-mmH-15;
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(mmX,mmY,mmW,mmH);
  ctx.strokeStyle='#4060a0';ctx.lineWidth=1;ctx.strokeRect(mmX+.5,mmY+.5,mmW-1,mmH-1);
  ctx.fillStyle='rgba(20,30,50,.55)';ctx.fillRect(mmX+2,mmY+2,mmW-4,mmH-4);
  const mmSX=(mmW-4)/WW,mmSY=(mmH-4)/WH;
  for(const e of this.enemies){
    if(!e.alive)continue;
    ctx.fillStyle='#ff6060';ctx.fillRect(mmX+2+e.x*mmSX,mmY+2+e.y*mmSY,2,2);
  }
  for(const b of this.bosses){
    if(!b.alive)continue;
    ctx.fillStyle='#ff2020';ctx.fillRect(mmX+2+b.x*mmSX-2,mmY+2+b.y*mmSY-2,5,5);
  }
  ctx.strokeStyle='rgba(80,200,220,.8)';ctx.lineWidth=1;
  ctx.strokeRect(mmX+2+this.camX*mmSX,mmY+2+this.camY*mmSY,W*mmSX,H*mmSY);
  if(this.player){
    ctx.fillStyle='#50c8dc';ctx.beginPath();
    ctx.arc(mmX+2+this.player.x*mmSX,mmY+2+this.player.y*mmSY,3,0,7);ctx.fill();

};

  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  tx('ПАУЗА',W/2,180,{size:52,weight:'bold',color:'#50c8dc',align:'center'});
  const opts=[
    {t:'ESC / 1 — продолжить',y:300},
    {t:'2 — Хроники',y:350},
    {t:'3 — Выйти в меню',y:400}
  ];
  for(const o of opts){
    const hv=this.hov(W/2-200,o.y-20,400,40);
    tx(o.t,W/2,o.y,{size:19,color:hv?'#50c8dc':'#fff',align:'center'});
  }
};

Game.prototype.rGO=function(){
  const p=this.player;
  ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,H);
  tx('ВЫ ПОГЛОЩЕНЫ БЕЗДНОЙ',W/2,180,{size:42,weight:'bold',color:'#ff4040',align:'center'});
  tx('Уровень '+p.lv+' • Волна '+this.wave,W/2,270,{size:22,color:'#fff',align:'center'});
  tx(p.cn+' ('+p.rn+')',W/2,315,{size:18,color:p.c,align:'center'});
  txFit('Убийств: '+p.kills+'  Золото: '+p.gold+'  Артефактов: '+p.arts.length,W/2,360,W-80,{size:14,color:'#a0a8b8',align:'center'},10);
  tx('⏱ Время: '+fmtTime(this.runTime),W/2,395,{size:16,color:'#80c0ff',align:'center'});
  const r=this.hov(W/2-150,440,150,50);
  const m=this.hov(W/2,440,150,50);
  ctx.fillStyle=r?'#3a6a8a':'#203050';ctx.fillRect(W/2-150,440,150,50);
  ctx.strokeStyle='#50c8dc';ctx.strokeRect(W/2-150,440,150,50);
  tx('R — заново',W/2-75,472,{size:15,color:'#fff',align:'center'});
  ctx.fillStyle=m?'#3a6a8a':'#203050';ctx.fillRect(W/2,440,150,50);
  ctx.strokeRect(W/2,440,150,50);
  tx('M — меню',W/2+75,472,{size:15,color:'#fff',align:'center'});
};

Game.prototype.rCutscene=function(){
  const cd=this.cutsceneData||{x:W/2,y:H/2,color:'#c0c0ff'};
  const elapsed=5-this.cutsceneTimer;
  const t=performance.now()/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const fadeIn=Math.min(1,elapsed*2);
  ctx.globalAlpha=fadeIn;
  ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;

  for(let i=0;i<80;i++){
    const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.08+Math.abs(Math.sin(t*1.5+i))*.25;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;

  const luvAlpha=Math.max(0,1-elapsed*0.5);
  if(luvAlpha>0){
    const luvSize=42*(1+elapsed*0.15);
    ctx.globalAlpha=luvAlpha*0.85;
    shape('winged',W/2,H/2-40,luvSize,sh(cd.color,-40),false);
    for(let i=0;i<15;i++){
      const angle=Math.random()*6.283;
      const r=Math.random()*80;
      const px=W/2+Math.cos(angle)*r;
      const py=H/2-40+Math.sin(angle)*r;
      ctx.globalAlpha=luvAlpha*Math.random()*0.9;
      ctx.fillStyle=cd.color;
      ctx.beginPath();ctx.arc(px,py,Math.random()*3+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;}

  if(elapsed>1&&elapsed<3){
    const waveProg=(elapsed-1)/2;
    const waveR=50+waveProg*300;
    ctx.strokeStyle='rgba(192,192,255,'+(1-waveProg)*0.6+')';
    ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,204,68,'+(1-waveProg)*0.4+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR*0.7,0,7);ctx.stroke();}

  if(elapsed>1&&elapsed<4){
    const riseProg=(elapsed-1)/3;
    const count=Math.floor(riseProg*40);
    for(let i=0;i<count;i++){
      const angle=(i/count)*6.283+t;
      const r=40+riseProg*100;
      const px=W/2+Math.cos(angle)*r*0.7;
      const py=H/2-40+Math.sin(angle)*r*0.4-riseProg*60;
      ctx.globalAlpha=0.8-riseProg*0.5;
      ctx.fillStyle='#ffcc44';
      ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();}
    ctx.globalAlpha=1;}

  if(elapsed>2){
    const slimeProg=Math.min(1,(elapsed-2)/2);
    const slimeSize=20+slimeProg*45;
    ctx.globalAlpha=slimeProg;
    ctx.fillStyle='rgba(80,200,220,0.15)';
    ctx.beginPath();ctx.arc(W/2,H/2-40,slimeSize*2,0,7);ctx.fill();
    shape('circle',W/2,H/2-40,slimeSize,'#50c8dc',false);
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.strokeStyle='#50c8dc';ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const angle=i/8*6.283+t*0.5;
      const r1=slimeSize*1.3,r2=slimeSize*1.3+15;
      ctx.globalAlpha=slimeProg*0.6;
      ctx.beginPath();
      ctx.moveTo(W/2+Math.cos(angle)*r1,H/2-40+Math.sin(angle)*r1);
      ctx.lineTo(W/2+Math.cos(angle)*r2,H/2-40+Math.sin(angle)*r2);
      ctx.stroke();}
    ctx.globalAlpha=1;}

  const textLines=[
    {l:0.3,t:'Иварадж поглощает Веланаву и Лусию...',c:'#ff40a0'},
    {l:1.5,t:'Но Римуру поглощает самого Ивараджа.',c:'#c080ff'},
    {l:2.7,t:'Четыре Истинных Дракона обрели покой...',c:'#50c8dc'},
    {l:3.7,t:'Слизь стал Богом Пустоты.',c:'#ffcc44'}];
  for(let i=0;i<textLines.length;i++){
    const tl=textLines[i];
    if(elapsed>=tl.l){
      const alpha=Math.min(1,(elapsed-tl.l)*2);
      ctx.globalAlpha=alpha;
      txFit(tl.t,W/2,H/2+150+i*30,W-100,{size:18,color:tl.c,align:'center',glow:tl.c,glowBlur:10*alpha},12);
      ctx.globalAlpha=1;}}

  if(elapsed>1.5){
    const btnX=W-220,btnY=H-70,btnW=200,btnH=50;
    const hv=this.mx>=btnX&&this.mx<=btnX+btnW&&this.my>=btnY&&this.my<=btnY+btnH;
    const alpha=Math.min(1,(elapsed-1.5)*2);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=hv?'rgba(60,110,140,.95)':'rgba(30,50,80,.85)';
    ctx.fillRect(btnX,btnY,btnW,btnH);
    ctx.strokeStyle=hv?'#80e0f0':'#4060a0';
    ctx.lineWidth=2;
    ctx.strokeRect(btnX,btnY,btnW,btnH);
    tx('ПРОПУСТИТЬ',btnX+btnW/2,btnY+31,{size:16,weight:'bold',color:hv?'#fff':'#c8d0e0',align:'center'});
    ctx.globalAlpha=1;}
};

Game.prototype.rVictory=function(){
  const p=this.player;
  const t=performance.now()/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++){
    const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.05+Math.abs(Math.sin(t*1.5+i))*.15;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1+Math.sin(t+i)*1,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(W/2,180+Math.sin(t)*5);
  shape('slime',0,0,55,'#50c8dc',false);
  for(let i=0;i<12;i++){
    const a=t*.6+i/12*6.283;
    const r=80+Math.sin(t*2+i)*20;
    ctx.globalAlpha=.4+Math.sin(t*3+i)*.3;
    ctx.fillStyle='#ffcc44';
    ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
  const glow=Math.sin(t*2)*0.3+0.7;
  tx('✦ ИСТИННЫЙ ФИНАЛ ✦',W/2,320,{size:48,weight:'bold',color:'#ffcc44',align:'center',glow:'#ffcc44',glowBlur:40*glow});
  tx('Хроники Истинных Драконов завершены',W/2,365,{size:20,color:'#a0c0ff',align:'center'});
  const lines=[
    'Иварадж поглотил Веланаву и Люсию — но Римуру поглотил их обоих.',
    'Четыре Истинных Дракона обрели покой в его клинке.',
    'Слизь, ставшая Повелителем Монстров, поднялась до Бога Пустоты.',
    '',
    'Вельдора наконец свободен. Вельзард и Ги Кримзон вернулись на Север.',
    'Милим Нава улыбается. Леон, Ламирис, Диабло — все живы.',
    'Темпест стоит. Мир Тенсуры — тоже.',
    '',
    'И где-то далеко, в другом мире, Миками Сатору больше не один.'
  ];
  let ly=410;
  for(const line of lines){
    txFit(line,W/2,ly,W-80,{size:14,color:line.startsWith('—')?'#ffcc44':'#e6e6f0',align:'center'},10);
    ly+=26;
  }
  tx('Уровень '+p.lv+'   •   Волна 50   •   Убийств '+p.kills+'   •   Артефактов '+p.arts.length,
     W/2,H-110,{size:14,color:'#a0a8b8',align:'center'});
  tx('⏱ Время прохождения: '+fmtTime(this.runTime),W/2,H-140,{size:18,weight:'bold',color:'#80c0ff',align:'center'});
  tx('Секретных побед: '+(SV.d.secWins||1),W/2,H-85,{size:12,color:'#ffcc44',align:'center'});
  const hv=this.hov(W/2-200,H-55,400,40);
  ctx.fillStyle=hv?'rgba(50,80,110,.9)':'rgba(30,45,65,.8)';
  ctx.fillRect(W/2-200,H-55,400,40);
  ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;
  ctx.strokeRect(W/2-200,H-55,400,40);
  tx('Нажмите любую клавишу или кликните',W/2,H-30,{size:14,color:hv?'#fff':'#c8d0e0',align:'center'});
};

    {title:'🌀 Навыки и резонанс',lines:[

      'Эволюция и апгрейд на ВЫСШИЙ = 4 осколка, на БОЖЕСТВЕННЫЙ = 7. Ранние тиры — бесплатно.'
