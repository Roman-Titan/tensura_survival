function fan(desc,cd,cnt,spread,dmg,color,r,pierce,el){return{desc,cd,el,cast(g,p,t){
  const tier=p.skills[this.n].tier;
  let dB=1+0.03*(p.resonanceCount||0);
  if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const elm=elemMul(p,el);
  const d=(dmg*TM[tier]+p.atk)*dB*cm*elm;
  const src=tier>=TIER_SUP?'supreme':'normal';
  const pc=(pierce||0)+(p.pierceBonus||0);
  const pa=predictAim(p.x,p.y,t,640);const a0=pa!==null?pa:p.aim;
  const spreadMul=Math.min(6.283/spread,p.aoeMult||1);const sp=spread*spreadMul;
  const rSize=r*(p.aoeMult||1);
  for(let i=0;i<cnt;i++){const a=a0+(i-(cnt-1)/2)*sp;
    g.proj.push(new Proj(p.x,p.y,Math.cos(a)*640,Math.sin(a)*640,d,color,rSize,true,pc,src));}
  for(let i=0;i<8;i++)g.particles.push(new Part(p.x,p.y,color));}};}
function burst(desc,cd,dmg,color,r,el){return{desc,cd,el,cast(g,p){
  const tier=p.skills[this.n].tier;
  let dB=1+0.03*(p.resonanceCount||0);
  if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const elm=elemMul(p,el);
  const d=(dmg*TM[tier]+p.mag)*dB*cm*elm;
  const R=r*(p.aoeMult||1);
  for(const e of g.enemies)if(e.alive&&d2(e.x,e.y,p.x,p.y)<R*R)e.dmg(d,src(tier));
  for(const b of g.bosses)if(b.alive&&d2(b.x,b.y,p.x,p.y)<R*R)b.dmg(d,src(tier));
  for(let i=0;i<20;i++){const a=i/20*6.283;
    g.particles.push(new Part(p.x+Math.cos(a)*R*.85,p.y+Math.sin(a)*R*.85,color));}}};}
function shot(desc,cd,dmg,color,pierce,speed,el){return{desc,cd,el,cast(g,p,t){
  const tier=p.skills[this.n].tier;
  let dB=1+0.03*(p.resonanceCount||0);
  if(p.buffs.insp>0)dB*=1.2;if(p.buffs.res>0)dB*=1.5;
  if(p.buffs.luck>0)dB*=1.3;if(p.buffs.satanael>0)dB*=1.5;if(p.buffs.azatot>0)dB*=2;
  if(p.rid==='ogre'&&p.hp<p.maxHp*0.5)dB*=1.2;
  const cr=Math.random()*100<p.crit;const cm=cr?p.cdmg:1;
  const elm=elemMul(p,el);
  const d=(dmg*TM[tier]+p.mag)*dB*cm*elm;
  const spd=speed||800;
  const pa=predictAim(p.x,p.y,t,spd);const a=pa!==null?pa:p.aim;
  const pc=(pierce||0)+(p.pierceBonus||0);
  g.proj.push(new Proj(p.x,p.y,Math.cos(a)*spd,Math.sin(a)*spd,d,color,6*(p.aoeMult||1),true,pc,src(tier)));}};}
function src(tier){return tier>=TIER_SUP?'supreme':'normal';}
function predictAim(px,py,t,projSpeed){if(!t)return null;
  const spdPx=t.isBoss?(t.ph===1?70:100):(t.spd||0)*62;
  const ea=Math.atan2(py-t.y,px-t.x);const evx=Math.cos(ea)*spdPx;const evy=Math.sin(ea)*spdPx;
  let tt=Math.sqrt((px-t.x)**2+(py-t.y)**2)/projSpeed;
  for(let k=0;k<3;k++){const predX=t.x+evx*tt;const predY=t.y+evy*tt;
    tt=Math.sqrt((px-predX)**2+(py-predY)**2)/projSpeed;}
  return Math.atan2((t.y+evy*tt)-py,(t.x+evx*tt)-px);}
function xpForLevels(p,n){let total=0;let xpn=p.xpn;for(let i=0;i<n;i++){total+=xpn;xpn=~~(xpn*1.25);}return total;}
function scaleEnemyToWave(e,wave){const hpMul=wave<=20?1+0.01*(wave-1):Math.pow(1.03,wave-20)*1.19;
  const xpMul=wave<=20?1+0.10*(wave-1):Math.pow(1.08,wave-20)*2.90;
  e.maxHp=~~(e.maxHp*hpMul);e.hp=e.maxHp;e.atk=~~(e.atk*hpMul);e.xp=~~(e.xp*xpMul);return e;}
function makeChaosEnemy(e){e.chaos=true;e.maxHp=~~(e.maxHp*1.3);e.hp=e.maxHp;e.atk=~~(e.atk*1.5);
  e.spd=e.spd*1.2;e.xp=~~(e.xp*1.5);e.z=e.z*1.15;e.c=sh(e.c,-25);return e;}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=s%60;
  if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

function doMeleeHit(g, p, angle, range, arc, dmg, src) {
    let hitAny = false;
    const checkHit = (e) => {
        if (!e.alive) return;
        const dx = e.x - p.x, dy = e.y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist <= range + e.z) {
            const angleTo = Math.atan2(dy, dx);
            let aDiff = Math.abs(angleTo - angle);
            if (aDiff > Math.PI) aDiff = Math.PI * 2 - aDiff;
            if (aDiff <= arc / 2) {
                const isCrit = Math.random()*100 < p.crit;
                let finalDmg = dmg * (isCrit ? p.cdmg : 1);
                e.dmg(finalDmg, src);
                hitAny = true;
                for(let j=0;j<5;j++) g.particles.push(new Part(e.x, e.y, p.c));
                if (p.wepHope) {
                    const heal = p.maxHp * 0.02;
                    p.hp = Math.min(p.maxHp, p.hp + heal);
                    g.ftxt.push(new FTxt('+'+~~heal+' HP', e.x, e.y-15, '#fff8c0', 1.2, 12));
                }
            }
        }
    };
    for (const e of g.enemies) checkHit(e);
    for (const b of g.bosses) checkHit(b);
    if (hitAny) {
        g.shake = 3;
        AU.sfx('hit');
    }
}

function availableElites(g){
  return ELITE.filter(e=>{
    if(e.unlock.type==='wave') return g.wave>=e.unlock.val;
    if(e.unlock.type==='boss'){
      if(!g.bsSpawned.has(e.unlock.key)) return false;
      const t=BT[e.unlock.key];
      if(t&&t.pair){return !g.bosses.some(b=>t.pair.includes(b.bn));}
      return !g.bosses.some(b=>b.bn===e.unlock.key);
    }
    return false;
  });
}

class FTxt{
constructor(t,x,y,c,l,sz){this.t=t;this.x=x;this.y=y;this.c=c||'#fff';
this.l=l||1.2;this.ml=this.l;this.sz=sz||16;this.vy=-40;}
update(dt){this.y+=this.vy*dt;this.l-=dt;}
draw(){const a=cl(this.l/this.ml,0,1);ctx.globalAlpha=a;
const edge=Math.min(WW-this.x,this.x)*2-40;const maxW=Math.max(120,Math.min(680,edge));
txFit(this.t,this.x,this.y,maxW,{color:this.c,size:this.sz,align:'center'},10);ctx.globalAlpha=1;}
}

class Part{
constructor(x,y,c){this.x=x;this.y=y;this.c=c;
const a=rnd(0,6.28),s=rnd(80,320);this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
this.l=rnd(.3,.8);this.ml=this.l;this.z=rnd(2,5);}
update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=.94;this.vy*=.94;this.l-=dt;}
draw(){const a=cl(this.l/this.ml,0,1);ctx.globalAlpha=a;
ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.z*a,0,7);ctx.fill();ctx.globalAlpha=1;}
}

class Slash {
  constructor(x,y,angle,radius,arc,color){
    this.x=x; this.y=y; this.angle=angle; this.radius=radius;
    this.arc=arc; this.color=color; this.life=0.15; this.maxLife=0.15;
  }
  update(dt){ this.life-=dt; }
  draw(){
    const a = cl(this.life/this.maxLife,0,1);
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    ctx.globalAlpha = a;
    ctx.strokeStyle = this.color; ctx.lineWidth = 8 * a; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, this.radius, -this.arc/2, this.arc/2); ctx.stroke();

function shape(sp,x,y,r,c,fl){
  ctx.fillStyle=fl?'#fff':c;ctx.beginPath();
  if(sp==='circle')ctx.arc(x,y,r,0,7);

  else if(sp==='diamond'){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
  else if(sp==='star'){for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i/10*6.283-1.57;
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();}
  else if(sp==='demon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.8,y-r*.5);ctx.lineTo(x+r*.4,y-r*.1);
    ctx.lineTo(x+r,y+r*.6);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y+r*.6);ctx.lineTo(x-r*.4,y-r*.1);
    ctx.lineTo(x-r*.8,y-r*.5);ctx.closePath();}
  else if(sp==='angel'){ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+r,y-r*.3,x+r*.6,y+r*.3);
    ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.4);ctx.lineTo(x-r*.2,y+r);ctx.lineTo(x-r*.6,y+r*.3);
    ctx.quadraticCurveTo(x-r,y-r*.3,x,y-r);}
  else if(sp==='dragon'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.7,y-r*.3);ctx.lineTo(x+r,y+r*.3);
    ctx.lineTo(x+r*.4,y+r*.2);ctx.lineTo(x+r*.2,y+r);ctx.lineTo(x,y+r*.3);ctx.lineTo(x-r*.2,y+r);
    ctx.lineTo(x-r*.4,y+r*.2);ctx.lineTo(x-r,y+r*.3);ctx.lineTo(x-r*.7,y-r*.3);ctx.closePath();}
  else if(sp==='skull'){ctx.arc(x,y-r*.1,r*.85,.3,2.84);ctx.lineTo(x+r*.7,y+r*.4);
    ctx.lineTo(x+r*.3,y+r*.5);ctx.lineTo(x+r*.3,y+r*.9);ctx.lineTo(x-r*.3,y+r*.9);
    ctx.lineTo(x-r*.3,y+r*.5);ctx.lineTo(x-r*.7,y+r*.4);ctx.closePath();}
  else if(sp==='wolf'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.8,y-r*.6);ctx.lineTo(x+r*.5,y-r*.2);
    ctx.lineTo(x+r,y+r*.5);ctx.lineTo(x+r*.2,y+r*.8);ctx.lineTo(x,y+r*.4);ctx.lineTo(x-r*.2,y+r*.8);
    ctx.lineTo(x-r,y+r*.5);ctx.lineTo(x-r*.5,y-r*.2);ctx.lineTo(x-r*.8,y-r*.6);ctx.closePath();}
  else if(sp==='winged'){ctx.moveTo(x-r,y-r*.3);ctx.quadraticCurveTo(x,y-r*1.5,x+r,y-r*.3);
    ctx.quadraticCurveTo(x,y,x+r,y+r*.3);ctx.quadraticCurveTo(x,y+r,x-r,y+r*.3);ctx.quadraticCurveTo(x,y,x-r,y-r*.3);}
  else ctx.arc(x,y,r,0,7);
  ctx.fill();ctx.strokeStyle=fl?'#fff':sh(c,-40);ctx.lineWidth=2;ctx.stroke();

mult(m){this.maxHp=~~(this.maxHp*m);this.hp=~~(this.hp*m);
this.maxMp=~~(this.maxMp*m);this.mp=~~(this.mp*m);
this.atk=~~(this.atk*m);this.def=~~(this.def*m);this.mag=~~(this.mag*m);}
div(m){this.maxHp=~~(this.maxHp/m);this.hp=Math.min(this.hp,this.maxHp);
this.maxMp=~~(this.maxMp/m);this.mp=Math.min(this.mp,this.maxMp);
this.atk=~~(this.atk/m);this.def=~~(this.def/m);this.mag=~~(this.mag/m);}
addSk(n){if(this.skills[n]||!SKILLS[n])return false;this.skills[n]={tier:0,cd:0,resCd:0};
for(let i=0;i<3;i++)if(!this.slots[i]){this.slots[i]=n;return true;}return true;}
hasSup(){for(const s in this.skills)if(this.skills[s].tier>=TIER_SUP)return true;return false;}
hasSage(){return !!(this.skills['Великий Мудрец']||this.skills['Рафаэль']||this.skills['Сиэль']);}

hurt(v){
  if(this.inv>0||this.dodg>0||this.buffs.invuln>0)return;
  if(this.parryWindow>0){this.parryWindow=0;this.parrySuccess=0.4;this.parryCd=0;
    this.inv=0.3;this.buffs.insp=Math.max(this.buffs.insp,1.5);return;}
  if(this.dod>0&&Math.random()*100<this.dod)return;
  let d=Math.max(1,v-this.def*.5);
  if(this.buffs.stoic>0)d*=.5;
  if(this.shield>0){const ab=Math.min(this.shield,d);this.shield-=ab;d-=ab;if(this.shield<=0)this.buffs.shield=0;}
  d=~~d;this.hp-=d;this.inv=.35;
  const now=performance.now();
  if(!this._lastDmgSfx||now-this._lastDmgSfx>160){AU.sfx('damage');this._lastDmgSfx=now;}
  if(this.hp<=0){
    if(this.tear&&this.tearCd<=0){
      this.hp=this.maxHp*.5;this.tearCd=Math.max(20,60*(1-this.cdr));
    } else if(this.wepHope && this.elpisCd <= 0) {
      this.hp = this.maxHp;
      this.elpisCd = 60;
      this.buffs.invuln = 3;
      if(this.game){
        this.game.flash = 1;
        this.game.shake = 20;
        this.game.ftxt.push(new FTxt('СПАСЕНИЕ ВЕРОЙ В ПОБЕДУ!', this.x, this.y-60, '#fff8c0', 3, 24));
        for(let i=0;i<50;i++){
          const a = Math.random()*6.283;
          this.game.particles.push(new Part(this.x + Math.cos(a)*50, this.y + Math.sin(a)*50, '#fff8c0'));
        }
        AU.sfx('lvl');
      }
    } else {
      this.hp = 0;
    }
  }
}
heal(a){this.hp=Math.min(this.maxHp,this.hp+a);}
gainXp(a){a*=this.xpM;this.xp+=a;let lvls=0;
while(this.xp>=this.xpn){this.xp-=this.xpn;this.lv++;this.xpn=~~(this.xpn*1.25);
this.maxHp+=15;this.hp=this.maxHp;this.maxMp+=8;this.mp=this.maxMp;this.atk+=2;lvls++;}
return lvls;}
near(en,bs){let best=null,bd=900*900;
for(const e of en){if(!e.alive)continue;const d=d2(e.x,e.y,this.x,this.y);if(d<bd){bd=d;best=e;}}
for(const b of bs){if(!b.alive)continue;const d=d2(b.x,b.y,this.x,this.y);if(d<bd){bd=d;best=b;}}
return best;}
dodge(){if(this.dcd>0||this.dodg>0)return false;
this.dcd=Math.max(0.6,1.5*(1-this.cdr));this.dodg=.25;this.inv=.4;
this.dvx=Math.cos(this.aim)*450;this.dvy=Math.sin(this.aim)*450;return true;}
tryParry(){if(this.parryCd>0||this.parryWindow>0)return false;
  this.parryWindow=0.3;this.parryCd=Math.max(1.0,3.0*(1-this.cdr));
  if(this.game)castVis(this.game,this,'#ffcc44',10,this.z+5);AU.sfx('sel');return true;}

update(dt,k,g){
  this.game=g;
  if(this.parryWindow>0)this.parryWindow-=dt;
  if(this.parryCd>0)this.parryCd-=dt;
  if(this.parrySuccess>0)this.parrySuccess-=dt;
  if(this.parrySuccess>0&&!this._parryShown){this._parryShown=true;AU.sfx('dodge');g.shake=6;
    castVis(g,this,'#ffff80',20,this.z+15);castVis(g,this,'#ffffff',8,this.z+5);}
  if(this.parrySuccess<=0)this._parryShown=false;
  this.slow=Math.max(0,this.slow-dt);
  const resSkills=Object.keys(this.skills).filter(sk=>!this.slots.includes(sk));
  this.resonanceCount=resSkills.length;
  let dmgBonus=1+0.03*this.resonanceCount;
  if(this.buffs.insp>0)dmgBonus*=1.2;if(this.buffs.res>0)dmgBonus*=1.5;
  if(this.buffs.luck>0)dmgBonus*=1.3;if(this.buffs.satanael>0)dmgBonus*=1.5;
  if(this.buffs.azatot>0)dmgBonus*=2;
  if(this.rid==='ogre'&&this.hp<this.maxHp*0.5)dmgBonus*=1.2;
  let dx=0,dy=0;
  if(k['w']||k['arrowup'])dy--;if(k['s']||k['arrowdown'])dy++;
  if(k['a']||k['arrowleft'])dx--;if(k['d']||k['arrowright'])dx++;
  if(this.dodg>0){this.x+=this.dvx*dt;this.y+=this.dvy*dt;this.dodg-=dt;}
  else if(dx||dy){let sp=this.spd*62;if(this.buffs.haste>0)sp*=1.4;if(this.slow>0)sp*=0.55;
  const L=Math.sqrt(dx*dx+dy*dy);this.x+=dx/L*sp*dt;this.y+=dy/L*sp*dt;this.aim=Math.atan2(dy,dx);}
  this.x=cl(this.x,this.z,WW-this.z);this.y=cl(this.y,this.z,WH-this.z);
  this.inv=Math.max(0,this.inv-dt);this.acd=Math.max(0,this.acd-dt);
  this.mcd=Math.max(0,this.mcd-dt);this.dcd=Math.max(0,this.dcd-dt);
  this.tearCd=Math.max(0,this.tearCd-dt);
  this.elpisCd=Math.max(0,this.elpisCd-dt);
  this.apcd=Math.max(0,this.apcd-dt);
  for(const b in this.buffs)this.buffs[b]=Math.max(0,this.buffs[b]-dt);
  if(this.buffs.shield<=0&&this.shield>0)this.shield=0;
  for(const s in this.skills)if(this.skills[s].cd>0)this.skills[s].cd-=dt;
  for(const sp of this.spells)if((sp.cd||0)>0)sp.cd-=dt;
  if(this.autoPotion&&this.hasSage()&&this.hp<this.maxHp*0.25&&this.apcd<=0){
    const heal=this.maxHp*0.15;this.hp=Math.min(this.maxHp,this.hp+heal);
    this.apcd=Math.max(1.5,5*(1-this.cdr));
    g.ftxt.push(new FTxt('Мудрец: +'+~~heal+' HP',this.x,this.y-35,'#a0ffa0',1.5,14));}
  const t=this.near(g.enemies,g.bosses);
  if(t&&this.acd<=0){
    const pa=predictAim(this.x,this.y,t,600);const a=pa!==null?pa:Math.atan2(t.y-this.y,t.x-this.x);
    const cr=Math.random()*100<this.crit;const cm=cr?this.cdmg:1;
    const baseDm=(this.atk+this.wep.a)*cm*dmgBonus;
    const src=this.hasSup()?'supreme':'normal';const ao=this.aoeMult||1;
    
    switch(this.wep.atkType){
      case 'sword':
        if(this.wep.rank>=6) {
          g.slashes.push(new Slash(this.x, this.y, a, 120*ao, Math.PI*2, this.c));
          doMeleeHit(g, this, a, 120*ao, Math.PI*2, baseDm, src);
        } else if(this.wep.rank>=3) {
          g.slashes.push(new Slash(this.x, this.y, a, 100*ao, Math.PI*1.2, this.c));
          doMeleeHit(g, this, a, 100*ao, Math.PI*1.2, baseDm, src);
        } else {
          g.slashes.push(new Slash(this.x, this.y, a, 90*ao, Math.PI*0.8, this.c));
          doMeleeHit(g, this, a, 90*ao, Math.PI*0.8, baseDm, src);
        }
        break;
      case 'katana':
        g.slashes.push(new Slash(this.x, this.y, a, 110*ao, Math.PI*0.4, this.c));
        g.slashes.push(new Slash(this.x, this.y, a+Math.PI/2, 110*ao, Math.PI*0.4, this.c));
        doMeleeHit(g, this, a, 110*ao, Math.PI*0.6, baseDm*0.8, src);
        if(this.wep.rank>=5) {
          g.slashes.push(new Slash(this.x, this.y, a+Math.PI/4, 110*ao, Math.PI*0.4, this.c));
          g.slashes.push(new Slash(this.x, this.y, a-Math.PI/4, 110*ao, Math.PI*0.4, this.c));
        }
        break;
      case 'scythe':
        const scyArc = this.wep.rank>=5 ? Math.PI*2 : Math.PI*1.5;
        g.slashes.push(new Slash(this.x, this.y, a, 130*ao, scyArc, this.c));
        doMeleeHit(g, this, a, 130*ao, scyArc, baseDm*1.1, src);
        break;
      case 'dagger':
        g.slashes.push(new Slash(this.x, this.y, a, 70*ao, Math.PI*0.4, this.c));
        doMeleeHit(g, this, a, 70*ao, Math.PI*0.4, baseDm*0.8, src);

    else if(this.state==='chronicles'){const ss=Object.keys(CHR);
      for(let i=0;i<ss.length;i++){const y=80+i*28;
        if(my>=y-14&&my<=y+6&&mx>=20&&mx<=240){this.chrS=i;this.chrScrl=0;AU.sfx('sel');return;}}}}
        
  kd(e){const k=e.key.toLowerCase();this.keys[k]=true;
    if(e.repeat&&this.state!=='custom_name')return;
    if(this.state==='menu'){
      if(k==='1'){this.startTutorial();}
      else if(k==='2'){this.state='mode_select';AU.sfx('sel');}
      else if(k==='3'){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='menu';}
      else if(k==='4'||k==='t'){this.startTutorial();}}
    else if(this.state==='mode_select'){
      if(k==='1'){this.state='race_select';this.historyMode=false;AU.sfx('sel');}
      else if(k==='2'){this.startHistory();}
      else if(k==='escape'){this.state='menu';AU.sfx('sel');}}
    else if(this.state==='race_select'){const ids=Object.keys(RACES);let idx=-1;
      if(k.length===1){const n=parseInt(k);
        if(!isNaN(n))idx=n===0?9:n-1;
        else if(k==='q')idx=10;else if(k==='w')idx=11;else if(k==='e')idx=12;}
      if(idx>=0&&idx<ids.length){this.srid=ids[idx];this.state='character_select';}
      else if(k==='escape')this.state='menu';}
    else if(this.state==='character_select'){const r=RACES[this.srid];const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=r.ch.length){this.sch=r.ch[n-1];this.state='location_select';}
      else if(k==='c'){this.state='custom_name';this.cnm='';}
      else if(k==='escape')this.state='race_select';}
    else if(this.state==='custom_name'){
      if(k==='enter'){if(this.cnm.trim()){this.sch={n:this.cnm.trim(),b:{},sk:'Универсальное Превращение',d:'Свой.'};this.state='location_select';}}
      else if(k==='backspace')this.cnm=this.cnm.slice(0,-1);
      else if(k==='escape')this.state='character_select';
      else if(e.key.length===1&&this.cnm.length<20&&/[a-zA-Zа-яА-Я0-9 ]/.test(e.key))this.cnm+=e.key;}
    else if(this.state==='location_select'){const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=LOCS.length){this.sloc=LOCS[n-1];this.startRun();}
      else if(k==='escape')this.state='character_select';}
    else if(this.state==='playing'){
      if(k==='escape')this.state='paused';
      else if(k==='q')this.useSk(0);
      else if(k==='e')this.useSk(1);
      else if(k==='r')this.useSk(2);
      else if(k==='v'&&this.player){this.player.autoPotion=!this.player.autoPotion;
        this.ftxt.push(new FTxt('Авто-зелье: '+(this.player.autoPotion?'ВКЛ':'ВЫКЛ'),
        this.player.x,this.player.y-40,this.player.autoPotion?'#a0ffa0':'#ff8080',1.5,14));}
      else if(k==='f'&&this.player){this.player.tryParry();}
      else if(k===' '){if(this.player.dodge()){AU.sfx('dodge');
        this.particles.push(...[...Array(8)].map(()=>new Part(this.player.x,this.player.y,'#80ffff')));}}}
    else if(this.state==='paused'){
      if(k==='escape'||k==='1')this.state='playing';
      else if(k==='2'){this.state='chronicles';this.chrS=0;this.chrScrl=0;this.retTo='paused';}
      else if(k==='3'){this.recordRun();this.state='menu';this.player=null;AU.stop();AU.music('menu');}}
    else if(this.state==='level_up'){const n=parseInt(k);
      if(!isNaN(n)&&n>=1&&n<=this.lvc.length)this.pick(n-1);}
    else if(this.state==='evolution'){
      if(k==='enter'||k===' '||k==='escape'){
        this.state='playing';if(this.pendingLv>0)this.pendingLv--;
        if(this.pendingLv>0)this.triggerLv();}}
    else if(this.state==='forge'){
      if(k==='escape'){
        this.forgePending=false;
        this.wave++;
        this.waveEnemiesToSpawn=5+this.wave*2;
        this.waveEnemiesSpawned=0;this.wt=0;
        this.state='playing';AU.music('combat');AU.sfx('sel');
        this.ftxt.push(new FTxt('Волна '+this.wave,this.player.x,this.player.y-150,'#fff',2,26));}}
    else if(this.state==='cutscene'){}
    else if(this.state==='victory'){this.recordRun();this.state='menu';this.player=null;AU.stop();AU.music('menu');}
    else if(this.state==='tutorial'){
      if(k==='escape'){this.state='menu';AU.stop();AU.music('menu');}
      else if(k===' '){
        if(this.tutStep===9){SV.d.tutDone=1;SV.save();this.state='menu';AU.stop();AU.music('menu');}
        else if(this.tutStep===1||this.tutStep===2||this.tutStep===3){
          if(this.tutData&&this.tutData.timer>8){this.tutStep++;this.tutData.timer=0;}}
        else{this.tutStep++;if(this.tutData)this.tutData.timer=0;}}
      else if(k==='q')this.useSk(0);
      else if(k==='e')this.useSk(1);
      else if(k==='r')this.useSk(2);
      else if(k==='f'&&this.player){this.player.tryParry();}
      else if(k==='v'&&this.player){this.player.autoPotion=!this.player.autoPotion;
        this.ftxt.push(new FTxt('Авто-зелье: '+(this.player.autoPotion?'ВКЛ':'ВЫКЛ'),
        this.player.x,this.player.y-40,this.player.autoPotion?'#a0ffa0':'#ff8080',1.5,14));}}
    else if(this.state==='chronicles'){const ss=Object.keys(CHR);
      if(k==='escape'){if(this.retTo==='paused'){this.state='paused';this.retTo=null;}else{this.state='menu';this.retTo=null;}}
      else if(k==='arrowright')this.chrS=(this.chrS+1)%ss.length;
      else if(k==='arrowleft')this.chrS=(this.chrS-1+ss.length)%ss.length;
      else if(k==='arrowdown')this.chrScrl+=40;
      else if(k==='arrowup')this.chrScrl=Math.max(0,this.chrScrl-40);}
    else if(this.state==='game_over'){
      if(k==='r')this.startRun();
      else if(k==='m'){this.recordRun();this.state='menu';this.player=null;AU.stop();AU.music('menu');}}}
      
  useSk(i){const p=this.player;if(!p)return;const n=p.slots[i];if(!n)return;
    const sk=p.skills[n];if(!sk||sk.cd>0)return;
    if(this.lasers&&this.lasers.some(l=>l.ownerSkill===n&&l.alive))return;
    sk.cd=Math.max(1.0,SKILLS[n].cd*(1-p.cdr));
    const t=p.near(this.enemies,this.bosses);
    SKILLS[n].n=n;SKILLS[n].el=SKILL_ELEM[n];SKILLS[n].cast(this,p,t);}
    
  startRun(){this.player=new Player(this.srid,this.sch,this.sloc);
    this.loc=this.sloc;this.enemies=[];this.bosses=[];this.proj=[];this.particles=[];this.ftxt=[];this.mines=[];this.lasers=[];this.pools=[];this.slashes=[];
    this.wave=1;this.wt=0;this.st=0;this.bsSpawned=new Set();this.shake=0;this.runTime=0;
    this.waveEnemiesToSpawn=5+this.wave*2;this.waveEnemiesSpawned=0;
    this.chain={iv:false,ve:false,lu:false};this.historyStep=0;
    this.timeSlowTimer=0;this.flash=0;this.pendingLv=0;
    this.finalWave=false;this.finalChainStep=0;this.finalDelay=0;this.victory=false;
    this.cutsceneTimer=0;this.cutsceneData=null;
    this.forgeRank=0;this.forgePending=false;this.forgeItems=[];
    this.pendingSkipGold=0;
    this.runRecorded=false;
    this.camX=cl(this.player.x-W/2,0,WW-W);this.camY=cl(this.player.y-H/2,0,WH-H);
    this.state='playing';if(!AU.init)AU.i();AU.stop();AU.music('combat');}
    
  recordRun(){
    if(this.player && !this.runRecorded){
      SV.upd({wave:this.wave,level:this.player.lv,kills:this.player.kills,gold:this.player.gold});
      this.runRecorded=true;
    }
  }
}

Game.prototype.canSkipWave=function(){if(this.state!=='playing')return false;
  if(this.finalWave)return false;if(this.bosses.length>0)return false;
  const nw=this.wave+1;if(nw>=50)return false;
  if(nw%5===0&&nw>=10)return false;return true;};
Game.prototype.skipWave=function(){const oldWave=this.wave;
  const skipGold=2*oldWave;
  this.pendingSkipGold=(this.pendingSkipGold||0)+skipGold;
  this.wave++;
  const add=5+this.wave*2;this.waveEnemiesToSpawn+=add;
  this.ftxt.push(new FTxt('▶ Волна '+this.wave+' (пропуск '+oldWave+', +'+skipGold+' отложено)',this.player.x,this.player.y-120,'#80ff80',2.5,22));
  AU.sfx('sel');this.shake=5;};

Game.prototype.startTutorial=function(){
  this.srid='slime';this.sch={n:'Ученик',b:{},sk:'Универсальное Превращение',d:'Тренировочный'};
  this.sloc=LOCS[0];this.player=new Player('slime',this.sch,this.sloc);this.loc=this.sloc;
  this.enemies=[];this.bosses=[];this.proj=[];this.particles=[];this.ftxt=[];this.mines=[];this.lasers=[];this.pools=[];this.slashes=[];
  this.wave=1;this.wt=0;this.st=999;this.shake=0;
  this.waveEnemiesToSpawn=0;this.waveEnemiesSpawned=0;
  this.bsSpawned=new Set();this.chain={iv:false,ve:false,lu:false};
  this.timeSlowTimer=0;this.flash=0;this.pendingLv=0;
  this.finalWave=false;this.finalChainStep=0;this.finalDelay=0;this.victory=false;
  this.cutsceneTimer=0;this.cutsceneData=null;this.runTime=0;
  this.forgeRank=0;this.forgePending=false;this.forgeItems=[];
  this.pendingSkipGold=0;
  this.camX=cl(this.player.x-W/2,0,WW-W);this.camY=cl(this.player.y-H/2,0,WH-H);
  this.tutStep=0;
  this.tutData={startX:this.player.x,startY:this.player.y,dummy:null,dummySpawned:false,timer:0};
  this.state='tutorial';AU.stop();AU.music('menu');};

Game.prototype.updTutorial=function(dt){
  if(!this.tutData)return;const p=this.player;if(!p)return;
  this.camX=cl(p.x-W/2,0,WW-W);this.camY=cl(p.y-H/2,0,WH-H);
  this.tutData.timer+=dt;p.update(dt,this.keys,this);
  if(p.hp<=0)p.hp=p.maxHp;
  for(const e of this.enemies)e.update(dt,p,this);
  for(let i=this.proj.length-1;i>=0;i--){const pr=this.proj[i];pr.update(dt);
    if(!pr.alive){this.proj.splice(i,1);continue;}
    if(pr.fr){let cn=false;
      for(const e of this.enemies){if(!e.alive)continue;
        if(d2(pr.x,pr.y,e.x,e.y)<(pr.r+e.z)**2){e.dmg(pr.dmg,pr.src);
          for(let j=0;j<3;j++)this.particles.push(new Part(e.x,e.y,pr.c));
          if(pr.pierce>0)pr.pierce--;else{cn=true;break;}}}
      if(cn)this.proj.splice(i,1);}}
  for(let i=this.slashes.length-1;i>=0;i--){this.slashes[i].update(dt);if(this.slashes[i].life<=0)this.slashes.splice(i,1);}
  const ne=[];
  for(const e of this.enemies){if(!e.alive){p.kills++;p.gainXp(e.xp);for(let j=0;j<6;j++)this.particles.push(new Part(e.x,e.y,e.c));}else ne.push(e);}
  this.enemies=ne;
  for(let i=this.particles.length-1;i>=0;i--){const pt=this.particles[i];pt.update(dt);if(pt.l<=0)this.particles.splice(i,1);}
  for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}
  this.updTutStep(dt);this.shake=Math.max(0,this.shake-dt*30);};

Game.prototype.updTutStep=function(dt){
  const p=this.player,td=this.tutData;
  if(this.tutStep===1){const dist=Math.sqrt((p.x-td.startX)**2+(p.y-td.startY)**2);if(dist>250){this.tutStep=2;td.timer=0;}}
  if(this.tutStep===2){
    if(!td.dummySpawned){const ex=cl(p.x+250,50,WW-50),ey=cl(p.y,50,WH-50);
      const dummy=new Enemy(ex,ey,{n:'Манекен',h:60,a:1,s:0.3,x:10,c:'#806040',z:18,l:1,sh:'circle'},this.loc.m);
      td.dummy=dummy;this.enemies.push(dummy);td.dummySpawned=true;}
    else if(!td.dummy||!td.dummy.alive){this.tutStep=3;td.timer=0;}}
  if(this.tutStep===3){for(const s in p.skills){if(p.skills[s].cd>0){this.tutStep=4;td.timer=0;return;}}
    if(td.timer>15){this.tutStep=4;td.timer=0;}}};

Game.prototype.evolveSkill=function(p,name){
  const evo=SKILL_EVO[name];if(!evo)return name;
  const next=evo.next;delete p.skills[name];
  p.skills[next]={tier:(evo.startTier||0),cd:0,resCd:0};
  for(let i=0;i<3;i++)if(p.slots[i]===name)p.slots[i]=next;
  this.ftxt.push(new FTxt('ЭВОЛЮЦИЯ: '+name+' → '+next,p.x,p.y-50,evo.color,3,22));
  AU.sfx('sec');return next;};

Game.prototype.triggerLv=function(){
  const p=this.player,r=RACES[p.rid];const ne=r.evo[p.es+1];
  if(ne&&p.lv>=ne.lv){this.doEvo(ne);return;}
  this.state='level_up';
  const pool=[
    {n:'+25 HP',k:'hp'},{n:'+10 MP',k:'mp'},{n:'+3 ATK',k:'atk'},
    {n:'+2 DEF',k:'def'},{n:'+0.3 SPD',k:'spd'},{n:'+3 MAG',k:'mag'},
    {n:'+2 RES',k:'res'},{n:'+3 LCK',k:'lck'},{n:'+2% крит',k:'crit'},
    {n:'+1 пробитие',k:'pierce'},{n:'+15% радиус AoE',k:'aoe'}
  ];
  if(p.cdr<0.75)pool.push({n:'-5% перезарядка',k:'cdr'});
  if(p.hpRegenPct<0.05)pool.push({n:'+0.5% HP-реген',k:'hpreg'});
  const own=Object.keys(p.skills);
  if(own.length){
    const evoSkills=own.filter(sk=>SKILL_EVO[sk]&&SKILL_EVO[sk].next);
    const affordable=evoSkills.filter(sk=>p.frag>=evoFragCost(sk));
    if(affordable.length>0){const sk=pick(affordable);const evo=SKILL_EVO[sk];const cost=evoFragCost(sk);
      const costStr=cost>0?' ('+cost+' оск.)':'';
      pool.unshift({n:sk+' → '+evo.next+costStr,k:'evoSk',sk,cost});}
    const nonEvo=own.filter(sk=>!SKILL_EVO[sk]);
    if(nonEvo.length){const affordableUp=nonEvo.filter(sk=>{const ct=p.skills[sk].tier;
        if(ct>=TI.length-1)return false;const cost=ct>=3?7:(ct>=2?4:0);return p.frag>=cost;});
      if(affordableUp.length>0){const sk=pick(affordableUp);const ct=p.skills[sk].tier;
        const cost=ct>=3?7:(ct>=2?4:0);const newDn=skillDisplayName(sk,ct+1);
        const costStr=cost>0?' ('+cost+' оск.)':'';
        pool.push({n:skillDisplayName(sk,ct)+' → '+newDn+' ('+TI[ct+1]+')'+costStr,k:'skUp',sk,cost});}}}
  if(Object.keys(p.skills).length<3){
    const av=Object.keys(SKILLS).filter(s=>!p.skills[s]&&!Object.values(SKILL_EVO).some(e=>e.next===s)&&!SKILLS[s].ult);
    if(av.length){const ns=pick(av);pool.push({n:'Навык: '+ns,k:'newSk',sk:ns});}}
  const avSp=SPELLS.filter(s=>!p.spells.find(x=>x.def.n===s.n));
  if(avSp.length){const ns=pick(avSp);pool.push({n:'Магия: '+ns.n,k:'newSp',sp:ns});}
  const avA=ARTS.filter(a=>!p.arts.find(x=>x.n===a.n));
  if(avA.length){const a=pick(avA);pool.push({n:'Артефакт: '+a.n,k:'art',a});}
  for(let i=pool.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const evoIdx=pool.findIndex(x=>x.k==='evoSk');
  if(evoIdx>1){[pool[1],pool[evoIdx]]=[pool[evoIdx],pool[1]];}
  this.lvc=pool.slice(0,Math.min(3,pool.length));AU.sfx('lvl');};

function optionInfo(c,p){
  switch(c.k){
    case 'hp':return {desc:'Здоровье',info:'Макс. HP: '+p.maxHp+' → '+(p.maxHp+25),color:'#ff6060'};
    case 'mp':return {desc:'Мана',info:'Макс. MP: '+p.maxMp+' → '+(p.maxMp+10),color:'#4060e0'};
    case 'atk':return {desc:'Атака',info:'ATK: '+p.atk+' → '+(p.atk+3),color:'#ff8080'};
    case 'def':return {desc:'Защита',info:'DEF: '+p.def+' → '+(p.def+2),color:'#60a0ff'};
    case 'spd':return {desc:'Скорость',info:'SPD: '+p.spd.toFixed(1)+' → '+(p.spd+0.3).toFixed(1),color:'#80ff80'};
    case 'mag':return {desc:'Магия',info:'MAG: '+p.mag+' → '+(p.mag+3),color:'#c060c0'};
    case 'res':{const nr=p.res+2;const cur=Math.min(50,p.res);const nx=Math.min(50,nr);
      return {desc:'Сопротивление',info:'RES: '+p.res+' → '+nr+' (маг. урон -'+cur.toFixed(0)+'% → -'+nx.toFixed(0)+'%)',color:'#a0c0ff'};}
    case 'lck':{const nl=p.lck+3;
      return {desc:'Удача',info:'LCK: '+p.lck+' → '+nl+' (+0.9% крит, +0.6% dodge, +1.5% крит-урон, +6% золото)',color:'#ffcc44'};}
    case 'crit':return {desc:'Крит',info:'Шанс крита: '+p.crit.toFixed(1)+'% → '+(p.crit+2).toFixed(1)+'%',color:'#ffaa44'};
    case 'pierce':return {desc:'Пробитие',info:'Pierce: +'+p.pierceBonus+' → +'+(p.pierceBonus+1)+' (+'+(p.pierceBonus*10)+'% → +'+((p.pierceBonus+1)*10)+'% лазер)',color:'#a0c0ff'};
    case 'aoe':return {desc:'Область поражения',info:'AoE: ×'+p.aoeMult.toFixed(2)+' → ×'+(p.aoeMult+0.15).toFixed(2),color:'#80e0ff'};
    case 'cdr':{const nc=Math.min(0.75,p.cdr+0.05);return {desc:'Снижение перезарядки',info:'CDR: '+(p.cdr*100).toFixed(0)+'% → '+(nc*100).toFixed(0)+'%'+(nc>=0.75?' (кап)':''),color:'#a0e0ff'};}
    case 'hpreg':{const nr=Math.min(0.05,p.hpRegenPct+0.005);return {desc:'Регенерация HP',info:'Реген HP: '+(p.hpRegenPct*100).toFixed(1)+'%/с → '+(nr*100).toFixed(1)+'%/с'+(nr>=0.05?' (кап)':''),color:'#80ff80'};}
    case 'skUp':{const sk=SKILLS[c.sk];const nt=p.skills[c.sk].tier+1;const cost=c.cost||0;return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[nt].toFixed(1)+' · Тир: '+TI[nt]+(cost>0?' · '+cost+' оск.':''),color:TC[nt]};}
    case 'evoSk':{const evo=SKILL_EVO[c.sk];const nsk=SKILLS[evo.next];const nt=evo.startTier||0;const t=evoFragCost(c.sk);return {desc:nsk?nsk.desc:'',info:'ЭВОЛЮЦИЯ! → '+evo.next+' · Тир '+TI[nt]+' · Урон ×'+TM[nt].toFixed(1)+(t>0?' · '+t+' оск.':''),color:TC[nt]};}
    case 'newSk':{const sk=SKILLS[c.sk];return {desc:sk.desc,info:'КД '+sk.cd+'с · Урон ×'+TM[0].toFixed(1)+' · Тир: '+TI[0],color:TC[0]};}
    case 'newSp':{const sp=c.sp;return {desc:'Новое заклинание',info:sp.d+' урона · '+sp.mp+' MP · КД '+sp.cd+'с · '+TI[sp.t],color:sp.c};}
    case 'art':return {desc:c.a.d,info:'Артефакт — пассивный бонус',color:'#ffcc44'};
  }
  return {desc:'',info:'',color:'#fff'};}

Game.prototype.pick=function(i){
  const c=this.lvc[i];
  if(!c){this.state='playing';if(this.pendingLv>0)this.pendingLv--;
    if(this.pendingLv>0)this.triggerLv();return;}
  const p=this.player;
  switch(c.k){
    case 'hp':p.maxHp+=25;p.hp+=25;break;
    case 'mp':p.maxMp+=10;p.mp+=10;break;
    case 'atk':p.atk+=3;break;
    case 'def':p.def+=2;break;
    case 'spd':p.spd+=.3;break;
    case 'mag':p.mag+=3;break;
    case 'res':p.res+=2;break;
    case 'lck':p.lck+=3;p.crit+=0.9;p.dod+=0.6;p.cdmg+=0.015;break;
    case 'crit':p.crit+=2;break;
    case 'pierce':p.pierceBonus+=1;break;
    case 'aoe':p.aoeMult+=0.15;break;
    case 'cdr':p.cdr=Math.min(0.75,p.cdr+0.05);break;
    case 'hpreg':p.hpRegenPct=Math.min(0.05,p.hpRegenPct+0.005);break;
    case 'skUp':
      if(c.cost&&c.cost>0)p.frag-=c.cost;
      p.skills[c.sk].tier++;
      this.ftxt.push(new FTxt(skillDisplayName(c.sk,p.skills[c.sk].tier)+' ('+TI[p.skills[c.sk].tier]+')',p.x,p.y-40,TC[p.skills[c.sk].tier],2,18));
      break;

          if(ls.dps<=0&&ls.hitIds.has(p)){dmg=0;}
          else if(ls.dps<=0){dmg=ls.dmg;ls.hitIds.add(p);}
          if(dmg>0){dmg*=(1-Math.min(0.5,p.res*0.01));
            if(p.buffs.stoic>0)dmg*=0.5;
            if(p.shield>0){const ab=Math.min(p.shield,dmg);p.shield-=ab;dmg-=ab;
              if(p.shield<=0)p.buffs.shield=0;}
            if(dmg>0)p.hp-=dmg;
            if(Math.random()<0.3)this.particles.push(new Part(p.x,p.y,ls.color));}}}}
    if(ls.friendly){
      for(const e of this.enemies){if(!e.alive)continue;
        if(!ls.hitsPoint(e.x,e.y,e.z))continue;
        if(ls.dps>0){e.dmg(ls.dps*dt,ls.src);}
        else if(!ls.hitIds.has(e)){e.dmg(ls.dmg,ls.src);ls.hitIds.add(e);}}
      for(const b of this.bosses){if(!b.alive)continue;
        if(!ls.hitsPoint(b.x,b.y,b.z))continue;
        if(ls.dps>0){b.dmg(ls.dps*dt,ls.src);}
        else if(!ls.hitIds.has(b)){b.dmg(ls.dmg,ls.src);ls.hitIds.add(b);}}}}
  for(let i=this.ftxt.length-1;i>=0;i--){const f=this.ftxt[i];f.update(dt);if(f.l<=0)this.ftxt.splice(i,1);}
  this.st-=dt;this.wt+=dt;
  if(this.st<=0 && this.waveEnemiesToSpawn>0 && this.bosses.length===0 && !this.finalWave){
    this.st=Math.max(.3,1.2-this.wave*.035);
    this.spawnEnemy();this.waveEnemiesToSpawn--;this.waveEnemiesSpawned++;}
  if(this.bosses.length===0)this.spawnBoss();
  if(this.state==='playing' && this.waveEnemiesToSpawn===0 && this.enemies.length===0 && this.bosses.length===0 && !this.finalWave){
    const nextWave=this.wave+1;
    const skipPart=this.pendingSkipGold||0;
    const waveBonus=2*this.wave + skipPart;
    p.gold+=waveBonus;
    if(skipPart>0){
      this.ftxt.push(new FTxt('+'+waveBonus+' золота (включая +'+skipPart+' отложено)',p.x,p.y-130,'#ffcc44',1.8,14));
      this.pendingSkipGold=0;
    } else {
      this.ftxt.push(new FTxt('+'+waveBonus+' золота',p.x,p.y-130,'#ffcc44',1.8,14));
    }
    if(FORGE_RANK_BY_NEXT[nextWave]!==undefined && !this.forgePending){
      this.forgeRank=FORGE_RANK_BY_NEXT[nextWave];
      this.forgeItems=WEAPONS.filter(w=>w.rank===this.forgeRank);
      this.forgePending=true;this.state='forge';AU.music('menu');return;}
    this.wave++;this.forgePending=false;
    this.waveEnemiesToSpawn=5+this.wave*2;this.waveEnemiesSpawned=0;this.wt=0;
    this.ftxt.push(new FTxt('Волна '+this.wave,p.x,p.y-150,'#fff',2,26));
    AU.sfx('wave');
    if(this.wave%5===0)AU.sfx('boss');}
  this.checkSecretChain();
  this.shake=Math.max(0,this.shake-dt*30);
  if(p.hp<=0){
    this.recordRun();
    AU.sfx('defeat');this.state='game_over';
    setTimeout(()=>AU.stop(),1500);}};

Game.prototype.rGame=function(){
  this.bg(this.loc?this.loc.bg:'#0a0a12');
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sh(this.loc?this.loc.bg:'#0a0a12',20));g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();
  const shX=this.shake>0?rnd(-this.shake,this.shake):0;
  const shY=this.shake>0?rnd(-this.shake,this.shake):0;
  ctx.translate(-this.camX+shX,-this.camY+shY);
  ctx.strokeStyle='rgba(80,200,220,.06)';ctx.lineWidth=1;
  const gx0=Math.floor(this.camX/80)*80;const gy0=Math.floor(this.camY/80)*80;
  for(let gx=gx0;gx<=this.camX+W;gx+=80){ctx.beginPath();ctx.moveTo(gx+.5,this.camY);ctx.lineTo(gx+.5,this.camY+H);ctx.stroke();}
  for(let gy=gy0;gy<=this.camY+H;gy+=80){ctx.beginPath();ctx.moveTo(this.camX,gy+.5);ctx.lineTo(this.camX+W,gy+.5);ctx.stroke();}
  if(this.pools)for(const pl of this.pools){const a=pl.life/pl.maxLife;
    ctx.globalAlpha=a*0.35;ctx.fillStyle=pl.color;
    ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r,0,7);ctx.fill();
    ctx.globalAlpha=a*0.55;ctx.strokeStyle=pl.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pl.x,pl.y,pl.r*(0.7+a*0.3),0,7);ctx.stroke();ctx.globalAlpha=1;}
  for(const e of this.enemies){if(e.x<this.camX-80||e.x>this.camX+W+80||e.y<this.camY-80||e.y>this.camY+H+80)continue;e.draw();}
  for(const b of this.bosses)b.draw();
  if(this.mines)for(const m of this.mines){const prog=1-m.life/m.maxLife;
    const pulse=0.4+Math.sin(performance.now()/80)*0.3;
    ctx.globalAlpha=pulse;ctx.strokeStyle=m.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(m.x,m.y,m.r+8+prog*12,0,7);ctx.stroke();
    ctx.globalAlpha=0.65;ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(m.x,m.y,m.r*0.7,0,7);ctx.fill();
    ctx.globalAlpha=0.35;ctx.strokeStyle='#ffffff';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(m.x,m.y,m.r+4,0,7);ctx.stroke();ctx.globalAlpha=1;}
  if(this.lasers)for(const ls of this.lasers)ls.draw();
  for(const sl of this.slashes)sl.draw();
  for(const pr of this.proj)pr.draw();
  for(const pt of this.particles)pt.draw();
  if(this.player)this.player.draw();
  for(const f of this.ftxt)f.draw();
  ctx.restore();
  if(this.player)this.rHUD();
  if(this.timeSlowTimer>0){ctx.fillStyle='rgba(80,160,255,'+(this.timeSlowTimer*0.06)+')';ctx.fillRect(0,0,W,H);
    tx('◈ ЗАМЕДЛЕНИЕ ВРЕМЕНИ ◈',W/2,40,{size:16,color:'#a0d0ff',align:'center',glow:'#a0d0ff'});}
  if(this.flash>0){ctx.fillStyle='rgba(255,255,255,'+this.flash+')';ctx.fillRect(0,0,W,H);}
};

  const fadeIn=Math.min(1,elapsed*2);
  ctx.globalAlpha=fadeIn;ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  for(let i=0;i<80;i++){const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.08+Math.abs(Math.sin(t*1.5+i))*.25;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const luvAlpha=Math.max(0,1-elapsed*0.5);
  if(luvAlpha>0){const luvSize=42*(1+elapsed*0.15);
    ctx.globalAlpha=luvAlpha*0.85;shape('winged',W/2,H/2-40,luvSize,sh(cd.color,-40),false);
    for(let i=0;i<15;i++){const angle=Math.random()*6.283;const r=Math.random()*80;
      const px=W/2+Math.cos(angle)*r;const py=H/2-40+Math.sin(angle)*r;
      ctx.globalAlpha=luvAlpha*Math.random()*0.9;ctx.fillStyle=cd.color;
      ctx.beginPath();ctx.arc(px,py,Math.random()*3+1,0,7);ctx.fill();}
    ctx.globalAlpha=1;}
  if(elapsed>1&&elapsed<3){const waveProg=(elapsed-1)/2;const waveR=50+waveProg*300;
    ctx.strokeStyle='rgba(192,192,255,'+(1-waveProg)*0.6+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,204,68,'+(1-waveProg)*0.4+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,H/2-40,waveR*0.7,0,7);ctx.stroke();}
  if(elapsed>1&&elapsed<4){const riseProg=(elapsed-1)/3;const count=Math.floor(riseProg*40);
    for(let i=0;i<count;i++){const angle=(i/count)*6.283+t;const r=40+riseProg*100;
      const px=W/2+Math.cos(angle)*r*0.7;const py=H/2-40+Math.sin(angle)*r*0.4-riseProg*60;
      ctx.globalAlpha=0.8-riseProg*0.5;ctx.fillStyle='#ffcc44';
      ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();}
    ctx.globalAlpha=1;}
  if(elapsed>2){const slimeProg=Math.min(1,(elapsed-2)/2);const slimeSize=20+slimeProg*45;
    ctx.globalAlpha=slimeProg;ctx.fillStyle='rgba(80,200,220,0.15)';
    ctx.beginPath();ctx.arc(W/2,H/2-40,slimeSize*2,0,7);ctx.fill();
    shape('circle',W/2,H/2-40,slimeSize,'#50c8dc',false);
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35,H/2-40-slimeSize*.15,slimeSize*.13,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(W/2-slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(W/2+slimeSize*.35+1,H/2-40-slimeSize*.15-1,slimeSize*.05,0,7);ctx.fill();
    ctx.strokeStyle='#50c8dc';ctx.lineWidth=2;
    for(let i=0;i<8;i++){const angle=i/8*6.283+t*0.5;
      const r1=slimeSize*1.3,r2=slimeSize*1.3+15;
      ctx.globalAlpha=slimeProg*0.6;ctx.beginPath();
      ctx.moveTo(W/2+Math.cos(angle)*r1,H/2-40+Math.sin(angle)*r1);
      ctx.lineTo(W/2+Math.cos(angle)*r2,H/2-40+Math.sin(angle)*r2);ctx.stroke();}
    ctx.globalAlpha=1;}
  const textLines=[
    {l:0.3,t:'Иварадж поглощает Веланаву и Люсию...',c:'#ff40a0'},
    {l:1.5,t:'Но Римуру поглощает самого Ивараджа.',c:'#c080ff'},
    {l:2.7,t:'Четыре Истинных Дракона обрели покой...',c:'#50c8dc'},
    {l:3.7,t:'Слизь стал Богом Пустоты.',c:'#ffcc44'}];
  for(let i=0;i<textLines.length;i++){const tl=textLines[i];
    if(elapsed>=tl.l){const alpha=Math.min(1,(elapsed-tl.l)*2);
      ctx.globalAlpha=alpha;
      txFit(tl.t,W/2,H/2+150+i*30,W-100,{size:18,color:tl.c,align:'center',glow:tl.c,glowBlur:10*alpha},12);
      ctx.globalAlpha=1;}}
  if(elapsed>1.5){const btnX=W-220,btnY=H-70,btnW=200,btnH=50;
    const hv=this.mx>=btnX&&this.mx<=btnX+btnW&&this.my>=btnY&&this.my<=btnY+btnH;
    const alpha=Math.min(1,(elapsed-1.5)*2);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=hv?'rgba(60,110,140,.95)':'rgba(30,50,80,.85)';ctx.fillRect(btnX,btnY,btnW,btnH);
    ctx.strokeStyle=hv?'#80e0f0':'#4060a0';ctx.lineWidth=2;ctx.strokeRect(btnX,btnY,btnW,btnH);
    tx('ПРОПУСТИТЬ',btnX+btnW/2,btnY+31,{size:16,weight:'bold',color:hv?'#fff':'#c8d0e0',align:'center'});
    ctx.globalAlpha=1;}
};

Game.prototype.rVictory=function(){
  const p=this.player;const t=performance.now()/1000;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++){const x=(Math.sin(t*.3+i*1.7)*.5+.5)*W;
    const y=(Math.cos(t*.2+i*.9)*.5+.5)*H;
    ctx.globalAlpha=.05+Math.abs(Math.sin(t*1.5+i))*.15;
    ctx.fillStyle=i%3===0?'#ffcc44':(i%3===1?'#50c8dc':'#c080ff');
    ctx.beginPath();ctx.arc(x,y,1+Math.sin(t+i)*1,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(W/2,180+Math.sin(t)*5);
  shape('slime',0,0,55,'#50c8dc',false);
  for(let i=0;i<12;i++){const a=t*.6+i/12*6.283;const r=80+Math.sin(t*2+i)*20;
    ctx.globalAlpha=.4+Math.sin(t*3+i)*.3;ctx.fillStyle='#ffcc44';
    ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2,0,7);ctx.fill();}
  ctx.restore();ctx.globalAlpha=1;
  const glow=Math.sin(t*2)*0.3+0.7;
  tx('✦ ИСТИННЫЙ ФИНАЛ ✦',W/2,320,{size:48,weight:'bold',color:'#ffcc44',align:'center',glow:'#ffcc44',glowBlur:40*glow});
  tx('Хроники Истинных Драконов завершены',W/2,365,{size:20,color:'#a0c0ff',align:'center'});
  const lines=[
    'Иварадж поглотил Веланаву и Люсию — но Римуру поглотил их обоих.',
    'Четыре Истинных Дракона обрели покой в его клинке.',
    'Слизь, ставшая Повелителем Монстров, поднялась до Бога Пустоты.',
    '','Вельдора наконец свободен. Вельзард и Ги Кримзон вернулись на Север.',
    'Милим Нава улыбается. Леон, Ламирис, Диабло — все живы.',
    'Темпест стоит. Мир Тенсуры — тоже.','',
    'И где-то далеко, в другом мире, Миками Сатору больше не один.'];
  let ly=410;
  for(const line of lines){txFit(line,W/2,ly,W-80,{size:14,color:line.startsWith('—')?'#ffcc44':'#e6e6f0',align:'center'},10);ly+=26;}
  tx('Уровень '+p.lv+'   •   Волна 50   •   Убийств '+p.kills+'   •   Артефактов '+p.arts.length,W/2,H-110,{size:14,color:'#a0a8b8',align:'center'});
  tx('⏱ Время прохождения: '+fmtTime(this.runTime),W/2,H-140,{size:18,weight:'bold',color:'#80c0ff',align:'center'});
  tx('Секретных побед: '+(SV.d.secWins||1),W/2,H-85,{size:12,color:'#ffcc44',align:'center'});
  const hv=this.hov(W/2-200,H-55,400,40);
  ctx.fillStyle=hv?'rgba(50,80,110,.9)':'rgba(30,45,65,.8)';
  ctx.fillRect(W/2-200,H-55,400,40);
  ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;ctx.strokeRect(W/2-200,H-55,400,40);
  tx('Нажмите любую клавишу или кликните',W/2,H-30,{size:14,color:hv?'#fff':'#c8d0e0',align:'center'});
};

Game.prototype.rTutorial=function(){
  this.rGame();
  const boxW=740,boxH=230;
  const boxX=W/2-boxW/2,boxY=H-boxH-25;
  ctx.fillStyle='rgba(10,15,30,.88)';ctx.fillRect(boxX,boxY,boxW,boxH);
  ctx.strokeStyle='#50c8dc';ctx.lineWidth=2;ctx.strokeRect(boxX,boxY,boxW,boxH);
  const tips=[
    {title:'📖 Добро пожаловать!',lines:[
      'Обучающий режим научит основам за 3-4 минуты.',
      'Управление: WASD — движение, Q/E/R — навыки, Space — уворот, F/ПКМ — парирование, V — авто-зелье, Esc — пауза.',
      'Space — продолжить, Esc — выйти в меню.']},
    {title:'🚶 Движение',lines:[
      'Используйте WASD (или стрелки) для перемещения.',
      'Пройдите немного в любую сторону, чтобы продолжить.']},
    {title:'⚔️ Бой',lines:[
      'Персонаж атакует автоматически. Ближний бой (мечи, косы) наносит урон по площади, дальний (луки, посохи) стреляет снарядами.',
      'Убейте тренировочного манекена. Он не атакует.']},
    {title:'🌀 Навыки и резонанс',lines:[
      'Навыки используются клавишами Q, E, R.',
      'Навыки вне слотов дают +3% урона и авто-кастуются раз в 1.5 сек.',
      'Нажмите Q — применить «Универсальное Превращение».']},
    {title:'💨 Уворот, парирование, авто-зелье',lines:[
      'Space — уворот: 0.25 сек неуязвимости, КД 1.5 сек.',
      'F или ПКМ — ПАРИРОВАНИЕ: 0.3 сек окно, КД 3 сек. При успехе КД сбрасывается и отражает пули с ×2 уроном!',
      'V — авто-зелье: лечит 15% HP при HP<25%, КД 5 сек.']},
    {title:'⬆️ Прокачка и осколки',lines:[
      'Level-up — 11 опций: HP, MP, ATK, DEF, SPD, MAG, RES, LCK, CRIT, Pierce, AoE.',
      'LCK: +0.3% крит, +0.2% dodge, +0.5% крит-урон, +2% золото за 1.',
      'RES: -1% урона от снарядов/лазеров/яда за 1 (кап 50%).']},
    {title:'⚠️ ВОЛНА 35',lines:[
      'Боссы каждые 5 волн начиная с 10-й.',
      'На 35-й — Вельдора и Вельгринд, ★-боссы. Урон только от Высших навыков.',
      'Копите 4 осколка (5 боссов дают ~20) и эволюционируйте навык.']},
    {title:'🎯 Кузня и оружие',lines:[
      'Кузня открывается после зачистки волн 9/14/19/24/29/34/39/44/49.',
      'Более 50 видов оружия в 7 классах. Ближний бой, стрелы, магия.',
      'Цены растут с рангом. Пропуск волны копит золото до следующей зачистки.']},
    {title:'🔥 ГНЕВ БОССА',lines:[
      'Убить босса <20 сек — он впадёт в ГНЕВ: неуязвим, ATK ×2→×4.',
      'С 3-й по 17-ю секунду гнева перезарядка атак растёт ×1→×2.',
      'Переживите 20 сек — босс падает. Веланава не умирает (HP=1).']},
    {title:'✅ Готовы!',lines:[
      'Теперь вы знаете основы Tensura Survival.',
      'Space — вернуться в меню.',
      'Esc — выйти в меню.']}];
  const tip=tips[this.tutStep];
  if(tip){tx(tip.title,boxX+20,boxY+32,{size:20,weight:'bold',color:'#ffcc44'});
    let ty=boxY+68;
    for(let i=0;i<tip.lines.length;i++){const wrapped=wrapText(tip.lines[i],boxW-40,13,'');
      for(let j=0;j<wrapped.length;j++){if(ty+14>boxY+boxH-10)break;
        txClip(wrapped[j],boxX+20,ty,boxW-40,{size:13,color:'#e6e6f0'});ty+=18;}}
    tx('Шаг '+(this.tutStep+1)+' / '+tips.length,boxX+boxW-20,boxY+32,{size:12,color:'#a0c0ff',align:'right'});}
};
